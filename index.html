/* Pulls the latest learners/workshops/skills/rewards from the shared cloud
   store and merges them into APP in place. Used both by loadAllData() at boot
   AND, repeatedly, by the Camp Log auto-refresh below -- this is what lets a
   parent's already-open Camp Log notice a child's progress on ANOTHER device
   without the parent having to reload the page (the app only ever fetched
   once at boot before this). Returns true if it actually touched the cloud
   (false when running fully offline/local-only, e.g. in tests). */
function learnerRecordOrNull(o){ return o?learnerRecord(o):null; }
async function refreshCloudData(){
  if(!Store.db)return false;
  // Firebase Realtime Database silently drops keys whose value is an empty
  // array/object (e.g. badges:[] or checkins:{}) instead of storing them —
  // merging onto a freshly-built default object restores those keys so the
  // UI never sees `undefined` where it expects an array/object.
  for(const id of Object.keys(LEARNERS_META)){
    const lp=`learners/${id}`, wp=`learners/${id}/workshop`;
    let seq=Store.writeSeq;
    const remote=await Store.dbGet(lp);
    if(remote&&Store.savedSince(lp,seq)){ /* saved locally while this read was in flight — keep the newer local copy (already pushed to the cloud by its own save) */ }
    else if(remote){ const merged=Object.assign(defaultLearner(id),learnerRecord(remote)); APP.learners[id]=merged; Store.lsSet(`learners/${id}`,merged); }
    else{ APP.learners[id]=learnerRecord(APP.learners[id]); Store.dbUpdate(`learners/${id}`,APP.learners[id]); }
    seq=Store.writeSeq;
    const remoteWs=await Store.dbGet(wp);
    if(remoteWs&&Store.savedSince(wp,seq)){ /* newer local copy wins */ }
    else if(remoteWs){ const mergedWs=Object.assign(defaultWorkshop(),remoteWs); APP.workshops[id]=mergedWs; Store.lsSet(`learners/${id}/workshop`,mergedWs); }
    else{ Store.dbSet(`learners/${id}/workshop`,APP.workshops[id]); }
    // Fetched in parallel: with the next-grade + Life Skills tiers each learner now has
    // ~25 skills, and one-at-a-time round trips would make every refresh noticeably slow.
    const skillDefs=LEARNERS_META[id].skills;
    seq=Store.writeSeq;
    const remotes=await Promise.all(skillDefs.map(sk=>Store.dbGet(`learners/${id}/skills/${sk.id}`)));
    skillDefs.forEach((sk,k)=>{
      const remoteSk=remotes[k];
      const sp=`learners/${id}/skills/${sk.id}`;
      if(remoteSk&&Store.savedSince(sp,seq)) return; // answered during this read — keep the live local state
      if(remoteSk){ const mergedSk=Object.assign(makeSkillState(),remoteSk); APP.skillStates[id][sk.id]=mergedSk; Store.lsSet(`learners/${id}/skills/${sk.id}`,mergedSk); }
      else{ if(!APP.skillStates[id][sk.id]) APP.skillStates[id][sk.id]=makeSkillState(); Store.dbSet(`learners/${id}/skills/${sk.id}`,APP.skillStates[id][sk.id]); }
    });
  }
  const rseq=Store.writeSeq;
  const remoteRewards=await Store.dbGet('rewards/list');
  if(remoteRewards&&Store.savedSince('rewards/list',rseq)){ /* newer local copy wins */ }
  else if(remoteRewards){ const mergedRewards=Object.assign({items:DEFAULT_REWARDS.slice()},remoteRewards); APP.rewards=mergedRewards; Store.lsSet('rewards/list',mergedRewards); }
  else{ Store.dbSet('rewards/list',APP.rewards); }
  migrateRewardsIfLegacy();
  APP.lastCloudSyncAt=Date.now();
  return true;
}
/* Camp Log auto-refresh: while a parent/admin is sitting on the Camp Log tab,
   poll the cloud every 15s so a child's just-completed session (on a
   different device/browser) shows up without a manual page reload. Guarded
   so it only ever runs one interval at a time and stops the moment the
   viewer leaves Camp Log or logs out (see ensureCampPolling(), called from
   render()). */
let campPollTimer=null;
let campPollActive=false; // tracks "polling is arranged", independent of whether setInterval
                           // even exists in this JS environment (it doesn't in some test sandboxes) --
                           // this is what stops render() from re-firing a fetch on every single call
                           // while the viewer sits on Camp Log.
async function pollCampLogOnce(){
  if(!APP.auth.currentUser||APP.activeTab!=='camp'){ stopCampPolling(); return; }
  const changed=await refreshCloudData();
  if(changed && APP.auth.currentUser && APP.activeTab==='camp') render();
}
function startCampPolling(){
  if(campPollActive)return;
  campPollActive=true;
  pollCampLogOnce(); // refresh immediately on arrival, don't wait for the first tick
  if(typeof setInterval==='function'){
    campPollTimer=setInterval(pollCampLogOnce,15000);
    if(campPollTimer&&typeof campPollTimer.unref==='function')campPollTimer.unref(); // don't keep a Node test process alive
  }
}
function stopCampPolling(){
  campPollActive=false;
  if(campPollTimer){ if(typeof clearInterval==='function')clearInterval(campPollTimer); campPollTimer=null; }
}
function ensureCampPolling(){
  const onCampLog=APP.auth.currentUser && APP.auth.currentUser.role!=='student' && APP.activeTab==='camp';
  if(onCampLog){ if(!campPollActive) startCampPolling(); }
  else stopCampPolling();
}
/* Manual "Refresh" button in Camp Log, for a parent who doesn't want to wait
   for the 15s auto-poll. */
async function refreshCampLogNow(){
  if(!Store.db){ toast('目前是本機模式（尚未連接雲端同步）。'); return; }
  toast('正在更新最新進度...');
  await refreshCloudData();
  if(APP.activeTab==='camp') render();
  toast('Camp Log 已更新！');
}
/* A learner's skills and Trail Time workshop live UNDER the learner's node in Firebase
   (learners/<id>/skills/..., learners/<id>/workshop). Reading learners/<id> therefore returns
   that whole subtree, and the old saveLearner() wrote it straight back with set() — so every
   profile save (after every session / token) replaced ALL skills and the workshop with the
   stale copy captured at the last sync, rolling progress back. Found in live testing. Now the
   learner record never carries those children, and it is saved with update() (merge), which
   leaves the separately-saved skills/ and workshop/ nodes untouched. */
function learnerRecord(obj){ const o=Object.assign({},obj); delete o.skills; delete o.workshop; return o; }
function saveLearner(id){ APP.learners[id]=learnerRecord(APP.learners[id]); Store.saveFields(`learners/${id}`,APP.learners[id]); }
function saveSkill(id,skillId){ Store.save(`learners/${id}/skills/${skillId}`,APP.skillStates[id][skillId]); }
function saveWorkshop(id){ Store.save(`learners/${id}/workshop`,APP.workshops[id]); }
function saveRewards(){ Store.save('rewards/list',APP.rewards); }

/* ================= GAME LOGIC HELPERS ================= */
/* Leveling used to hard-stop at Level 10 ("MAX") — every bit of XP earned after that
   point vanished into a flat progress bar that never moved again. Levels now climb
   without a ceiling: each band of 10 levels costs a bit more XP than the last (so
   early levels still come quickly, keeping new learners motivated, while deep
   progress stays a long-term goal instead of trivializing itself) and each band
   carries its own Rank name, so the header keeps changing even long after any
   individual skill's difficulty has topped out. LEVEL_XP_STEP is kept only as the
   base cost for band 0, for any old code/tests that reference it. */
const LEVEL_XP_STEP=150;
const LEVEL_SOFT_CAP=300; // purely a runaway-loop guard, not a real ceiling
const RANK_NAMES=['Scout','Trailblazer','Pathfinder','Summiteer','Voyager Elite','Mythic Ranger','Trail Legend'];
function xpCostForLevel(level){ // XP required to advance FROM `level` TO `level+1`
  const band=Math.floor((level-1)/10);
  return Math.round(LEVEL_XP_STEP*Math.pow(1.12,band));
}
function rankForLevel(level){ const band=Math.min(RANK_NAMES.length-1,Math.floor((level-1)/10)); return RANK_NAMES[band]; }
function levelFromXp(xp){
  let level=1,remaining=xp;
  while(level<LEVEL_SOFT_CAP && remaining>=xpCostForLevel(level)){ remaining-=xpCostForLevel(level); level++; }
  return level;
}
function xpIntoLevel(xp){
  let level=1,remaining=xp;
  while(level<LEVEL_SOFT_CAP && remaining>=xpCostForLevel(level)){ remaining-=xpCostForLevel(level); level++; }
  return remaining;
}
function touchStreak(learner){
  const today=todayStr();
  if(learner.lastActiveDate===today)return false;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  learner.streakDays=(learner.lastActiveDate===y)?learner.streakDays+1:1;
  learner.lastActiveDate=today;
  return true;
}
function ensureTodayLog(learner){
  const today=todayStr();
  if(!learner.todayLog||learner.todayLog.date!==today){
    // Day rollover: archive yesterday's snapshot before resetting, so Camp Log can
    // show a short daily-progress history (route-completion rate + accuracy rate).
    if(learner.todayLog){
      if(!learner.history)learner.history=[]; // guards Firebase's empty-array-drop quirk
      const prev=learner.todayLog;
      const routeDone=[prev.mathDone,prev.readingDone,prev.workshopDone,prev.journalDone].filter(Boolean).length;
      learner.history.push({date:prev.date,routeDone,answeredCount:prev.answeredCount||0,correctCount:prev.correctCount||0,focusSec:prev.focusSec||0,focusBlocks:prev.focusBlocks||0});
      learner.history=learner.history.slice(-120); // ~17 weeks, enough to back Camp Log's 12-week Weekly Summary chart
    }
    learner.todayLog={date:today,mathDone:false,readingDone:false,workshopDone:false,journalDone:false,lifeDone:false,answeredCount:0,correctCount:0,focusSec:0,focusBlocks:0};
  }
  // Defensive: a todayLog for TODAY created before these two counters existed
  // (an in-progress day carried over from an older build) won't have them yet.
  if(learner.todayLog.answeredCount==null)learner.todayLog.answeredCount=0;
  if(learner.todayLog.correctCount==null)learner.todayLog.correctCount=0;
  if(learner.todayLog.focusSec==null)learner.todayLog.focusSec=0;
  if(learner.todayLog.focusBlocks==null)learner.todayLog.focusBlocks=0;
}
/* Marks one of today's 4 route stops (math, reading, workshop check-in,
   closing circle) as done for today's route checklist — this only controls
   the ✓ shown on Today's Route, it does NOT award tokens itself (see
   finalizeCommon for practice sessions, and toggleCheckin/addJournal for the
   other two, which each decide their own token rule). Returns true if this
   call is the first time today this particular stop flipped to done. */
function markTodayLog(learner,key){
  ensureTodayLog(learner);
  if(learner.todayLog[key])return false;
  learner.todayLog[key]=true;
  return true;
}
/* Per-skill daily token cap (request: "每個session一天最多只能得到1個token" --
   each individual skill, e.g. addition vs subtraction, can earn at most 1
   token per day, even if the child does several good sessions of the SAME
   skill). A different skill that same day still earns its own token. */
function ensureTokenLog(learner){
  const today=todayStr();
  if(!learner.tokenLog||learner.tokenLog.date!==today) learner.tokenLog={date:today,awarded:{}};
  if(!learner.tokenLog.awarded)learner.tokenLog.awarded={}; // guards Firebase's empty-object-drop quirk
}
/* Records every token actually awarded, so Camp Log can show a parent where a
   child's tokens came from (request: "家長帳戶能統計小孩token從哪個session獲得的分布"). */
function logTokenAward(learner,source){
  if(!learner.tokenHistory)learner.tokenHistory=[]; // guards Firebase's empty-array-drop quirk
  learner.tokenHistory.push({date:todayStr(),source});
  learner.tokenHistory=learner.tokenHistory.slice(-200);
}
/* Records every completed practice session / comprehension passage with its
   own score, so Camp Log can show per-session accuracy (request: "家長帳戶中的
   Daily Progress 要展開到每個session 正確率"), not just one rolled-up daily number. */
function logSessionResult(learner,skillId,correct,total,sec){
  if(!learner.sessionLog)learner.sessionLog=[]; // guards Firebase's empty-array-drop quirk
  const entry={date:todayStr(),time:Date.now(),skillId,correct,total};
  if(sec>0){ entry.sec=Math.round(sec); ensureTodayLog(learner); learner.todayLog.focusSec=(learner.todayLog.focusSec||0)+entry.sec; }
  learner.sessionLog.push(entry);
  learner.sessionLog=learner.sessionLog.slice(-3000); // generous enough to back a full year of per-skill accuracy charts
}
function checkBadges(learnerId){
  const learner=APP.learners[learnerId]; const ss=APP.skillStates[learnerId];
  const newly=[];
  for(const b of BADGE_DEFS){
    if(learner.badges.includes(b.id))continue;
    if(b.check(learner,ss,LEARNERS_META[learnerId].passages.length,LEARNERS_META[learnerId])){ learner.badges.push(b.id); newly.push(b); }
  }
  return newly;
}
function skillLabelMap(learnerId){
  const map={}; LEARNERS_META[learnerId].skills.forEach(s=>map[s.id]=s); return map;
}

  // has its own arrival-refresh + periodic poll via ensureCampPolling). This
  // is the same staleness bug as Camp Log going stale: the app otherwise only
  // ever fetched cloud data once at boot, so e.g. a session finished on
  // ANOTHER device (or in an older still-open tab) would leave "Last
  // practiced" stuck showing "-" here until a full page reload. Skipped
  // while a quiz/passage is actually in progress so a background fetch can
  // never clobber live in-progress answers with slightly-older cloud data.
  if(id!=='camp' && !session && !comp){

/* ================= SESSION ENGINE (practice quiz) ================= */
let session=null;
function openModal(html){
  const root=document.getElementById('modalRoot');
  // openModal() re-runs on every in-modal interaction (keypad press, field select,
  // answering, advancing), not just when the modal first appears -- it fully replaces
  // modalRoot's markup each time. Reported bug: "點擊答案選項會造成畫面閃爍" (clicking an
  // answer flickers the screen), caused by the overlay/card entrance animation below
  // replaying on every single one of those updates. Only add the "entering" class (and
  // so only play the entrance animation) on a genuine fresh open, i.e. when the modal
  // wasn't already showing -- never on an update to an already-open modal.
  const isFreshOpen=!root.innerHTML;
  root.innerHTML=`<div class="modal-overlay${isFreshOpen?' modal-entering':''}" id="modalOverlay">${html}</div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; session=null; }
function stopProp(ev){ ev.stopPropagation(); }

const CORRECT_PHRASES=['Nice work!','Boom — got it!',"You're on fire!",'Excellent!','Way to go!','Superstar move!','Nailed it!','Awesome job!','Brilliant!','Crushed it!'];
// "Failure is fuel — it's just data" (video): a miss tells you what to work on next, it's not a red F.
const WRONG_PHRASES=['Not quite — that’s useful data!','So close! Now you know more.','Mistakes are fuel.','Almost — check how it works:','Good try — learn this one:','Every miss shows the next step.'];
/* mode 'divmod' (quotient+remainder) and 'fraction' (numerator+denominator)
   answer with two typed fields instead of one -- this is what lets a division
   question be answered as "22 remainder 2" instead of forcing a single
   number, and a fraction question be answered as a real n/d instead of just
   a numerator. fieldDefsFor() returns the ordered field keys for a mode, or
   null for the plain single-value modes ('numeric'/'mc'). */
function fieldDefsFor(mode){
  if(mode==='divmod')return['q','r'];
  if(mode==='fraction')return['n','d'];
  return null;
}
function startSession(skillId){
  const learnerId=APP.currentLearnerId;
  const skillDef=skillLabelMap(learnerId)[skillId];
  if(skillDef&&!isSkillUnlocked(learnerId,skillDef)){ toast('This skill unlocks when you master the one before it!'); return; }
  session={learnerId,skillId,qIndex:0,total:8,correctCount:0,xpEarned:0,missedQueue:0,answered:false,numericInput:'',fields:{},activeField:null,selected:null,currentIsReview:false,comboStreak:0,seenPrompts:new Set(),activeMs:0,lastTick:Date.now()};
  nextQuestionInSession();
  openModal(renderSessionModal());
}
function nextQuestionInSession(){
  const state=APP.skillStates[session.learnerId][session.skillId];
  const gen=GENERATORS[session.skillId];
  let isReview=false;
  if(session.qIndex>0&&session.qIndex%4===0&&session.missedQueue>0){ isReview=true; session.missedQueue--; }
  /* Avoid repeating the exact same question within one session (request: "每個session
     出過的題目盡可能不要再重複出現"). Procedural generators are randomized, so a handful
     of retries on an exact prompt collision is normally enough; bank-based generators
     already shuffle through the whole bank before repeating, so this rarely triggers for
     them. The retry cap keeps this safe for very small combinatorial spaces (e.g. a
     prime/composite check) where a repeat is sometimes unavoidable. */
  if(!session.seenPrompts) session.seenPrompts=new Set();
  let q,tries=0;
  do{ q=gen(state.difficulty); tries++; }while(session.seenPrompts.has(q.dedupeKey||q.prompt)&&tries<8);
  session.seenPrompts.add(q.dedupeKey||q.prompt);
  session.currentQuestion=q;
  session.currentIsReview=isReview; session.answered=false; session.numericInput=''; session.selected=null;
  const fields=fieldDefsFor(session.currentQuestion.mode);
  session.fields=fields?Object.fromEntries(fields.map(f=>[f,''])):{};
  session.activeField=fields?fields[0]:null;
}
function fieldLabelsFor(mode){
  return mode==='divmod'?[{key:'q',label:'Quotient'},{key:'r',label:'Remainder'}]:[{key:'n',label:'Numerator'},{key:'d',label:'Denominator'}];
}
function renderCompoundAnswerUI(q,av){
  const defs=fieldLabelsFor(q.mode);
  const sep=q.mode==='divmod'?'R':'/';
  const boxes=defs.map((d,i)=>{
    const active=session.activeField===d.key;
    const box=`<div class="field-box mono" data-active="${active}" onclick="setActiveField('${d.key}')">${esc(session.fields[d.key]||'')||'&nbsp;'}</div>`;
    return i<defs.length-1?box+`<div class="field-sep">${sep}</div>`:box;
  }).join('');
  const labels=`<div class="field-labels">${defs.map(d=>`<span>${d.label}</span>`).join('')}</div>`;
  const filled=defs.every(d=>session.fields[d.key]!==''&&session.fields[d.key]!=null);
  return `<div class="field-row" style="--accent-color:${av.c};--accent-color-soft:${av.soft}">${boxes}</div>
    ${labels}
    <div class="keypad">
      ${['7','8','9','4','5','6','1','2','3','→','0','⌫'].map(k=>`<button class="key-btn" ${session.answered?'disabled':''} onclick="keypadPress('${k}')">${k}</button>`).join('')}
    </div>
    <div style="height:10px"></div>
    <button class="btn btn-primary btn-block" ${session.answered||!filled?'disabled':''} onclick="answerFields()">Check</button>`;
}
function renderSessionModal(){
  const q=session.currentQuestion;
  const meta=skillLabelMap(session.learnerId)[session.skillId];
  const av=accentVars(LEARNERS_META[session.learnerId].color);
  const visual=renderQuestionVisual(q.visual,av.c);
  let body='';
  if(q.mode==='mc'){
    body=`<div class="choices">${q.choices.map(c=>{
      let state='';
      if(session.answered){ if(c===q.correctAnswer) state='correct'; else if(c===session.selected) state='wrong'; }
      return `<button class="choice-btn" data-state="${state}" ${session.answered?'disabled':''} onclick="answerMc(${JSON.stringify(c).replace(/"/g,'&quot;')})">${esc(c)}</button>`;
    }).join('')}</div>`;
  } else if(q.mode==='divmod'||q.mode==='fraction'){
    body=renderCompoundAnswerUI(q,av);
  } else {
    body=`<div class="answer-display mono">${session.numericInput||'&nbsp;'}</div>
    <div class="keypad">
      ${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button class="key-btn" ${session.answered?'disabled':''} onclick="keypadPress('${k}')">${k}</button>`).join('')}
    </div>
    <div style="height:10px"></div>
    <button class="btn btn-primary btn-block" ${session.answered||session.numericInput===''?'disabled':''} onclick="answerNumeric()">Check</button>`;
  }
  const feedback=session.answered?`<div class="feedback-box ${session.lastCorrect?'feedback-good':'feedback-bad'}">${session.lastCorrect?'✓ '+esc(session.lastPhrase)+' ':esc(session.lastPhrase)+' '}${esc(q.explanation)}</div>
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="advanceSession()">${session.qIndex+1>=session.total?'See Results':'Next Question'}</button>`:'';
  return `<div class="modal-card" onclick="stopProp(event)">
    <div class="qhead"><span>${meta.label}${session.currentIsReview?' · 🔁 Review':''}</span><span style="display:flex;align-items:center;gap:8px">${session.comboStreak>0?flameRow(session.comboStreak,av.c):''}Question ${session.qIndex+1} / ${session.total}</span></div>
    ${visual?`<div class="center">${visual}</div>`:''}
    <div class="qprompt">${renderPrompt(q.prompt)}</div>
    ${body}
    ${feedback}
    <div style="height:6px"></div>
    <button class="btn btn-secondary btn-block" onclick="quitSession()">Exit Session</button>
  </div>`;
}
function setActiveField(key){
  if(session.answered)return;
  session.activeField=key;
  openModal(renderSessionModal());
}
function keypadPress(k){
  if(session.answered)return;
  const fields=fieldDefsFor(session.currentQuestion.mode);
  if(fields){
    if(k==='→'){ const i=fields.indexOf(session.activeField); session.activeField=fields[(i+1)%fields.length]; }
    else if(k==='⌫'){ session.fields[session.activeField]=(session.fields[session.activeField]||'').slice(0,-1); }
    else{ session.fields[session.activeField]=(session.fields[session.activeField]||'')+k; }
  } else {
    if(k==='⌫') session.numericInput=session.numericInput.slice(0,-1);
    else if(k==='.'){ if(!session.numericInput.includes('.')) session.numericInput+='.'; }
    else session.numericInput+=k;
  }
  openModal(renderSessionModal());
}
function answerNumeric(){ submitAnswer(session.numericInput); }
function answerFields(){
  const fields=fieldDefsFor(session.currentQuestion.mode);
  if(!fields.every(f=>session.fields[f]!==''&&session.fields[f]!=null))return;
  submitAnswer(Object.assign({},session.fields));
}
function answerMc(value){ if(session.answered)return; session.selected=value; submitAnswer(value); }
/* Focused-time tracking (the video's "2-hour" idea: core academics done in a fraction
   of the school day). Time between interactions counts toward focus, but each gap is
   capped so a session left open while the child walks away doesn't inflate the number. */
function tickFocus(obj,capMs){ if(!obj)return; const now=Date.now(); const gap=Math.max(0,now-(obj.lastTick||now)); obj.activeMs=(obj.activeMs||0)+Math.min(gap,capMs||120000); obj.lastTick=now; }
function submitAnswer(value){
  if(session.answered)return;
  tickFocus(session,120000);
  const q=session.currentQuestion;
  let correct;
  if(q.mode==='numeric'){ const v=parseFloat(value); correct=!isNaN(v)&&Math.abs(v-q.correctAnswer)<1e-6; }
  else if(q.mode==='divmod'){ correct=(parseInt(value.q,10)===q.correctAnswer.q)&&(parseInt(value.r,10)===q.correctAnswer.r); }
  else if(q.mode==='fraction'){
    const n=parseInt(value.n,10), d=parseInt(value.d,10);
    // acceptEquivalent (Grade 5 fraction operations): 6/8 is as right as 3/4
    if(q.acceptEquivalent) correct=d>0&&!isNaN(n)&&n*q.correctAnswer.d===q.correctAnswer.n*d;
    else correct=(n===q.correctAnswer.n)&&(d===q.correctAnswer.d);
  }
  else{ correct=(value===q.correctAnswer); }
  session.answered=true; session.lastCorrect=correct;
  session.lastPhrase=correct?pick(CORRECT_PHRASES):pick(WRONG_PHRASES);
  correct?SFX.correct():SFX.wrong();
  const state=APP.skillStates[session.learnerId][session.skillId];
  applyAnswer(state,correct);
  const learner=APP.learners[session.learnerId];
  ensureTodayLog(learner);
  learner.todayLog.answeredCount++;
  if(correct) learner.todayLog.correctCount++;
  if(correct){
    session.comboStreak++;
    const mult=1+(state.difficulty-1)*0.15;
    const xp=Math.round(10*mult)+(session.currentIsReview?5:0);
    session.correctCount++; session.xpEarned+=xp;
  } else { session.missedQueue++; session.comboStreak=0; }
  /* Trail Tokens aren't earned per question — see finalizeCommon: finishing
     the whole session is worth +1 token, as long as fewer than 2 questions
     in it were missed (at most 1 wrong). */
  saveSkill(session.learnerId,session.skillId);
  openModal(renderSessionModal());
}
function advanceSession(){
  tickFocus(session,60000);
  session.qIndex++;
  if(session.qIndex>=session.total){ finishPracticeSession(); return; }
  nextQuestionInSession();
  openModal(renderSessionModal());
}
function quitSession(){ closeModal(); render(); }
/* A completed session (math/reading practice, or a reading comprehension
   passage) earns a flat +1 Trail Token, as long as (a) the session was played
   all the way through -- for a math/reading practice session that always
   means the full 8 questions (session.total is fixed at 8 in startSession;
   quitSession() never calls finalizeCommon, so an early exit never earns a
   token), and a comprehension passage means all of its questions -- and (b)
   the child got fewer than 2 questions wrong in it, i.e. at most 1 wrong
   (request: "同一天一個session最多只能獲得一個token,各session要做滿8題並且
   錯的題數小於2題才能獲得token" -- tightened from the previous "no more than 2
   wrong" rule). This is further capped at 1 token per SKILL per day (a
   different skill that same day still earns its own token; the same skill
   again the same day does not). Miss 2 or more, or already earned today's
   token for this exact skill, and the session still counts for XP/streak/
   "done for today", just no extra token. */
function finalizeCommon(learnerId,subjectKey,xpEarned,correctCount,total,skillId,durationSec){
  const learner=APP.learners[learnerId];
  const wrongCount=total-correctCount;
  touchStreak(learner);
  const stageBefore=companionStage(learner);
  learner.xp+=xpEarned;
  const newLevel=levelFromXp(learner.xp); const leveledUp=newLevel>learner.level; learner.level=newLevel;
  const stageAfter=companionStage(learner);
  const evolved=stageAfter>stageBefore;
  markTodayLog(learner,subjectKey); // marks today's route checklist done; tokens are decided below, independently
  logSessionResult(learner,skillId,correctCount,total,durationSec); // per-session accuracy + focused time, for Camp Log
  ensureTokenLog(learner);
  const alreadyEarnedToday=!!learner.tokenLog.awarded[skillId];
  const tokenAwarded=wrongCount<2 && !alreadyEarnedToday;
  if(tokenAwarded){
    learner.tokens=(learner.tokens||0)+1;
    learner.tokenLog.awarded[skillId]=true;
    logTokenAward(learner,skillId);
  }
  const goalHit=checkWeeklyGoal(learner); // a goal the child set for themself — celebrated (and badged), no extra tokens
  const newBadges=checkBadges(learnerId);
  saveLearner(learnerId);
  return{leveledUp,newBadges,tokenAwarded,alreadyEarnedToday,evolved,stageAfter,goalHit};
}
function finishPracticeSession(){
  const meta=skillLabelMap(session.learnerId)[session.skillId];
  const subjectKey=meta.subject==='math'?'mathDone':(meta.subject==='life'?'lifeDone':'readingDone');
  session.focusSec=Math.round((session.activeMs||0)/1000);
  const{leveledUp,newBadges,tokenAwarded,alreadyEarnedToday,evolved,stageAfter,goalHit}=finalizeCommon(session.learnerId,subjectKey,session.xpEarned,session.correctCount,session.total,session.skillId,session.focusSec);
  openModal(renderSummary(leveledUp,newBadges,tokenAwarded,alreadyEarnedToday,evolved,stageAfter,goalHit));
}

/* ================= COMPREHENSION FLOW ================= */
let comp=null;
/* ================= READING COMPREHENSION: DAILY PASSAGE PICKER =================
   Request: "oliver每天只會做一篇 Reading Comprehension, 但現在每次打開都是同一篇文章 請協助
   調整成隨機文章且每天不重複" (Oliver only does one Reading Comprehension passage a day,
   but every time he opens it it's the same article -- please make it random and not
   repeat each day). Passages are drawn from a shuffled "bag" -- a random order of every
   passage in the pool -- so the sequence is random but nothing repeats until the whole
   pool has been used once, and a fresh bag never starts on the passage that just
   finished the last one. Every time Reading Comprehension is opened it draws the NEXT
   card from the bag, so reopening it later the same day shows a different passage too
   (not the same one pinned to that day) -- while still guaranteeing no repeats until
   every passage in the pool has come up once. */
function drawNextPassage(state,meta){
  const n=meta.passages.length;
  let order=Array.isArray(state.passagePoolOrder)?state.passagePoolOrder:null;
  let pos=typeof state.passagePoolPos==='number'?state.passagePoolPos:0;
  if(!order || !order.length || pos>=order.length){
    const prevIdx=typeof state.passageIndex==='number'?state.passageIndex:null;
    do{ order=shuffle(Array.from({length:n},(_,i)=>i)); }while(n>1 && prevIdx!==null && order[0]===prevIdx);
    pos=0;
  }
  state.passageIndex=order[pos];
  state.passagePoolOrder=order;
  state.passagePoolPos=pos+1;
  return state.passageIndex;
}
function openComprehension(skillId){
  const learnerId=APP.currentLearnerId;
  const meta=LEARNERS_META[learnerId];
  const skill=skillLabelMap(learnerId)[skillId];
  if(skill&&!isSkillUnlocked(learnerId,skill)){ toast('This skill unlocks when you master the one before it!'); return; }
  const state=APP.skillStates[learnerId][skillId];
  const passages=skillPassages(learnerId,skill); // each comprehension skill (Grade 2/3/4/5) has its own passage pool
  const idx=drawNextPassage(state,{passages});
  const passage=passages[idx];
  /* Answer choices are shuffled once per question for this sitting (the passage banks
     mostly list the right answer first, which a child quickly learns to exploit). Kept
     stable across re-renders so the buttons don't jump around while answering. */
  const choiceOrders=passage.questions.map(q=>shuffle(q.choices));
  comp={learnerId,skillId,passage,choiceOrders,stage:'read',qIndex:0,correctCount:0,xpEarned:0,answered:false,selected:null,activeMs:0,lastTick:Date.now()};
  saveSkill(learnerId,skillId); // persist this draw right away so reopening (or another device) picks up from here
  openModal(renderComprehensionModal());
}
function renderComprehensionModal(){
  if(comp.stage==='read'){
    return `<div class="modal-card" onclick="stopProp(event)">
      <div class="qhead"><span>Reading Comprehension</span><span>Passage</span></div>
      <div class="section-title" style="font-size:1.15rem">${esc(comp.passage.title)}</div>
      <div class="passage-text">${esc(comp.passage.text)}</div>
      <button class="btn btn-primary btn-block" onclick="startCompQuestions()">I'm Done Reading — Start Questions</button>
      <div style="height:6px"></div>
      <button class="btn btn-secondary btn-block" onclick="quitComp()">Exit</button>
    </div>`;
  }
  const q=comp.passage.questions[comp.qIndex];
  const orderedChoices=(comp.choiceOrders&&comp.choiceOrders[comp.qIndex])||q.choices;
  const choicesHtml=`<div class="choices">${orderedChoices.map(c=>{
    let state=''; if(comp.answered){ if(c===q.correct) state='correct'; else if(c===comp.selected) state='wrong'; }
    return `<button class="choice-btn" data-state="${state}" ${comp.answered?'disabled':''} onclick="answerComp(${JSON.stringify(c).replace(/"/g,'&quot;')})">${esc(c)}</button>`;
  }).join('')}</div>`;
  const feedback=comp.answered?`<div class="feedback-box ${comp.lastCorrect?'feedback-good':'feedback-bad'}">${comp.lastCorrect?'✓ '+esc(pick(CORRECT_PHRASES)):esc(pick(WRONG_PHRASES))+' Correct answer: '+esc(q.correct)}</div>
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="advanceComp()">${comp.qIndex+1>=comp.passage.questions.length?'See Results':'Next Question'}</button>`:'';
  return `<div class="modal-card" onclick="stopProp(event)">
    <div class="qhead"><span>${esc(comp.passage.title)}</span><span>Question ${comp.qIndex+1} / ${comp.passage.questions.length}</span></div>
    <div class="qprompt">${esc(q.q)}</div>
    ${choicesHtml}
    ${feedback}
    <div style="height:6px"></div>
    <button class="btn btn-secondary btn-block" onclick="quitComp()">Exit</button>
  </div>`;
}
function startCompQuestions(){ tickFocus(comp,600000); comp.stage='questions'; openModal(renderComprehensionModal()); } // reading the passage counts as focus too (capped at 10 min)
function answerComp(value){
  if(comp.answered)return;
  tickFocus(comp,120000);
  const q=comp.passage.questions[comp.qIndex];
  const correct=(value===q.correct);
  comp.answered=true; comp.selected=value; comp.lastCorrect=correct;
  correct?SFX.correct():SFX.wrong();
  const state=APP.skillStates[comp.learnerId][comp.skillId];
  applyAnswer(state,correct);
  const compLearner=APP.learners[comp.learnerId];
  ensureTodayLog(compLearner);
  compLearner.todayLog.answeredCount++;
  if(correct) compLearner.todayLog.correctCount++;
  if(correct){ comp.correctCount++; comp.xpEarned+=15; } // tokens: see markTodayLog, no longer per-question here
  saveSkill(comp.learnerId,comp.skillId);
  openModal(renderComprehensionModal());
}
function advanceComp(){
  tickFocus(comp,60000);
  comp.qIndex++;
  if(comp.qIndex>=comp.passage.questions.length){ finishComprehension(); return; }
  comp.answered=false; comp.selected=null;
  openModal(renderComprehensionModal());
}
function finishComprehension(){
  const state=APP.skillStates[comp.learnerId][comp.skillId];
  const idx=state.passageIndex; // this session's passage, already drawn by drawNextPassage() in openComprehension
  if(!Array.isArray(state.passagesCompleted)) state.passagesCompleted=[];
  state.passagesCompleted[idx]=true;
  saveSkill(comp.learnerId,comp.skillId);
  const compTotal=comp.passage.questions.length;
  const focusSec=Math.round((comp.activeMs||0)/1000);
  const{leveledUp,newBadges,tokenAwarded,alreadyEarnedToday,evolved,stageAfter,goalHit}=finalizeCommon(comp.learnerId,'readingDone',comp.xpEarned,comp.correctCount,compTotal,comp.skillId,focusSec);
  session={correctCount:comp.correctCount,total:compTotal,xpEarned:comp.xpEarned,focusSec};
  openModal(renderSummary(leveledUp,newBadges,tokenAwarded,alreadyEarnedToday,evolved,stageAfter,goalHit));
}
function quitComp(){ closeModal(); comp=null; render(); }

/* ================= FOCUS BLOCKS, TIME BACK, WEEKLY GOALS, MOOD =================
   From the Alpha School video ("Reimagining AI"): core academics happen in short,
   focused blocks (about 25 minutes per subject, with movement breaks), so the whole
   academic load fits in a fraction of the day and the rest of the day goes back to
   the child ("Time Back"). Kids are meant to be self-driven — so they set their own
   weekly goal — and the adults' #1 job is that kids LOVE learning, so every day the
   child can say how learning felt, and the Guide sees it in Camp Log. */
const FOCUS_BLOCK_MIN=25, QBREAK_MIN=5;
function fmtFocusDuration(sec){ sec=Math.round(sec||0); if(sec<60) return sec+'s'; const m=Math.round(sec/60); return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m} min`; }
function fmtMMSS(ms){ const t=Math.max(0,Math.ceil(ms/1000)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function focusTimerKey(id){ return 'focusTimer/'+id; } // per-device (localStorage only): a timer runs on the device the child is using
function getFocusTimer(id){ const t=Store.lsGet(focusTimerKey(id)); return (t&&t.mode&&t.mode!=='idle')?t:{mode:'idle'}; }
function setFocusTimer(id,t){ Store.lsSet(focusTimerKey(id),t); }
let focusTickTimer=null;
function ensureFocusTicker(){
  const u=APP.auth.currentUser;
  const running=u&&u.role==='student'&&APP.currentLearnerId&&getFocusTimer(APP.currentLearnerId).mode!=='idle';
  if(running&&!focusTickTimer&&typeof setInterval==='function'){
    focusTickTimer=setInterval(focusTick,1000);
    if(focusTickTimer&&typeof focusTickTimer.unref==='function')focusTickTimer.unref();
  }
  if(!running) stopFocusTicker();
}
function stopFocusTicker(){ if(focusTickTimer){ if(typeof clearInterval==='function')clearInterval(focusTickTimer); focusTickTimer=null; } }
function startFocusBlock(){
  const id=APP.currentLearnerId; if(!id)return;
  setFocusTimer(id,{mode:'focus',startedAt:Date.now(),endsAt:Date.now()+FOCUS_BLOCK_MIN*60000});
  toast(`Focus block started — ${FOCUS_BLOCK_MIN} minutes. Pick a trail and dive in!`);
  render();
}
function stopFocusBlock(){ const id=APP.currentLearnerId; if(!id)return; setFocusTimer(id,{mode:'idle'}); render(); }
function completeFocusBlock(id){
  const l=APP.learners[id]; ensureTodayLog(l);
  l.todayLog.focusBlocks=(l.todayLog.focusBlocks||0)+1;
  l.focusBlocksTotal=(l.focusBlocksTotal||0)+1;
  const nb=checkBadges(id);
  saveLearner(id);
  return nb;
}
/* Advances the timer state machine: focus → Q-Break → idle. Returns true if the mode
   changed. A timer found long-expired (tab closed for 30+ min) is quietly reset
   rather than credited. */
function advanceFocusTimer(id,now){
  now=now||Date.now();
  const t=getFocusTimer(id);
  if(t.mode==='idle'||now<t.endsAt) return false;
  if(now-t.endsAt>30*60000){ setFocusTimer(id,{mode:'idle'}); return true; }
  if(t.mode==='focus'){
    const nb=completeFocusBlock(id);
    setFocusTimer(id,{mode:'break',endsAt:now+QBREAK_MIN*60000});
    toast(nb.length?`Focus block done! New badge: ${nb[0].label}. Q-Break — move for ${QBREAK_MIN} minutes!`:`Focus block done! 🎉 Q-Break: stand up, stretch, grab water — ${QBREAK_MIN} minutes.`);
    if(typeof burstConfettiBig==='function')burstConfettiBig();
    SFX.celebrate();
  } else {
    setFocusTimer(id,{mode:'idle'});
    toast('Break over — ready for another focus block?');
    SFX.sessionComplete();
  }
  return true;
}
function focusTick(){
  const u=APP.auth.currentUser;
  if(!u||u.role!=='student'||!APP.currentLearnerId){ stopFocusTicker(); return; }
  const id=APP.currentLearnerId;
  const changed=advanceFocusTimer(id);
  refreshFocusUI(id,changed);
  if(getFocusTimer(id).mode==='idle') stopFocusTicker();
}
/* Updates just the clock text/ring (every second) without a full render(), so a child
   typing in a text box elsewhere on the page never loses what they typed. */
function refreshFocusUI(id,modeChanged){
  const t=getFocusTimer(id);
  const clock=document.getElementById('focusClock'); if(clock) clock.textContent=t.mode==='idle'?`${FOCUS_BLOCK_MIN}:00`:fmtMMSS(t.endsAt-Date.now());
  const chip=document.getElementById('focusChipClock'); if(chip) chip.textContent=t.mode==='idle'?'':fmtMMSS(t.endsAt-Date.now());
  const ring=document.getElementById('focusRing');
  if(ring&&typeof ring.setAttribute==='function'&&t.mode!=='idle'){ const total=(t.mode==='focus'?FOCUS_BLOCK_MIN:QBREAK_MIN)*60000; ring.setAttribute('stroke-dashoffset',(FOCUS_RING_C*(1-Math.max(0,t.endsAt-Date.now())/total)).toFixed(1)); }
  if(modeChanged){
    renderStatStrip();
    const card=document.getElementById('focusCard');
    if(card&&APP.activeTab==='today') card.innerHTML=renderFocusCardInner(id);
  }
}
const FOCUS_RING_C=2*Math.PI*34;
function renderFocusCardInner(id){
  const l=APP.learners[id]; ensureTodayLog(l);
  const t=getFocusTimer(id);
  const av=accentVars(LEARNERS_META[id].color);
  const total=(t.mode==='break'?QBREAK_MIN:FOCUS_BLOCK_MIN)*60000;
  const rem=t.mode==='idle'?total:Math.max(0,t.endsAt-Date.now());
  const offset=t.mode==='idle'?FOCUS_RING_C:FOCUS_RING_C*(1-rem/total);
  const ringColor=t.mode==='break'?'var(--good)':av.c;
  const title=t.mode==='focus'?'Focus Block — in the zone':(t.mode==='break'?'Q-Break — move your body!':'Focus Block');
  const sub=t.mode==='focus'?'Work on any Math, Reading or Life Skills session. When the ring fills, it\'s break time.'
    :(t.mode==='break'?'Stand up, stretch, get some water, look out the window. Your brain is saving what you learned.'
    :`${FOCUS_BLOCK_MIN} focused minutes, then a ${QBREAK_MIN}-minute move break — the rhythm behind a short, powerful learning day.`);
  const btn=t.mode==='idle'?`<button class="btn btn-primary" onclick="startFocusBlock()">${icon('timer','#221602',16)} Start ${FOCUS_BLOCK_MIN}-min block</button>`
    :`<button class="btn btn-secondary" onclick="stopFocusBlock()">${t.mode==='break'?'Skip break':'Stop'}</button>`;
  return `<div class="focus-ring-wrap">
      <svg viewBox="0 0 80 80" width="84" height="84"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
        <circle id="focusRing" cx="40" cy="40" r="34" fill="none" stroke="${ringColor}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${FOCUS_RING_C.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 40 40)"/></svg>
      <div class="focus-clock mono" id="focusClock">${fmtMMSS(rem)}</div>
    </div>
    <div class="focus-body">
      <div class="route-title">${title}</div>
      <div class="route-sub">${sub}</div>
      <div class="focus-stats mono">Today: ${l.todayLog.focusBlocks||0} block${(l.todayLog.focusBlocks||0)===1?'':'s'} · ${fmtFocusDuration(l.todayLog.focusSec||0)} focused</div>
      <div style="height:8px"></div>${btn}
    </div>`;
}
function renderTimeBackBanner(id){

function thisWeekSessions(learner){ const wk=currentWeekKey(); return (learner.sessionLog||[]).filter(s=>weekStartStr(s.date)===wk).length; }
function currentWeeklyGoal(learner){ const g=learner.weeklyGoal; return (g&&g.week===currentWeekKey())?g:null; }

/* Showcase checklist: Alpha grades life skills by a real performance for a real audience

function renderRubric(ws){
  const items=AREA_RUBRIC[ws.areaId]||[];

    ${done===items.length?`<div class="rubric-done">${icon('star','var(--good)',16)} Showcase complete — that's real-world mastery!</div>`:''}
  </div>`;

// Always a dense true/false array: Firebase turns a sparse array into an object (and drops
// false-y holes), so reading it back tolerates either shape.
function rubricArray(ws){ const n=(AREA_RUBRIC[ws.areaId]||[]).length; const r=ws.rubric; return Array.from({length:n},(_,i)=>!!(r&&r[i])); }
/* Audience Ladder — from the video's public-speaking example (tell your story to shelter
   cats first, then to seniors at an assisted-living home, then on a real open-mic stage):
   each rung is a bigger, realer audience, so confidence is built one safe step at a time. */
const AUDIENCE_LADDER=[
  {label:'Practice for a pet or a row of stuffed animals',sub:'the no-judgment crowd'},
  {label:'Perform for your family at home',sub:'people who love you'},
  {label:'Share with grandparents, relatives or a neighbor',sub:'a video call counts'},
  {label:'Take it to a bigger real audience',sub:'a class, club, team or community event'}
];
function ladderArray(ws){ const r=ws.audience; return AUDIENCE_LADDER.map((_,i)=>!!(r&&r[i])); }
function renderAudienceLadder(ws){
  const rungs=ladderArray(ws); const next=rungs.indexOf(false);
  return `<div class="rubric-box ladder-box"><div class="rubric-head"><b>Audience Ladder</b><span class="mono">${rungs.filter(Boolean).length}/${AUDIENCE_LADDER.length}</span></div>
    <div class="route-sub" style="margin-bottom:6px">Show your mission to a bigger, realer audience at each step — start small and climb.</div>
    ${AUDIENCE_LADDER.slice().reverse().map((r,ri)=>{const i=AUDIENCE_LADDER.length-1-ri; return `<label class="ladder-rung" data-done="${rungs[i]}" data-next="${i===next}"><input type="checkbox" ${rungs[i]?'checked':''} onchange="toggleAudience(${i})"><span class="ladder-num mono">${i+1}</span><span><b>${esc(r.label)}</b><br><span class="route-sub">${esc(r.sub)}</span></span></label>`;}).join('')}
  </div>`;
}
function toggleAudience(i){ const ws=APP.workshops[APP.currentLearnerId]; const r=ladderArray(ws); r[i]=!r[i]; ws.audience=r; saveWorkshop(APP.currentLearnerId); render(); }
function toggleRubric(i){ const ws=APP.workshops[APP.currentLearnerId]; const r=rubricArray(ws); r[i]=!r[i]; ws.rubric=r; saveWorkshop(APP.currentLearnerId); render(); }
function pickArea(areaId){ const ws=APP.workshops[APP.currentLearnerId]; if(ws.areaId!==areaId){ws.rubric=[];ws.audience=[];} ws.areaId=areaId; saveWorkshop(APP.currentLearnerId); render(); }
function chooseIdea(title){ const ws=APP.workshops[APP.currentLearnerId]; if(ws.projectTitle!==title){ws.rubric=[];ws.audience=[];} ws.projectTitle=title; saveWorkshop(APP.currentLearnerId); render(); }
function saveMission(){
  const ws=APP.workshops[APP.currentLearnerId];
  ws.projectTitle=document.getElementById('projectTitleInput').value;
  ws.goalText=document.getElementById('goalTextInput').value;
  saveWorkshop(APP.currentLearnerId); toast('Mission saved!'); render();
}
function toggleCheckin(date){
  const ws=APP.workshops[APP.currentLearnerId]; ws.checkins[date]=!ws.checkins[date];
  let tokenAwarded=false;
  if(ws.checkins[date]&&date===todayStr()){
    const learner=APP.learners[APP.currentLearnerId];
    tokenAwarded=markTodayLog(learner,'workshopDone'); // this check-in box only exists once per day, so "first time today" = "completed"
    if(tokenAwarded){ learner.tokens=(learner.tokens||0)+1; logTokenAward(learner,'workshop'); }
  }
  saveWorkshop(APP.currentLearnerId); saveLearner(APP.currentLearnerId);
  if(tokenAwarded) toast('Nice! +1 Trail Token for working on your mission today.');
  render();
}
function addJournal(){
  const text=document.getElementById('journalInput').value.trim(); if(!text)return;
  const ws=APP.workshops[APP.currentLearnerId];
  ws.journal=ws.journal||[]; ws.journal.unshift({date:todayStr(),text}); ws.journal=ws.journal.slice(0,20);
  const learner=APP.learners[APP.currentLearnerId];
  const tokenAwarded=markTodayLog(learner,'journalDone'); // first reflection of the day only — keeps the daily route checklist meaning "done"
  if(tokenAwarded){ learner.tokens=(learner.tokens||0)+1; logTokenAward(learner,'journal'); }
  saveWorkshop(APP.currentLearnerId); saveLearner(APP.currentLearnerId);
  toast(tokenAwarded?'Reflection added! +1 Trail Token':'Reflection added!');
  render();
}

/* ================= CAMP LOG (guide / parent dashboard) ================= */
/* Session statistics are shown as XY charts rather than text lists (request:
   "管理者表單中 每天每個session統計改成用xy軸圖表顯示, 表格可以切換最近7天/月/最近一年,
   一個session一張圖表x為日期y為accuracy,移動到當天小點會跳出 答對題數/總題數" -- turn
   the daily per-session stats into XY charts, switchable between the last 7 days /
   month / year, one chart per session/skill with date on X and accuracy on Y, and
   hovering (or tapping) a day's dot pops up that day's correct/total. Also:
   "weekly summary也用圖表呈現" and "Elevation map也用XY圖表呈現" (X = each subject,
   Y = current Elevation level, per the parent's own choice when asked which axes
   made sense there). */

/* ---- shared inline-SVG XY chart + floating tooltip. No external charting library
   (this is a single self-contained HTML file) -- built from the same hand-drawn SVG
   approach already used everywhere else in this app (elevation paths, badges, etc). */
function chartTipEscape(s){
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
let _chartTipHideTimer=null;
function showChartTip(evt,text){
  if(!text)return;
  let tip=document.getElementById('chartTooltip');
  if(!tip){ tip=document.createElement('div'); tip.id='chartTooltip'; tip.className='chart-tooltip'; document.body.appendChild(tip); }
  tip.textContent=text;
  tip.style.display='block';
  const touch=evt.touches&&evt.touches[0];
  const cx=touch?touch.clientX:evt.clientX, cy=touch?touch.clientY:evt.clientY;
  let left=cx+14;
  if(typeof window!=='undefined'&&window.innerWidth&&left+150>window.innerWidth) left=cx-164;
  tip.style.left=left+'px';
  tip.style.top=(cy-32)+'px';
  if(_chartTipHideTimer){ clearTimeout(_chartTipHideTimer); _chartTipHideTimer=null; }
  if(touch){ _chartTipHideTimer=setTimeout(hideChartTip,2500); } // no touchend-elsewhere listener, so auto-hide
}
function hideChartTip(){ const tip=document.getElementById('chartTooltip'); if(tip) tip.style.display='none'; }

/* points: [{xFrac:0..1, y:number, tip:string, color?}]. xTickLabels:
   [{xFrac:0..1, label}]. Renders gridlines, an optional connecting line, and a
   hoverable/tappable dot per point -- a point's color can be overridden
   individually (used by the Elevation chart to flag a skill needing attention). */
function svgXYChart(cfg){
  const{points=[],width=560,height=170,yMin=0,yMax=100,yTicks=[0,25,50,75,100],yFmt=v=>v+'%',
    color='var(--accent)',xTickLabels=[],emptyLabel='No data yet.',connectLine=true,stems=false,
    xLabelRotate=false,padBottom=null,padLeft=null}=cfg;
  if(!points.length) return `<div class="section-sub" style="padding:8px 0 2px">${esc(emptyLabel)}</div>`;
  const padL=padLeft||32,padR=10,padT=8,padB=padBottom||(xLabelRotate?46:22);
  const plotW=width-padL-padR,plotH=height-padT-padB;
  const xAt=f=>padL+plotW*Math.max(0,Math.min(1,f));
  const yAt=v=>padT+plotH*(1-((v-yMin)/((yMax-yMin)||1)));
  const gridLines=yTicks.map(t=>{
    const y=yAt(t).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${(width-padR).toFixed(1)}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${(padL-6).toFixed(1)}" y="${(parseFloat(y)+3).toFixed(1)}" text-anchor="end" style="font-family:var(--font-mono);font-size:9px;fill:var(--ink-faint)">${esc(yFmt(t))}</text>`;
  }).join('');
  const xLabelsHtml=xTickLabels.map(t=>{
    const x=xAt(t.xFrac).toFixed(1);
    if(xLabelRotate){
      const ly=(height-padB+14).toFixed(1);
      return `<text x="${x}" y="${ly}" text-anchor="end" transform="rotate(-40 ${x} ${ly})" style="font-family:var(--font-mono);font-size:9px;fill:var(--ink-faint)">${esc(t.label)}</text>`;
    }
    return `<text x="${x}" y="${(height-6).toFixed(1)}" text-anchor="middle" style="font-family:var(--font-mono);font-size:9px;fill:var(--ink-faint)">${esc(t.label)}</text>`;
  }).join('');
  const sorted=points.slice().sort((a,b)=>a.xFrac-b.xFrac);
  const linePath=(connectLine&&sorted.length>1)?sorted.map((p,i)=>`${i===0?'M':'L'}${xAt(p.xFrac).toFixed(1)} ${yAt(p.y).toFixed(1)}`).join(' '):'';
  const stemsHtml=stems?sorted.map(p=>{
    const x=xAt(p.xFrac).toFixed(1);
    return `<line x1="${x}" y1="${yAt(yMin).toFixed(1)}" x2="${x}" y2="${yAt(p.y).toFixed(1)}" stroke="${p.color||color}" stroke-width="2" opacity=".4"/>`;
  }).join(''):'';
  const dots=sorted.map(p=>{
    const cx=xAt(p.xFrac).toFixed(1),cy=yAt(p.y).toFixed(1);
    const tip=chartTipEscape(p.tip||'');
    const dotColor=p.color||color;
    return `<circle cx="${cx}" cy="${cy}" r="4.5" fill="${dotColor}" stroke="var(--surface)" stroke-width="1.5" style="cursor:pointer" onmouseenter="showChartTip(event,'${tip}')" onmousemove="showChartTip(event,'${tip}')" onmouseleave="hideChartTip()" ontouchstart="showChartTip(event,'${tip}');event.preventDefault();"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block;max-width:${width}px;overflow:visible">
    ${gridLines}
    ${linePath?`<path d="${linePath}" fill="none" stroke="${color}" stroke-width="2"/>`:''}
    ${stemsHtml}
    ${dots}
    ${xLabelsHtml}
  </svg>`;
}

/* ---- date-window helpers for the per-skill accuracy charts ---- */
function daysAgoStr(n){ const d=new Date(); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
function dateDiffDays(aStr,bStr){ return Math.round((Date.parse(bStr+'T00:00:00Z')-Date.parse(aStr+'T00:00:00Z'))/86400000); }
function fmtDateShort(dateStr){ const d=new Date(dateStr+'T00:00:00Z'); return (d.getUTCMonth()+1)+'/'+d.getUTCDate(); }
function fmtMonthShort(dateStr){ const d=new Date(dateStr+'T00:00:00Z'); return d.toLocaleDateString('en-US',{month:'short',timeZone:'UTC'}); }

const CAMP_RANGES=[{id:'7d',label:'7 Days',days:7},{id:'30d',label:'Month',days:30},{id:'365d',label:'Year',days:365}];
function setCampLogRange(rangeId){ if(!CAMP_RANGES.some(r=>r.id===rangeId))return; APP.campLogRange=rangeId; render(); }

/* Per-day, per-skill accuracy from sessionLog, scaled to true calendar position
   within the selected window -- so a day with no practice shows as a real gap in
   the line rather than just a missing row in a list. */
function skillDailySeries(learner,skillId,windowDays){
  const startStr=daysAgoStr(windowDays-1);
  const buckets={};
  (learner.sessionLog||[]).forEach(s=>{
    if(s.skillId!==skillId||s.date<startStr)return;
    if(!buckets[s.date])buckets[s.date]={correct:0,total:0};
    buckets[s.date].correct+=s.correct; buckets[s.date].total+=s.total;
  });
  return Object.keys(buckets).sort().map(d=>{
    const b=buckets[d]; const acc=b.total>0?Math.round(b.correct/b.total*100):0;
    return{date:d,xFrac:windowDays<=1?0:dateDiffDays(startStr,d)/(windowDays-1),acc,correct:b.correct,total:b.total};
  });
}
function windowXTicks(windowDays){
  const count=windowDays<=7?windowDays:6;
  const ticks=[];
  for(let k=0;k<count;k++){
    const frac=count===1?0:k/(count-1);
    const dayIdx=Math.round(frac*(windowDays-1));
    const d=daysAgoStr(windowDays-1-dayIdx);
    ticks.push({xFrac:frac,label:windowDays>90?fmtMonthShort(d):fmtDateShort(d)});
  }
  return ticks;
}
function renderSkillAccuracyChart(learner,skill,windowDays,av){
  const series=skillDailySeries(learner,skill.id,windowDays);
  const points=series.map(pt=>({xFrac:pt.xFrac,y:pt.acc,tip:`${fmtDateShort(pt.date)}: ${pt.correct}/${pt.total} (${pt.acc}%)`}));
  const chart=svgXYChart({points,xTickLabels:windowXTicks(windowDays),color:av.c,emptyLabel:'No sessions in this range yet.'});
  const latest=series.length?series[series.length-1]:null;
  return `<div class="card" style="padding:14px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px">
      <b style="font-size:.86rem">${esc(skillDisplayLabel(skill))}</b>
      ${latest?`<span class="section-sub" style="margin:0">Last: ${latest.correct}/${latest.total} (${latest.acc}%)</span>`:''}
    </div>
    ${chart}
  </div>`;
}
function renderDailyProgressCharts(learner,meta,av){
  const rangeId=CAMP_RANGES.some(r=>r.id===APP.campLogRange)?APP.campLogRange:'7d';
  const range=CAMP_RANGES.find(r=>r.id===rangeId);
  const toggle=`<div class="range-toggle">${CAMP_RANGES.map(r=>`<button class="range-btn" data-active="${r.id===range.id}" onclick="setCampLogRange('${r.id}')">${esc(r.label)}</button>`).join('')}</div>`;
  // only skills this learner can actually practice (locked next-grade skills stay hidden)
  const ids=Object.keys(LEARNERS_META).find(k=>LEARNERS_META[k]===meta)||APP.currentLearnerId;
  const cards=visibleSkills(ids).map(s=>renderSkillAccuracyChart(learner,s,range.days,av)).join('');
  return `${toggle}<div class="grid" style="grid-template-columns:1fr">${cards}</div>`;
}

/* Groups the days into Monday-starting weeks and totals up answered/correct
   questions and average route-completion for each recent week, shown as one
   accuracy-over-time chart (request: "weekly summary也用圖表呈現"). */
function weekStartStr(dateStr){
  // Parsed and shifted in UTC, like every other date in this app (todayStr() is a UTC day):
  // a local-time parse returned the SUNDAY before in UTC+ time zones (e.g. Taiwan).
  const d=new Date(dateStr+'T00:00:00Z');
  const dow=(d.getUTCDay()+6)%7; // 0=Mon .. 6=Sun
  d.setUTCDate(d.getUTCDate()-dow);
  return d.toISOString().slice(0,10);
}
function allStatsRows(learner){
  const t=learner.todayLog;
  const todayRow=t?{date:t.date,routeDone:[t.mathDone,t.readingDone,t.workshopDone,t.journalDone].filter(Boolean).length,answeredCount:t.answeredCount||0,correctCount:t.correctCount||0,isToday:true}:null;
  const past=(learner.history||[]).slice().reverse(); // most recent first
  return (todayRow?[todayRow]:[]).concat(past);
}
function renderWeeklySummaryChart(learner,av){
  const rows=allStatsRows(learner);
  if(!rows.length) return `<div class="section-sub">No sessions logged yet.</div>`;
  const buckets={};
  rows.forEach(r=>{
    const wk=weekStartStr(r.date);
    if(!buckets[wk])buckets[wk]={answered:0,correct:0,routeSum:0,days:0};
    const b=buckets[wk];
    b.answered+=r.answeredCount; b.correct+=r.correctCount; b.routeSum+=r.routeDone; b.days++;
  });
  const weeks=Object.keys(buckets).sort().slice(-12); // oldest..newest, most recent 12 weeks
  if(!weeks.length) return `<div class="section-sub">No sessions logged yet.</div>`;
  const n=weeks.length;
  const points=weeks.map((wk,i)=>{
    const b=buckets[wk]; const acc=b.answered>0?Math.round(b.correct/b.answered*100):0;
    const avgRoute=(b.routeSum/b.days).toFixed(1);
    return{xFrac:n===1?0:i/(n-1),y:acc,tip:`Week of ${fmtDateShort(wk)}: ${b.correct}/${b.answered} (${acc}%) · Route avg ${avgRoute}/4`};
  });
  const every=Math.max(1,Math.ceil(n/6));
  const xTickLabels=weeks.map((wk,i)=>({xFrac:n===1?0:i/(n-1),label:fmtDateShort(wk)})).filter((_,i)=>i%every===0||i===n-1);
  return svgXYChart({points,xTickLabels,color:av.c,emptyLabel:'No sessions logged yet.'});
}

/* Elevation Map as an XY chart: X = each subject/skill, Y = its current
   Elevation level (1-10) -- per the parent's own choice when asked which axes
   made sense here (request: "Elevation map也用XY圖表呈現"). A skill flagged
   "needs attention" (low recent accuracy, not yet mastered) is colored with the
   warning color instead of the learner's usual accent; a mastered skill uses the
   "good" color -- same signal the old progress-bar list used to convey. */
function renderElevationChart(id,meta,av){
  const skills=visibleSkills(id);
  const n=skills.length;
  const points=skills.map((s,i)=>{
    const state=APP.skillStates[id][s.id];
    const asc=ascentBar(state);
    const needsAttention=(!state.mastered&&state.totalAnswered>=6&&asc.pct<60);
    const color=state.mastered?'var(--good)':(needsAttention?'var(--warn)':av.c);
    const tierLabel=state.mastered?MASTERY_TIER_LABELS[state.masteryTier||1]:`Elev. ${state.difficulty}`;
    const tip=`${skillDisplayLabel(s)}: Elevation ${state.difficulty}/${MAX_DIFFICULTY} \u00b7 ${state.totalCorrect}/${state.totalAnswered} correct all-time \u00b7 ${tierLabel}${needsAttention?' \u00b7 Needs attention':''}`;
    return{xFrac:n===1?0:i/(n-1),y:state.difficulty,tip,color};
  });
  const shortLabel=s=>s.stretch?`${s.label} · ${GRADE_TIERS[s.grade].label.replace('Grade ','G')}`:s.label;
  const xTickLabels=skills.map((s,i)=>({xFrac:n===1?0:i/(n-1),label:shortLabel(s)}));
  // Rotated (-40°) labels grow down-left; size the margins from the longest label so
  // they never spill out of the card now that a learner can have 20+ skills here.
  const maxLen=Math.max(8,...xTickLabels.map(t=>t.label.length));
  const padBottom=Math.round(16+maxLen*3.6);
  const padLeft=Math.round(Math.max(32,Math.min(70,xTickLabels.length?xTickLabels[0].label.length*4.3:32)));
  const width=Math.max(560,padLeft+n*30);
  return svgXYChart({points,xTickLabels,yMin:1,yMax:MAX_DIFFICULTY,yTicks:[1,2,4,6,8,10],yFmt:v=>String(v),
    color:av.c,connectLine:false,stems:true,xLabelRotate:true,width,height:150+padBottom,padBottom,padLeft,
    emptyLabel:'No skills tracked yet.'});
}
/* Token Sources: where a child's tokens came from (request: "家長帳戶能統計小孩
   token從哪個session獲得的分布"). */
function renderTokenSources(learnerId){
  const learner=APP.learners[learnerId];
  const hist=learner.tokenHistory||[];
  // Tokens earned before tokenHistory tracking existed have no source entry, so the
  // breakdown below would undercount a learner's real total. Reconcile against the
  // ground truth (current balance + everything ever redeemed) and show the gap.
  const totalEverEarned=(learner.tokens||0)+((learner.redemptions||[]).reduce((sum,r)=>sum+(r.cost||0),0));
  const untracked=Math.max(0,totalEverEarned-hist.length);
  if(!hist.length && !untracked) return `<div class="section-sub">No tokens earned yet.</div>`;
  const labels=skillLabelMap(learnerId);
  const counts={};
  hist.forEach(h=>{ counts[h.source]=(counts[h.source]||0)+1; });
  const labelFor=(src)=>src==='workshop'?'Trail Time Check-in':(src==='journal'?'Closing Circle Reflection':(labels[src]?skillDisplayLabel(labels[src]):src));
  const max=Math.max(...Object.values(counts),untracked,1);
  const av=accentVars(LEARNERS_META[learnerId].color);
  const rows=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).map(src=>{
    const pct=max>0?Math.round(counts[src]/max*100):0;
    return `<div class="card" style="padding:10px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;font-size:.85rem">${esc(labelFor(src))}</div>
      <div style="width:110px" class="ascent"><div class="ascent-track"><div class="ascent-fill" style="width:${pct}%;background:${av.c}"></div></div></div>
      <div class="mono" style="width:30px;text-align:right">${counts[src]}</div>
    </div>`;
  }).join('');
  const untrackedRow=untracked>0?`<div class="card" style="padding:10px 16px;display:flex;align-items:center;gap:12px;opacity:.6;font-style:italic">
      <div style="flex:1;font-size:.85rem">Earned before source-tracking was added</div>
      <div style="width:110px" class="ascent"><div class="ascent-track"><div class="ascent-fill" style="width:${Math.round(untracked/max*100)}%;background:${av.c}"></div></div></div>
      <div class="mono" style="width:30px;text-align:right">${untracked}</div>
    </div>`:'';
  return `<div style="display:flex;flex-direction:column;gap:6px">${rows}${untrackedRow}</div>`;
}
function renderCampLog(){

  const switcherHtml=ids.length>1?`<div class="row" style="margin-bottom:18px">${ids.map(sid=>{
    const m=LEARNERS_META[sid]; const l=APP.learners[sid]; const a2=accentVars(m.color); const active=sid===id;
    return `<button class="learner-btn" data-active="${active}" style="--accent-color:${a2.c};--accent-color-strong:${a2.cs};--accent-color-soft:${a2.soft}" onclick="setLearner('${sid}')">
      <span class="dot">${svgMascot(m.mascot,a2.c,l.streakDays>=3?'excited':'happy')}</span>
      <span class="lbl"><b>${esc(l.name)}</b><span>${esc(m.ageLabel)}</span></span>
    </button>`;
  }).join('')}</div>`:'';
  const overviewRows=ids.map(sid=>{

    return `<div class="card" style="padding:14px;display:flex;align-items:center;gap:14px">
      <span class="dot" style="width:34px;height:34px;border-radius:50%;background:${a2.c};display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700">${l.name.charAt(0)}</span>
      <div style="flex:1"><b>${esc(l.name)}</b> · Lvl ${l.level} · ${l.tokens} tokens · ${l.streakDays}-day streak</div>
    </div>`;
  }).join('');
  const badgeGallery=BADGE_DEFS.map(b=>{
    const earned=learner.badges.includes(b.id);
    return `<div class="badge-tile ${earned?'':'locked'}" title="${esc(b.desc)}"><div class="badge-shape" style="background:${earned?av.soft:'var(--surface-2)'}">${icon(b.icon,earned?av.c:'var(--ink-faint)',28)}</div>${b.label}</div>`;
  }).join('');
  const rewardsList=(APP.rewards.items||[]).map(r=>`<div class="card reward-row">
      <span class="rlbl">${esc(r.label)}${r.active?'':' <span class="tag">inactive</span>'}</span>
      <span class="reward-cost mono">${r.cost} ⛁</span>
      <button class="btn btn-secondary" onclick="toggleReward('${r.id}')">${r.active?'Disable':'Enable'}</button>

/* ================= COACH CORNER (Camp Log) =================
   The video's other big shift: the adult stops being the lecturer and becomes a Guide —
   a coach and mentor whose job is motivation, connection, and knowing each child. The
   software does the teaching; this panel tells the Guide where to lean in: who is stuck,
   who is ready for the next peak, what is due for review, how learning is FEELING, plus
   conversation starters and a log for the weekly 1:1 check-in. */
function recentAccuracy(state){ const last=state.history.slice(-10); return last.length?Math.round(last.reduce((a,v)=>a+v,0)/last.length*100):null; }
function sessionsInRange(learner,startStr,endStr){ return (learner.sessionLog||[]).filter(s=>s.date>=startStr&&(!endStr||s.date<=endStr)); }
function focusSecInRange(learner,startStr,endStr){ return sessionsInRange(learner,startStr,endStr).reduce((a,s)=>a+(s.sec||0),0); }
function coachInsights(id){
  const meta=LEARNERS_META[id]; const l=APP.learners[id]; const ss=APP.skillStates[id]; const name=esc(l.name);
  const out=[];
  const vis=visibleSkills(id);
  // 1. stuck
  vis.forEach(s=>{ const st=ss[s.id]; if(!st)return; const acc=recentAccuracy(st);
    if(s.stretch&&!st.mastered&&st.totalAnswered>=6&&acc!==null&&acc<60){ const pre=s.prereq&&skillLabelMap(id)[s.prereq];
      out.push({kind:'stuck',icon:'🧱',text:`<b>${esc(skillDisplayLabel(s))}</b> is wobbly (${acc}% lately). Like a Jenga tower, check the block underneath: a quick session of <b>${esc(pre?pre.label:'the skill below')}</b> first often fixes it.`}); return; }
    if(!st.mastered&&st.totalAnswered>=6&&acc!==null&&acc<60) out.push({kind:'stuck',icon:'💬',text:`<b>${esc(s.label)}</b> is at ${acc}% lately. Sit beside ${name} for one session — don't reteach; ask "how did you think about that one?" and read the explanations together.`}); });
  // 2. next peak ready / close to mastery
  meta.skills.filter(s=>s.stretch&&isSkillUnlocked(id,s)&&ss[s.id]&&ss[s.id].totalAnswered===0).slice(0,3).forEach(s=>
    out.push({kind:'ready',icon:'🚀',text:`<b>${esc(s.label)}</b> (${esc(GRADE_TIERS[s.grade].label)}) is unlocked but not started — invite ${name} to try the next peak.`}));
  vis.filter(s=>{const st=ss[s.id];return st&&!st.mastered&&st.difficulty>=8;}).slice(0,2).forEach(s=>
    out.push({kind:'close',icon:'⛰️',text:`<b>${esc(s.label)}</b> is at Elevation ${ss[s.id].difficulty}/${MAX_DIFFICULTY} — a couple more strong sessions and it's mastered${meta.skills.some(x=>x.stretch&&x.prereq===s.id)?' (and its next-grade version unlocks)':''}.`}));
  // 3. spaced review due
  vis.filter(s=>{const st=ss[s.id];return st&&st.mastered&&st.lastPracticed&&dateDiffDays(st.lastPracticed,todayStr())>=7;}).slice(0,3).forEach(s=>
    out.push({kind:'review',icon:'🔁',text:`<b>${esc(s.label)}</b> was mastered but hasn't been practiced in ${dateDiffDays(ss[s.id].lastPracticed,todayStr())} days — one quick session keeps it fresh.`}));
  // 4. mood
  const moods=(l.moodLog||[]).filter(m=>m.date>=daysAgoStr(6));
  const low=moods.filter(m=>m.mood==='hard'||m.mood==='meh').length, high=moods.filter(m=>m.mood==='love').length;
  if(low>=2) out.push({kind:'mood',icon:'❤️',text:`Learning has felt "meh" or "hard" on ${low} of the last 7 days. Ask ${name} what's getting in the way — the goal, the difficulty, or just the day? A lighter goal or a fun Trail Time mission can reset things.`});
  else if(high>=3) out.push({kind:'mood',icon:'🎉',text:`${name} said they <b>loved</b> learning on ${high} days this week — tell them you noticed!`});
  // 5. momentum
  const last=l.lastActiveDate; const idle=last?dateDiffDays(last,todayStr()):null;
  if(idle!==null&&idle>=2) out.push({kind:'nudge',icon:'👋',text:`No sessions for ${idle} days. A short focus block together is an easy restart.`});
  if(!currentWeeklyGoal(l)) out.push({kind:'goal',icon:'🎯',text:`${name} hasn't set a goal for this week. Self-set goals build ownership — ask them to pick one on Today's Route.`});
  const ws=APP.workshops[id];
  if(ws&&ws.projectTitle){ const recent=Object.keys(ws.checkins||{}).filter(d=>ws.checkins[d]&&d>=daysAgoStr(2)).length; if(!recent) out.push({kind:'mission',icon:'🛠️',text:`Trail Time mission "<b>${esc(ws.projectTitle)}</b>" hasn't had a check-in for 3 days. Ask what the next small step is — and who the showcase audience will be.`}); }
  return out;
}
function coachQuestions(id){
  const l=APP.learners[id]; const ss=APP.skillStates[id]; const ws=APP.workshops[id];
  const stuck=visibleSkills(id).find(s=>{const st=ss[s.id];const acc=st?recentAccuracy(st):null;return st&&!st.mastered&&st.totalAnswered>=6&&acc!==null&&acc<60;});
  const qs=[];
  qs.push(stuck?`What's the trickiest part of ${stuck.label} right now? What have you tried?`:'What was the hardest thing you worked on this week — and how did you get unstuck?');
  const lastJ=ws&&ws.journal&&ws.journal[0];
  qs.push(lastJ?`You wrote "${lastJ.text.slice(0,60)}${lastJ.text.length>60?'…':''}" — tell me more about that.`:'What are you most proud of this week?');
  qs.push(ws&&ws.projectTitle?`How is "${ws.projectTitle}" going? Who will be your audience for the showcase?`:'If you could build or learn anything next week, what would it be?');
  qs.push(l.myWhy?`You said your why is "${l.myWhy}" — is that still true? What would make it even more exciting?`:'Why does learning matter to YOU? (Help them put their own "why" into words — they can save it on Today\'s Route.)');
  const g=currentWeeklyGoal(l);
  qs.push(g?(g.hit?'You hit your weekly goal! Should next week\'s goal be bigger, or different?':`Your goal is ${g.target} sessions — what will help you get there?`):'What goal do you want to set for next week?');
  return qs;
}
function renderMoodStrip(learner){
  const byDate={}; (learner.moodLog||[]).forEach(m=>byDate[m.date]=m.mood);
  const cells=[]; for(let i=13;i>=0;i--){ const d=daysAgoStr(i); const m=MOODS.find(x=>x.id===byDate[d]);
    cells.push(`<span class="mood-cell" title="${fmtDateShort(d)}${m?': '+m.label:''}">${m?m.emoji:'·'}</span>`); }
  return `<div class="mood-strip">${cells.join('')}</div>`;
}
function renderCoachCorner(id){
  const l=APP.learners[id]; const av=accentVars(LEARNERS_META[id].color); const name=esc(l.name);
  const wk=currentWeekKey(); const prevWk=weekStartStr(daysAgoStr(7));
  const prevWkEnd=daysAgoStr(dateDiffDays(wk,todayStr())+1);
  const weekSessions=sessionsInRange(l,wk); const weekFocus=focusSecInRange(l,wk); const prevFocus=focusSecInRange(l,prevWk,prevWkEnd);
  const weekCorrect=weekSessions.reduce((a,s)=>a+s.correct,0), weekTotal=weekSessions.reduce((a,s)=>a+s.total,0);
  const g=currentWeeklyGoal(l);
  const tiles=[
    {k:'Sessions this week',v:`${weekSessions.length}${g?` / ${g.target}`:''}`,sub:g?(g.hit?'goal reached 🎉':'child-set goal'):'no goal set yet'},
    {k:'Focused time',v:fmtFocusDuration(weekFocus),sub:prevFocus>0?`last week ${fmtFocusDuration(prevFocus)}`:'this week'},
    {k:'Accuracy',v:weekTotal?Math.round(weekCorrect/weekTotal*100)+'%':'—',sub:weekTotal?`${weekCorrect}/${weekTotal} this week`:'no sessions yet'},
    {k:'Focus blocks',v:String(l.focusBlocksTotal||0),sub:'25-min blocks, all-time'}
  ].map(t=>`<div class="coach-tile"><div class="coach-tile-k">${t.k}</div><div class="coach-tile-v mono">${t.v}</div><div class="coach-tile-s">${t.sub}</div></div>`).join('');
  const ins=coachInsights(id);
  const insHtml=ins.length?ins.slice(0,7).map(x=>`<div class="coach-insight coach-${x.kind}"><span class="coach-ico">${x.icon}</span><div>${x.text}</div></div>`).join('')
    :`<div class="coach-insight"><span class="coach-ico">✅</span><div>Nothing needs you right now — ${name} is on track. Celebrate the streak!</div></div>`;
  const qs=coachQuestions(id).map(q=>`<li>${esc(q)}</li>`).join('');
  const logs=(l.coachLog||[]).slice(0,3).map(c=>`<div class="journal-entry"><div class="journal-date mono">${c.date}</div>${esc(c.text)}</div>`).join('');
  return `<div class="card coach-card">
    ${l.myWhy?`<div class="coach-why">${icon('heart','var(--bad)',16)} <span>${name}'s why: <b>“${esc(l.myWhy)}”</b></span></div>`:''}
    <div class="coach-grid">${tiles}</div>
    <div class="coach-sub-h">How learning felt (last 14 days)</div>
    ${renderMoodStrip(l)}
    <div class="coach-sub-h">Where to lean in</div>
    <div class="coach-insights">${insHtml}</div>
    <div class="coach-sub-h">Weekly 1:1 — conversation starters</div>
    <ul class="coach-qs">${qs}</ul>
    <div class="field"><textarea id="coachLogInput" rows="2" placeholder="Notes from this week's 1:1 with ${name} — what motivates them, what to try next..."></textarea></div>
    <button class="btn btn-primary" onclick="addCoachLog()">Log this week's 1:1</button>
    ${logs?`<div style="height:10px"></div>${logs}`:''}
  </div>`;
}
function addCoachLog(){
  const el=document.getElementById('coachLogInput'); const text=el&&el.value?String(el.value).trim():'';

/* Next Peak manager: the Guide can see every next-grade skill, why it is (un)locked, and
   unlock one early when they judge the child ready (Alpha lets a child jump ahead the
   moment they're ready — the software gates on mastery, the Guide can override). */
function renderNextPeakManager(id){
  const meta=LEARNERS_META[id]; const stretch=meta.skills.filter(s=>s.stretch);
  if(!stretch.length) return `<div class="section-sub">${esc(APP.learners[id].name)} is on the top tier we have (Grade 5) — every skill is already open.</div>`;
  const labels=skillLabelMap(id); const ss=APP.skillStates[id];
  const rows=stretch.map(s=>{
    const why=unlockReason(id,s); const pre=labels[s.prereq]; const preSt=pre?ss[pre.id]:null;
    const status=why==='mastery'?`<span class="pill pill-good">Unlocked · mastered ${esc(pre.label)}</span>`:(why==='guide'?`<span class="pill pill-good">Unlocked by Guide</span>`:(why==='started'?`<span class="pill pill-good">In progress</span>`:`<span class="pill pill-warn">Locked · ${pre?`${esc(pre.label)} Elev ${preSt?preSt.difficulty:1}/${MAX_DIFFICULTY}`:'needs Guide'}</span>`));
    const btn=why==='locked'?`<button class="btn btn-secondary btn-sm" onclick="toggleSkillUnlock('${s.id}')">Unlock early</button>`:(why==='guide'?`<button class="btn btn-secondary btn-sm" onclick="toggleSkillUnlock('${s.id}')">Re-lock</button>`:'');
    return `<div class="peak-row"><div style="flex:1"><b>${esc(s.label)}</b> <span class="grade-chip">${esc(GRADE_TIERS[s.grade].label)}</span><div style="margin-top:4px">${status}</div></div>${btn}</div>`;
  }).join('');
  return `<div class="card" style="padding:6px 16px">${rows}</div>`;
}
function toggleSkillUnlock(skillId){
  const id=APP.currentLearnerId; const l=APP.learners[id];
  const u=APP.auth.currentUser; if(!u||u.role==='student')return; // only a Guide/parent can override
  if(!l.unlockedSkills||typeof l.unlockedSkills!=='object')l.unlockedSkills={};
  if(l.unlockedSkills[skillId]) delete l.unlockedSkills[skillId]; else l.unlockedSkills[skillId]=true;
  saveLearner(id); render();
}
/* Focus Time chart: focused minutes per day across the Camp Log range. */
function renderFocusChart(learner,av){
  const rangeId=CAMP_RANGES.some(r=>r.id===APP.campLogRange)?APP.campLogRange:'7d';
  const days=CAMP_RANGES.find(r=>r.id===rangeId).days;
  const startStr=daysAgoStr(days-1); const b={};
  (learner.sessionLog||[]).forEach(s=>{ if(s.date<startStr||!s.sec)return; if(!b[s.date])b[s.date]={sec:0,n:0}; b[s.date].sec+=s.sec; b[s.date].n++; });
  const dates=Object.keys(b).sort();
  const maxMin=Math.max(30,...dates.map(d=>Math.ceil(b[d].sec/60)));
  const yMax=Math.ceil(maxMin/30)*30;
  const points=dates.map(d=>({xFrac:days<=1?0:dateDiffDays(startStr,d)/(days-1),y:Math.round(b[d].sec/60),tip:`${fmtDateShort(d)}: ${fmtFocusDuration(b[d].sec)} focused · ${b[d].n} session${b[d].n>1?'s':''}`}));
  const ticks=[0,yMax/2,yMax];
  return svgXYChart({points,xTickLabels:windowXTicks(days),yMin:0,yMax,yTicks:ticks,yFmt:v=>v+'m',color:av.c,connectLine:true,
    emptyLabel:'No focused time recorded in this range yet (it starts counting from this update on).'});
}
