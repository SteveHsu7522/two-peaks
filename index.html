<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Peaks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#FBF7EF; --surface:#FFFFFF; --surface-2:#F3ECDC; --surface-3:#EAE1CC;
  --ink:#232A3D; --ink-soft:#5B6178; --ink-faint:#8C90A3; --border:#E1D6BE;
  --accent:#E8912E; --accent-strong:#C97417; --accent-soft:#FBEBD3;
  --teal:#1F8A82; --teal-strong:#146760; --teal-soft:#DCF0EC;
  --plum:#8B5FBF; --plum-strong:#6F3FA0; --plum-soft:#EFE4F7;
  --sky:#2F86C9; --sky-strong:#1F63A0; --sky-soft:#DDEEFA;
  --good:#3D8F5B; --good-soft:#E1F3E6; --warn:#C9791A; --warn-soft:#FBE9D2;
  --bad:#C6435A; --bad-soft:#FAE1E5;
  --shadow-sm:0 1px 2px rgba(35,30,15,.08); --shadow-md:0 6px 20px rgba(35,30,15,.10);
  --radius-sm:10px; --radius-md:16px; --radius-lg:24px;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Libre Franklin',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141826; --surface:#1D2338; --surface-2:#242B45; --surface-3:#323A58;
  --ink:#EDEFF7; --ink-soft:#B7BCD3; --ink-faint:#7D839C; --border:#333D5C;
  --accent:#F0A63E; --accent-strong:#FFC670; --accent-soft:#3A2C14;
  --teal:#3FC2B7; --teal-strong:#7EDDD4; --teal-soft:#123230;
  --good:#5FC486; --good-soft:#173322; --warn:#E2A24C; --warn-soft:#3A2A10;
  --bad:#F2748A; --bad-soft:#3A1B22;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#141826; --surface:#1D2338; --surface-2:#242B45; --surface-3:#323A58;
  --ink:#EDEFF7; --ink-soft:#B7BCD3; --ink-faint:#7D839C; --border:#333D5C;
  --accent:#F0A63E; --accent-strong:#FFC670; --accent-soft:#3A2C14;
  --teal:#3FC2B7; --teal-strong:#7EDDD4; --teal-soft:#123230;
  --good:#5FC486; --good-soft:#173322; --warn:#E2A24C; --warn-soft:#3A2A10;
  --bad:#F2748A; --bad-soft:#3A1B22;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);}
h1,h2,h3,.display{font-family:var(--font-display);text-wrap:balance;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
#app{max-width:1080px;margin:0 auto;padding:0 16px 48px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 4px 10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;flex:none;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:.2px;}
.brand-sub{font-size:.72rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:-2px;}
.learner-switch{display:flex;gap:8px;}
.learner-btn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);transition:border-color .15s,background .15s;}
.learner-btn .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:.85rem;overflow:hidden;flex:none;}
.learner-btn .dot svg{width:100%;height:100%;}
.learner-btn[data-active="true"]{border-color:var(--accent-color,var(--accent));background:var(--accent-color-soft,var(--accent-soft));}
.learner-btn .lbl{text-align:left;line-height:1.15;}
.learner-btn .lbl b{display:block;font-size:.85rem;}
.learner-btn .lbl span{display:block;font-size:.68rem;color:var(--ink-faint);}
.stat-strip{display:flex;gap:14px;flex-wrap:wrap;padding:2px 4px 14px;}
.stat-chip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:7px 12px;box-shadow:var(--shadow-sm);}
.stat-chip .num{font-family:var(--font-mono);font-weight:600;font-size:.95rem;}
.stat-chip .cap{font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
.xpbar-wrap{flex:1;min-width:160px;display:flex;flex-direction:column;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow-sm);}
.xpbar-top{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;}
.xpbar-track{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.xpbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-color,var(--accent)),var(--accent-color-strong,var(--accent-strong)));}
.tabbar{display:flex;gap:6px;border-bottom:1.5px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab-btn{display:flex;align-items:center;gap:7px;padding:10px 14px;border:none;background:none;color:var(--ink-soft);font-weight:600;font-size:.88rem;border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab-btn[data-active="true"]{color:var(--ink);border-bottom-color:var(--accent-color,var(--accent));}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
.section-title{font-family:var(--font-display);font-weight:600;font-size:1.3rem;margin:0 0 4px;}
.section-sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 16px;}
.grid{display:grid;gap:14px;}
.grid-skills{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
.skill-card{padding:16px;display:flex;flex-direction:column;gap:10px;}
.skill-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.skill-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.skill-name{font-weight:600;font-size:.95rem;}
.elev-badge{font-size:.66rem;font-family:var(--font-mono);padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;}
.ascent{display:flex;align-items:center;gap:6px;}
.ascent-track{flex:1;height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.ascent-fill{height:100%;background:var(--teal);border-radius:999px;}
.ascent-pct{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint);}
.skill-meta{font-size:.72rem;color:var(--ink-faint);}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;padding:3px 8px;border-radius:999px;}
.pill-good{background:var(--good-soft);color:var(--good);}
.pill-warn{background:var(--warn-soft);color:var(--warn);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:none;font-weight:600;font-size:.86rem;}
.btn-primary{background:var(--accent-color,var(--accent));color:#221602;}
.btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:default;}
.route-list{display:flex;flex-direction:column;gap:10px;}
.route-item{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.route-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;}
.route-check[data-done="true"]{background:var(--good);border-color:var(--good);color:#fff;}
.route-body{flex:1;}
.route-title{font-weight:600;font-size:.92rem;}
.route-sub{font-size:.76rem;color:var(--ink-faint);}
.badge-row{display:flex;flex-wrap:wrap;gap:10px;}
.badge-tile{width:84px;text-align:center;font-size:.68rem;color:var(--ink-soft);}
.badge-shape{width:56px;height:56px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;}
.badge-tile.locked{opacity:.35;}
.reward-row{display:flex;align-items:center;justify-content:between;gap:10px;padding:12px 14px;}
.reward-row .rlbl{flex:1;font-weight:600;font-size:.88rem;}
.reward-cost{font-family:var(--font-mono);font-size:.8rem;color:var(--accent-strong);}
.modal-overlay{position:fixed;inset:0;background:rgba(15,12,4,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:26px;}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--ink-faint);margin-bottom:14px;font-family:var(--font-mono);}
.qprompt{font-family:var(--font-display);font-size:1.25rem;font-weight:600;margin:6px 0 18px;white-space:pre-line;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.choice-btn{padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-2);font-weight:600;font-size:1rem;text-align:center;}
.choice-btn[data-state="correct"]{background:var(--good-soft);border-color:var(--good);color:var(--good);}
.choice-btn[data-state="wrong"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto;}
.key-btn{padding:14px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-family:var(--font-mono);font-size:1.05rem;font-weight:600;}
.answer-display{text-align:center;font-family:var(--font-mono);font-size:1.6rem;font-weight:600;padding:10px;border:1.5px dashed var(--border);border-radius:10px;margin-bottom:12px;min-height:46px;}
.field-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;}
.field-box{width:74px;text-align:center;font-family:var(--font-mono);font-size:1.5rem;font-weight:600;padding:10px 4px;border:1.5px dashed var(--border);border-radius:10px;min-height:46px;cursor:pointer;}
.field-box[data-active="true"]{border-style:solid;border-color:var(--accent-color,var(--accent));background:var(--accent-color-soft,var(--accent-soft));}
.field-sep{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--ink-faint);}
.field-labels{display:flex;justify-content:center;gap:30px;font-size:.68rem;color:var(--ink-faint);margin:4px 0 12px;}
.feedback-box{margin-top:16px;padding:14px;border-radius:12px;font-size:.9rem;}
.feedback-good{background:var(--good-soft);color:var(--good);}
.feedback-bad{background:var(--bad-soft);color:var(--bad);}
.center{text-align:center;}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-faint);}
textarea,input[type=text],input[type=date]{font-family:var(--font-body);border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:var(--surface);color:var(--ink);font-size:.88rem;width:100%;}
label.flabel{font-size:.76rem;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.checkin-strip{display:flex;gap:4px;flex-wrap:wrap;}
.checkin-dot{width:22px;height:22px;border-radius:6px;background:var(--surface-3);}
.checkin-dot[data-on="true"]{background:var(--good);}
.idea-card{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font-size:.85rem;}
.idea-card b{display:block;font-family:var(--font-display);font-size:.98rem;margin-bottom:3px;}
.journal-entry{padding:10px 12px;border-left:3px solid var(--teal);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:.84rem;margin-bottom:8px;}
.journal-date{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-faint);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.82rem;z-index:60;box-shadow:var(--shadow-md);}
.passage-text{font-size:.95rem;line-height:1.65;background:var(--surface-2);padding:16px;border-radius:12px;margin-bottom:16px;max-height:280px;overflow-y:auto;}
.area-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
.area-card{padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:1.5px solid var(--border);}
.area-card[data-active="true"]{border-color:var(--teal);background:var(--teal-soft);}
.step-card{padding:18px;margin-bottom:18px;}
.step-card[data-locked="true"]{opacity:.55;}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--surface-3);color:var(--ink-soft);font-family:var(--font-mono);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;flex:none;}
.step-num[data-done="true"]{background:var(--good);color:#fff;}
.step-title{font-family:var(--font-display);font-weight:600;font-size:1.08rem;flex:1;}
.step-body{font-size:.86rem;color:var(--ink-soft);line-height:1.55;margin-bottom:10px;}
.howto-box{background:var(--teal-soft);border-radius:12px;padding:11px 14px;font-size:.82rem;color:var(--ink);line-height:1.55;margin:10px 0 4px;}
.howto-box b{color:var(--teal-strong);}
.lock-hint{font-size:.82rem;color:var(--ink-faint);font-style:italic;}
.checkin-dot[data-today="true"]{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
@media (max-width:600px){.choices{grid-template-columns:1fr;}}

/* ================= MASCOT HERO / MOTIVATION ADD-ONS ================= */
.hero-card{display:flex;align-items:center;gap:18px;padding:20px 22px;background:linear-gradient(135deg,var(--accent-color-soft,var(--accent-soft)),var(--surface));border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:22px;overflow:hidden;position:relative;}
.hero-mascot{width:78px;height:78px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12));}
.hero-mascot svg{animation:bob 3.2s ease-in-out infinite;}
.hero-greet{font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin:0 0 4px;}
.hero-sub{font-size:.86rem;color:var(--ink-soft);margin:0;}
.hero-streak{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:.8rem;color:var(--accent-strong);margin-top:6px;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){.hero-mascot svg{animation:none;}}

.elev-path-wrap{margin:2px 0 4px;}
.flame-row{display:flex;align-items:center;gap:2px;}
.flame-row svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));}

.feedback-box{animation:pop-in .32s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop-in{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.feedback-box{animation:none;}}

.choice-btn{transition:transform .1s ease;}
.choice-btn[data-state="correct"]{animation:pop-in .32s cubic-bezier(.2,1.4,.4,1);}
.summit-banner{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent-soft),var(--teal-soft));margin-bottom:14px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;}
@media (prefers-reduced-motion: reduce){.choice-btn[data-state="correct"]{animation:none;}}
</style>
</head>

  <div class="topbar" id="topbar"></div>
  <div class="stat-strip" id="statstrip"></div>
  <div class="tabbar" id="tabbar"></div>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ================= UTIL ================= */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[randInt(0,arr.length-1)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function uniqPush(a,v){if(!a.includes(v))a.push(v);return a;}
function fmtMoney(c){return '$'+(c/100).toFixed(2);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderPrompt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function gcd(a,b){return b===0?a:gcd(b,a%b);}
function factorsOf(n){const f=[];for(let i=1;i<=n;i++)if(n%i===0)f.push(i);return f;}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;}

/* ================= MATH GENERATORS: GRADE 2 (Comet) ================= */
function gAdd2(level){let a,b;
  if(level===1){a=randInt(2,9);b=randInt(2,9);}
  else if(level===2){a=randInt(10,50);b=randInt(2,9);}
  else if(level===3){a=randInt(10,60);b=randInt(10,39);}
  else if(level===4){a=randInt(20,80);b=randInt(15,79);}
  else{a=randInt(100,400);b=randInt(20,99);}
  const sum=a+b;
  const visual=level===1?{type:'sumpiles',a,b}:undefined;
  return{prompt:`${a} + ${b} = ?`,mode:'numeric',correctAnswer:sum,visual,explanation:`${a} + ${b} = ${sum}`};}
function gSub2(level){let a,b;
  if(level===1){a=randInt(5,18);b=randInt(1,a);}
  else if(level===2){a=randInt(20,60);b=randInt(2,9);}
  else if(level===3){a=randInt(30,80);b=randInt(11,29);}
  else if(level===4){a=randInt(40,99);b=randInt(15,a-1);}
  else{a=randInt(200,500);b=randInt(20,99);}
  if(b>a)[a,b]=[b,a];
  const diff=a-b;
  const visual=level===1?{type:'takeaway',total:a,removed:b}:undefined;
  return{prompt:`${a} - ${b} = ?`,mode:'numeric',correctAnswer:diff,visual,explanation:`${a} - ${b} = ${diff}`};}
function gPlaceValue2(level){
  if(level===1){const tens=randInt(1,9),ones=randInt(0,9);const n=tens*10+ones;const askTens=Math.random()<0.5;const correct=askTens?tens:ones;
    const choices=[...new Set([correct,askTens?ones:tens,randInt(0,9),randInt(0,9)])].slice(0,4);
    while(choices.length<4)uniqPush(choices,randInt(0,9));
    return{prompt:`In the number ${n}, how many ${askTens?'tens':'ones'} are there?`,mode:'mc',choices:shuffle(choices),correctAnswer:correct,explanation:`${n} = ${tens} tens and ${ones} ones.`};}
  if(level===2){const tens=randInt(1,9),ones=randInt(0,9);const n=tens*10+ones;const digit=Math.random()<0.5?tens:ones;const isTensDigit=digit===tens;const value=isTensDigit?tens*10:ones;

/* Any student account beyond the two pre-seeded ones (osmand/oliver) gets a

function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return h;}
const LEARNER_MASCOTS=['comet','rocket'];

function ensureDynamicLearnerMeta(user){
  if(!user||user.role!=='student'||!user.learnerId)return;
  const id=user.learnerId;
  if(LEARNERS_META[id])return;
  const tier=tierForGrade(user.grade);
  const idx=Math.abs(hashStr(user.username))%2;
  LEARNERS_META[id]={id,defaultName:user.username,ageLabel:`Grade ${user.grade||2}`,color:idx===0?'accent':'teal',mascot:LEARNER_MASCOTS[idx],skills:tier.skills,passages:tier.passages,gradeKey:tier.gradeKey};
}
function ensureLearnerRuntimeState(user){
  if(!user||user.role!=='student'||!user.learnerId)return;

  if(!APP.learners[id]) APP.learners[id]=defaultLearner(id);

/* ================= ADAPTIVE ENGINE ================= */
function makeSkillState(){return{difficulty:1,streakCorrect:0,streakWrong:0,history:[],totalAnswered:0,totalCorrect:0,mastered:false,lastPracticed:null,passageIndex:0,passagesCompleted:[false,false,false,false,false,false]};}
function applyAnswer(state,correct){
  state.totalAnswered++; if(correct)state.totalCorrect++;
  state.history.push(correct?1:0); if(state.history.length>20)state.history.shift();
  if(correct){state.streakCorrect++;state.streakWrong=0; if(state.streakCorrect>=3&&state.difficulty<5){state.difficulty++;state.streakCorrect=0;}}
  else{state.streakWrong++;state.streakCorrect=0; if(state.streakWrong>=2&&state.difficulty>1){state.difficulty--;state.streakWrong=0;}}
  const last10=state.history.slice(-10); const acc=last10.reduce((a,v)=>a+v,0)/last10.length;
  state.mastered=state.difficulty===5&&state.totalAnswered>=10&&acc>=0.85;
  state.lastPracticed=todayStr();
  return state;
}

function svgDotsPile(n,color,x0,y0,w0,h0){
  // Raw <circle> elements (no wrapping <svg>) so this can be embedded either
  // standalone or as a building block inside another visual's own <svg>.
  const cols=Math.max(1,Math.min(10,Math.ceil(Math.sqrt(n*w0/h0))));
  const rows=Math.ceil(n/cols);
  const padX=Math.min(14,w0*0.08), padY=Math.min(14,h0*0.12);
  const cellW=(w0-padX*2)/cols, cellH=(h0-padY*2)/Math.max(rows,1);
  const r=Math.max(3,Math.min(cellW,cellH)/2-2);
  let out='';
  for(let i=0;i<n;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const cx=x0+padX+cellW*col+cellW/2, cy=y0+padY+cellH*row+cellH/2;
    out+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${color}"/>`;
  }
  return out;
}

function svgCoinsRow(coins,color){

  const sizeMap={Q:22,D:16,N:19,P:14};

function svgTakeaway(total,removed,color){
  const W=220,H=114;

/* Central dispatcher: turns a generator's declarative q.visual into markup. */
function renderQuestionVisual(v,color){
  if(!v)return '';
  if(v.type==='clock')return svgClock(v.h,v.m);
  if(v.type==='rect')return svgRect(v.l,v.w);
  if(v.type==='dots')return svgDotsPileStandalone(v.n,color);
  if(v.type==='array')return svgArrayGrid(v.rows,v.cols,color);
  if(v.type==='groups')return svgGroupsVisual(v.total,v.groups,color);
  if(v.type==='fractionbar')return svgFractionBar(v.num,v.den,color);
  if(v.type==='fractionpair')return svgFractionPair(v.n1,v.d1,v.n2,v.d2,color);
  if(v.type==='coins')return svgCoinsRow(v.coins,color);
  if(v.type==='sumpiles')return svgTwoPiles(v.a,v.b,color);
  if(v.type==='takeaway')return svgTakeaway(v.total,v.removed,color);
  return '';
}

/* Celebration confetti burst for level-ups, mastery and badges. Skips animation if the viewer prefers reduced motion. */
function burstConfettiBig(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas=document.createElement('canvas');
  canvas.style.position='fixed'; canvas.style.inset='0'; canvas.style.pointerEvents='none'; canvas.style.zIndex='999';
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d'); if(!ctx){canvas.remove();return;}
  const colors=['#E8912E','#1F8A82','#3D8F5B','#C6435A','#F2C94C','#7EDDD4'];
  const pieces=Array.from({length:90},()=>({
    x:canvas.width/2+randInt(-120,120), y:canvas.height*0.3+randInt(-30,30),
    vx:(Math.random()-0.5)*9, vy:Math.random()*-7-3,
    size:randInt(5,9), color:pick(colors), rot:Math.random()*360, vrot:(Math.random()-0.5)*12
  }));
  let frame=0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.vy+=0.22; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    if(frame<75) requestAnimationFrame(tick); else canvas.remove();
  }
  tick();
}

/* ================= PERSISTENCE =================
   Cloud sync uses Firebase Realtime Database (see firebaseConfig + the
   firebase-*-compat.js <script> tags loaded in <head>), so this app can be
   hosted anywhere (e.g. GitHub Pages) and shared with a public link while
   still syncing the family roster + progress across devices. If the
   Firebase SDK fails to load or init (offline, blocked script, etc.),
   everything falls back to this browser's own localStorage. */
const Store={
  db:null,
  async init(){
    try{
      if(window.firebase && window.firebase.initializeApp && typeof FIREBASE_CONFIG!=='undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey){
        if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        this.db=firebase.database();
      }
    }
    catch(e){ console.warn('firebase init failed',e); this.db=null; }
  },
  _lsKey(path){return 'twopeaks:'+path;},
  lsGet(path){ try{const raw=localStorage.getItem(this._lsKey(path)); return raw?JSON.parse(raw):null;}catch(e){return null;} },
  lsSet(path,data){ try{localStorage.setItem(this._lsKey(path),JSON.stringify(data));}catch(e){} },
  async dbGet(path){
    if(!this.db)return null;
    try{ const snap=await this.db.ref(path).once('value'); return snap.exists()?snap.val():null; }
    catch(e){ console.warn('db get failed',path,e); return null; }
  },
  dbSet(path,data){
    if(!this.db)return;
    try{ this.db.ref(path).set(data).catch(e=>console.warn('db set failed',path,e)); }
    catch(e){ console.warn('db set threw',path,e); }
  },
  save(path,data){ this.lsSet(path,data); this.dbSet(path,data); }
};

async function loadAllData(){
  for(const id of Object.keys(LEARNERS_META)){
    const cached=Store.lsGet(`learners/${id}`);
    APP.learners[id]=cached||defaultLearner(id);
    const cachedWs=Store.lsGet(`learners/${id}/workshop`);
    APP.workshops[id]=cachedWs||defaultWorkshop();
    APP.skillStates[id]={};
    for(const sk of LEARNERS_META[id].skills){
      const cachedSk=Store.lsGet(`learners/${id}/skills/${sk.id}`);
      APP.skillStates[id][sk.id]=cachedSk||makeSkillState();
    }
  }
  APP.rewards=Store.lsGet('rewards/list')||{items:DEFAULT_REWARDS.slice()};
  migrateRewardsIfLegacy();
  render();
  if(await refreshCloudData()) render();
}
/* Pulls the latest learners/workshops/skills/rewards from the shared cloud
   store and merges them into APP in place. Used both by loadAllData() at boot
   AND, repeatedly, by the Camp Log auto-refresh below -- this is what lets a
   parent's already-open Camp Log notice a child's progress on ANOTHER device
   without the parent having to reload the page (the app only ever fetched
   once at boot before this). Returns true if it actually touched the cloud
   (false when running fully offline/local-only, e.g. in tests). */
async function refreshCloudData(){
  if(!Store.db)return false;
  // Firebase Realtime Database silently drops keys whose value is an empty
  // array/object (e.g. badges:[] or checkins:{}) instead of storing them —
  // merging onto a freshly-built default object restores those keys so the
  // UI never sees `undefined` where it expects an array/object.
  for(const id of Object.keys(LEARNERS_META)){
    const remote=await Store.dbGet(`learners/${id}`);
    if(remote){ const merged=Object.assign(defaultLearner(id),remote); APP.learners[id]=merged; Store.lsSet(`learners/${id}`,merged); }
    else{ Store.dbSet(`learners/${id}`,APP.learners[id]); }
    const remoteWs=await Store.dbGet(`learners/${id}/workshop`);
    if(remoteWs){ const mergedWs=Object.assign(defaultWorkshop(),remoteWs); APP.workshops[id]=mergedWs; Store.lsSet(`learners/${id}/workshop`,mergedWs); }
    else{ Store.dbSet(`learners/${id}/workshop`,APP.workshops[id]); }
    for(const sk of LEARNERS_META[id].skills){
      const remoteSk=await Store.dbGet(`learners/${id}/skills/${sk.id}`);
      if(remoteSk){ const mergedSk=Object.assign(makeSkillState(),remoteSk); APP.skillStates[id][sk.id]=mergedSk; Store.lsSet(`learners/${id}/skills/${sk.id}`,mergedSk); }
      else{ Store.dbSet(`learners/${id}/skills/${sk.id}`,APP.skillStates[id][sk.id]); }
    }
  }
  const remoteRewards=await Store.dbGet('rewards/list');
  if(remoteRewards){ const mergedRewards=Object.assign({items:DEFAULT_REWARDS.slice()},remoteRewards); APP.rewards=mergedRewards; Store.lsSet('rewards/list',mergedRewards); }
  else{ Store.dbSet('rewards/list',APP.rewards); }
  migrateRewardsIfLegacy();
  APP.lastCloudSyncAt=Date.now();
  return true;
}
/* Camp Log auto-refresh: while a parent/admin is sitting on the Camp Log tab,
   poll the cloud every 15s so a child's just-completed session (on a
   different device/browser) shows up without a manual page reload. Guarded
   so it only ever runs one interval at a time and stops the moment the
   viewer leaves Camp Log or logs out (see ensureCampPolling(), called from
   render()). */
let campPollTimer=null;
let campPollActive=false; // tracks "polling is arranged", independent of whether setInterval
                           // even exists in this JS environment (it doesn't in some test sandboxes) --
                           // this is what stops render() from re-firing a fetch on every single call
                           // while the viewer sits on Camp Log.
async function pollCampLogOnce(){
  if(!APP.auth.currentUser||APP.activeTab!=='camp'){ stopCampPolling(); return; }
  const changed=await refreshCloudData();
  if(changed && APP.auth.currentUser && APP.activeTab==='camp') render();
}
function startCampPolling(){
  if(campPollActive)return;
  campPollActive=true;
  pollCampLogOnce(); // refresh immediately on arrival, don't wait for the first tick
  if(typeof setInterval==='function'){
    campPollTimer=setInterval(pollCampLogOnce,15000);
    if(campPollTimer&&typeof campPollTimer.unref==='function')campPollTimer.unref(); // don't keep a Node test process alive
  }
}
function stopCampPolling(){
  campPollActive=false;
  if(campPollTimer){ if(typeof clearInterval==='function')clearInterval(campPollTimer); campPollTimer=null; }
}
function ensureCampPolling(){
  const onCampLog=APP.auth.currentUser && APP.auth.currentUser.role!=='student' && APP.activeTab==='camp';
  if(onCampLog){ if(!campPollActive) startCampPolling(); }
  else stopCampPolling();
}
/* Manual "Refresh" button in Camp Log, for a parent who doesn't want to wait
   for the 15s auto-poll. */
async function refreshCampLogNow(){
  if(!Store.db){ toast('目前是本機模式（尚未連接雲端同步）。'); return; }
  toast('正在更新最新進度...');
  await refreshCloudData();
  if(APP.activeTab==='camp') render();
  toast('Camp Log 已更新！');
}

/* ================= GAME LOGIC HELPERS ================= */
const LEVEL_XP_STEP=150, MAX_LEVEL=10;
function levelFromXp(xp){ return Math.min(MAX_LEVEL,Math.floor(xp/LEVEL_XP_STEP)+1); }
function xpIntoLevel(xp){ return levelFromXp(xp)>=MAX_LEVEL?LEVEL_XP_STEP:xp%LEVEL_XP_STEP; }
function touchStreak(learner){
  const today=todayStr();
  if(learner.lastActiveDate===today)return false;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  learner.streakDays=(learner.lastActiveDate===y)?learner.streakDays+1:1;
  learner.lastActiveDate=today;
  return true;
}
function ensureTodayLog(learner){
  const today=todayStr();
  if(!learner.todayLog||learner.todayLog.date!==today){
    // Day rollover: archive yesterday's snapshot before resetting, so Camp Log can
    // show a short daily-progress history (route-completion rate + accuracy rate).
    if(learner.todayLog){
      if(!learner.history)learner.history=[]; // guards Firebase's empty-array-drop quirk
      const prev=learner.todayLog;
      const routeDone=[prev.mathDone,prev.readingDone,prev.workshopDone,prev.journalDone].filter(Boolean).length;
      learner.history.push({date:prev.date,routeDone,answeredCount:prev.answeredCount||0,correctCount:prev.correctCount||0});
      learner.history=learner.history.slice(-30);
    }
    learner.todayLog={date:today,mathDone:false,readingDone:false,workshopDone:false,journalDone:false,answeredCount:0,correctCount:0};
  }
  // Defensive: a todayLog for TODAY created before these two counters existed
  // (an in-progress day carried over from an older build) won't have them yet.
  if(learner.todayLog.answeredCount==null)learner.todayLog.answeredCount=0;
  if(learner.todayLog.correctCount==null)learner.todayLog.correctCount=0;
}
/* Marks one of today's 4 route stops (math, reading, workshop check-in,
   closing circle) as done for today's route checklist — this only controls
   the ✓ shown on Today's Route, it does NOT award tokens itself (see
   finalizeCommon for practice sessions, and toggleCheckin/addJournal for the
   other two, which each decide their own token rule). Returns true if this
   call is the first time today this particular stop flipped to done. */
function markTodayLog(learner,key){
  ensureTodayLog(learner);
  if(learner.todayLog[key])return false;
  learner.todayLog[key]=true;
  return true;
}
/* Per-skill daily token cap (request: "每個session一天最多只能得到1個token" --
   each individual skill, e.g. addition vs subtraction, can earn at most 1
   token per day, even if the child does several good sessions of the SAME
   skill). A different skill that same day still earns its own token. */
function ensureTokenLog(learner){
  const today=todayStr();
  if(!learner.tokenLog||learner.tokenLog.date!==today) learner.tokenLog={date:today,awarded:{}};
  if(!learner.tokenLog.awarded)learner.tokenLog.awarded={}; // guards Firebase's empty-object-drop quirk
}
/* Records every token actually awarded, so Camp Log can show a parent where a
   child's tokens came from (request: "家長帳戶能統計小孩token從哪個session獲得的分布"). */
function logTokenAward(learner,source){
  if(!learner.tokenHistory)learner.tokenHistory=[]; // guards Firebase's empty-array-drop quirk
  learner.tokenHistory.push({date:todayStr(),source});
  learner.tokenHistory=learner.tokenHistory.slice(-200);
}
function checkBadges(learnerId){
  const learner=APP.learners[learnerId]; const ss=APP.skillStates[learnerId];
  const newly=[];
  for(const b of BADGE_DEFS){
    if(learner.badges.includes(b.id))continue;
    if(b.check(learner,ss,LEARNERS_META[learnerId].passages.length)){ learner.badges.push(b.id); newly.push(b); }
  }
  return newly;
}

}

function redeemReward(rid){
  const id=APP.currentLearnerId; const learner=APP.learners[id];
  const r=(APP.rewards.items||[]).find(x=>x.id===rid); if(!r||learner.tokens<r.cost)return;
  learner.tokens-=r.cost;
  learner.redemptions=learner.redemptions||[];
  learner.redemptions.unshift({label:r.label,cost:r.cost,date:todayStr()});
  learner.redemptions=learner.redemptions.slice(0,20);
  saveLearner(id); toast(`Redeemed: ${r.label}!`); render();
}
function toast(msg){
  const el=document.getElementById('toastRoot');
  el.innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{el.innerHTML='';},2600);
}

/* ================= SESSION ENGINE (practice quiz) ================= */
let session=null;
function openModal(html){ document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" id="modalOverlay">${html}</div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; session=null; }
function stopProp(ev){ ev.stopPropagation(); }

const CORRECT_PHRASES=['Nice work!','Boom — got it!',"You're on fire!",'Excellent!','Way to go!','Superstar move!','Nailed it!','Awesome job!','Brilliant!','Crushed it!'];
const WRONG_PHRASES=['Not quite.','So close!','Nice try.','Almost there.','Keep climbing.','Good effort.'];
/* mode 'divmod' (quotient+remainder) and 'fraction' (numerator+denominator)
   answer with two typed fields instead of one -- this is what lets a division
   question be answered as "22 remainder 2" instead of forcing a single
   number, and a fraction question be answered as a real n/d instead of just
   a numerator. fieldDefsFor() returns the ordered field keys for a mode, or
   null for the plain single-value modes ('numeric'/'mc'). */
function fieldDefsFor(mode){
  if(mode==='divmod')return['q','r'];
  if(mode==='fraction')return['n','d'];
  return null;
}
function startSession(skillId){
  const learnerId=APP.currentLearnerId;
  session={learnerId,skillId,qIndex:0,total:8,correctCount:0,xpEarned:0,missedQueue:0,answered:false,numericInput:'',fields:{},activeField:null,selected:null,currentIsReview:false,comboStreak:0};
  nextQuestionInSession();
  openModal(renderSessionModal());
}
function nextQuestionInSession(){
  const state=APP.skillStates[session.learnerId][session.skillId];
  const gen=GENERATORS[session.skillId];
  let isReview=false;
  if(session.qIndex>0&&session.qIndex%4===0&&session.missedQueue>0){ isReview=true; session.missedQueue--; }
  session.currentQuestion=gen(state.difficulty);
  session.currentIsReview=isReview; session.answered=false; session.numericInput=''; session.selected=null;
  const fields=fieldDefsFor(session.currentQuestion.mode);
  session.fields=fields?Object.fromEntries(fields.map(f=>[f,''])):{};
  session.activeField=fields?fields[0]:null;
}
function fieldLabelsFor(mode){
  return mode==='divmod'?[{key:'q',label:'Quotient'},{key:'r',label:'Remainder'}]:[{key:'n',label:'Numerator'},{key:'d',label:'Denominator'}];
}
function renderCompoundAnswerUI(q,av){
  const defs=fieldLabelsFor(q.mode);
  const sep=q.mode==='divmod'?'R':'/';
  const boxes=defs.map((d,i)=>{
    const active=session.activeField===d.key;
    const box=`<div class="field-box mono" data-active="${active}" onclick="setActiveField('${d.key}')">${esc(session.fields[d.key]||'')||'&nbsp;'}</div>`;
    return i<defs.length-1?box+`<div class="field-sep">${sep}</div>`:box;
  }).join('');
  const labels=`<div class="field-labels">${defs.map(d=>`<span>${d.label}</span>`).join('')}</div>`;
  const filled=defs.every(d=>session.fields[d.key]!==''&&session.fields[d.key]!=null);
  return `<div class="field-row" style="--accent-color:${av.c};--accent-color-soft:${av.soft}">${boxes}</div>
    ${labels}
    <div class="keypad">
      ${['7','8','9','4','5','6','1','2','3','→','0','⌫'].map(k=>`<button class="key-btn" ${session.answered?'disabled':''} onclick="keypadPress('${k}')">${k}</button>`).join('')}
    </div>
    <div style="height:10px"></div>
    <button class="btn btn-primary btn-block" ${session.answered||!filled?'disabled':''} onclick="answerFields()">Check</button>`;
}
function renderSessionModal(){
  const q=session.currentQuestion;
  const meta=skillLabelMap(session.learnerId)[session.skillId];
  const av=accentVars(LEARNERS_META[session.learnerId].color);
  const visual=renderQuestionVisual(q.visual,av.c);
  let body='';
  if(q.mode==='mc'){
    body=`<div class="choices">${q.choices.map(c=>{
      let state='';
      if(session.answered){ if(c===q.correctAnswer) state='correct'; else if(c===session.selected) state='wrong'; }
      return `<button class="choice-btn" data-state="${state}" ${session.answered?'disabled':''} onclick="answerMc(${JSON.stringify(c).replace(/"/g,'&quot;')})">${esc(c)}</button>`;
    }).join('')}</div>`;
  } else if(q.mode==='divmod'||q.mode==='fraction'){
    body=renderCompoundAnswerUI(q,av);
  } else {
    body=`<div class="answer-display mono">${session.numericInput||'&nbsp;'}</div>
    <div class="keypad">
      ${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button class="key-btn" ${session.answered?'disabled':''} onclick="keypadPress('${k}')">${k}</button>`).join('')}
    </div>
    <div style="height:10px"></div>
    <button class="btn btn-primary btn-block" ${session.answered||session.numericInput===''?'disabled':''} onclick="answerNumeric()">Check</button>`;
  }
  const feedback=session.answered?`<div class="feedback-box ${session.lastCorrect?'feedback-good':'feedback-bad'}">${session.lastCorrect?'✓ '+esc(session.lastPhrase)+' ':esc(session.lastPhrase)+' '}${esc(q.explanation)}</div>
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="advanceSession()">${session.qIndex+1>=session.total?'See Results':'Next Question'}</button>`:'';
  return `<div class="modal-card" onclick="stopProp(event)">
    <div class="qhead"><span>${meta.label}${session.currentIsReview?' · 🔁 Review':''}</span><span style="display:flex;align-items:center;gap:8px">${session.comboStreak>0?flameRow(session.comboStreak,av.c):''}Question ${session.qIndex+1} / ${session.total}</span></div>
    ${visual?`<div class="center">${visual}</div>`:''}
    <div class="qprompt">${renderPrompt(q.prompt)}</div>
    ${body}
    ${feedback}
    <div style="height:6px"></div>
    <button class="btn btn-secondary btn-block" onclick="quitSession()">Exit Session</button>
  </div>`;
}
function setActiveField(key){
  if(session.answered)return;
  session.activeField=key;
  openModal(renderSessionModal());
}
function keypadPress(k){
  if(session.answered)return;
  const fields=fieldDefsFor(session.currentQuestion.mode);
  if(fields){
    if(k==='→'){ const i=fields.indexOf(session.activeField); session.activeField=fields[(i+1)%fields.length]; }
    else if(k==='⌫'){ session.fields[session.activeField]=(session.fields[session.activeField]||'').slice(0,-1); }
    else{ session.fields[session.activeField]=(session.fields[session.activeField]||'')+k; }
  } else {
    if(k==='⌫') session.numericInput=session.numericInput.slice(0,-1);
    else if(k==='.'){ if(!session.numericInput.includes('.')) session.numericInput+='.'; }
    else session.numericInput+=k;
  }
  openModal(renderSessionModal());
}
function answerNumeric(){ submitAnswer(session.numericInput); }
function answerFields(){
  const fields=fieldDefsFor(session.currentQuestion.mode);
  if(!fields.every(f=>session.fields[f]!==''&&session.fields[f]!=null))return;
  submitAnswer(Object.assign({},session.fields));
}
function answerMc(value){ if(session.answered)return; session.selected=value; submitAnswer(value); }
function submitAnswer(value){
  if(session.answered)return;
  const q=session.currentQuestion;
  let correct;
  if(q.mode==='numeric'){ const v=parseFloat(value); correct=!isNaN(v)&&Math.abs(v-q.correctAnswer)<1e-6; }
  else if(q.mode==='divmod'){ correct=(parseInt(value.q,10)===q.correctAnswer.q)&&(parseInt(value.r,10)===q.correctAnswer.r); }
  else if(q.mode==='fraction'){ correct=(parseInt(value.n,10)===q.correctAnswer.n)&&(parseInt(value.d,10)===q.correctAnswer.d); }
  else{ correct=(value===q.correctAnswer); }
  session.answered=true; session.lastCorrect=correct;
  session.lastPhrase=correct?pick(CORRECT_PHRASES):pick(WRONG_PHRASES);
  const state=APP.skillStates[session.learnerId][session.skillId];
  applyAnswer(state,correct);
  const learner=APP.learners[session.learnerId];
  ensureTodayLog(learner);
  learner.todayLog.answeredCount++;
  if(correct) learner.todayLog.correctCount++;
  if(correct){
    session.comboStreak++;
    const mult=1+(state.difficulty-1)*0.15;
    const xp=Math.round(10*mult)+(session.currentIsReview?5:0);
    session.correctCount++; session.xpEarned+=xp;
  } else { session.missedQueue++; session.comboStreak=0; }
  /* Trail Tokens aren't earned per question — see finalizeCommon: finishing
     the whole session is worth +1 token, as long as no more than 2 questions
     in it were missed. */
  saveSkill(session.learnerId,session.skillId);
  openModal(renderSessionModal());
}
function advanceSession(){
  session.qIndex++;
  if(session.qIndex>=session.total){ finishPracticeSession(); return; }
  nextQuestionInSession();
  openModal(renderSessionModal());
}
function quitSession(){ closeModal(); render(); }
/* A completed session (math/reading practice, or a reading comprehension
   passage) earns a flat +1 Trail Token, as long as the child got no more than
   2 questions wrong in it -- but capped at 1 token per SKILL per day (a
   different skill that same day still earns its own token; the same skill
   again the same day does not). Miss more than 2, or already earned today's
   token for this exact skill, and the session still counts for XP/streak/
   "done for today", just no extra token. */
function finalizeCommon(learnerId,subjectKey,xpEarned,wrongCount,skillId){
  const learner=APP.learners[learnerId];
  touchStreak(learner);
  learner.xp+=xpEarned;
  const newLevel=levelFromXp(learner.xp); const leveledUp=newLevel>learner.level; learner.level=newLevel;
  markTodayLog(learner,subjectKey); // marks today's route checklist done; tokens are decided below, independently
  ensureTokenLog(learner);
  const alreadyEarnedToday=!!learner.tokenLog.awarded[skillId];
  const tokenAwarded=wrongCount<=2 && !alreadyEarnedToday;
  if(tokenAwarded){
    learner.tokens=(learner.tokens||0)+1;
    learner.tokenLog.awarded[skillId]=true;
    logTokenAward(learner,skillId);
  }
  const newBadges=checkBadges(learnerId);
  saveLearner(learnerId);
  return{leveledUp,newBadges,tokenAwarded,alreadyEarnedToday};
}
function finishPracticeSession(){
  const meta=skillLabelMap(session.learnerId)[session.skillId];
  const subjectKey=meta.subject==='math'?'mathDone':'readingDone';
  const wrongCount=session.total-session.correctCount;
  const{leveledUp,newBadges,tokenAwarded,alreadyEarnedToday}=finalizeCommon(session.learnerId,subjectKey,session.xpEarned,wrongCount,session.skillId);
  openModal(renderSummary(leveledUp,newBadges,tokenAwarded,alreadyEarnedToday));
}
function renderSummary(leveledUp,newBadges,tokenAwarded,alreadyEarnedToday){
  const av=accentVars(LEARNERS_META[APP.currentLearnerId].color);
  const mascot=LEARNERS_META[APP.currentLearnerId].mascot;
  const pct=session.correctCount/session.total;
  const bigWin=leveledUp||newBadges.length>0||pct>=0.85;
  if(bigWin) burstConfettiBig();
  const badgeHtml=newBadges.length?`<div class="badge-row" style="justify-content:center;margin-bottom:10px">${newBadges.map(b=>`<div class="badge-tile"><div class="badge-shape" style="background:${av.soft}">${icon(b.icon,av.c,28)}</div>${b.label}</div>`).join('')}</div>`:'';
  const summitLine=leveledUp?`<div class="summit-banner">${icon('star',av.c,22)} Level Up! Now Level ${APP.learners[APP.currentLearnerId].level}</div>`:(pct>=0.85?`<div class="summit-banner">${icon('flame',av.c,20)} Amazing session!</div>`:'');
  const noTokenReason=alreadyEarnedToday?'Already earned a token for this skill today':'No token this time — missed more than 2';
  const tokenChip=tokenAwarded?`<div class="stat-chip">${icon('token','var(--accent)',16)}<div><div class="num mono">+1</div><div class="cap">Token</div></div></div>`:`<div class="stat-chip"><div><div class="cap" style="text-transform:none">${noTokenReason}</div></div></div>`;
  return `<div class="modal-card center" onclick="stopProp(event)">
    <div class="hero-mascot" style="width:64px;height:64px;margin:0 auto 6px">${svgMascot(mascot,av.c,bigWin?'excited':'happy')}</div>
    <div class="section-title">Session Complete!</div>
    <div class="section-sub">${session.correctCount} / ${session.total} correct</div>
    ${summitLine}
    <div class="row" style="justify-content:center;margin:14px 0">
      <div class="stat-chip">${icon('star','var(--accent)',16)}<div><div class="num mono">+${session.xpEarned}</div><div class="cap">XP</div></div></div>
      ${tokenChip}
    </div>
    ${badgeHtml}
    <button class="btn btn-primary btn-block" onclick="closeModal();render();">Back to Trail</button>
  </div>`;
}

function answerComp(value){
  if(comp.answered)return;

  applyAnswer(state,correct);
  const compLearner=APP.learners[comp.learnerId];
  ensureTodayLog(compLearner);
  compLearner.todayLog.answeredCount++;
  if(correct) compLearner.todayLog.correctCount++;
  if(correct){ comp.correctCount++; comp.xpEarned+=15; } // tokens: see markTodayLog, no longer per-question here
  saveSkill(comp.learnerId,comp.skillId);
  openModal(renderComprehensionModal());
}
function advanceComp(){
  comp.qIndex++;
  if(comp.qIndex>=comp.passage.questions.length){ finishComprehension(); return; }
  comp.answered=false; comp.selected=null;

function finishComprehension(){
  const state=APP.skillStates[comp.learnerId][comp.skillId];
  const meta=LEARNERS_META[comp.learnerId];
  const idx=state.passageIndex%meta.passages.length;
  state.passagesCompleted[idx]=true;
  state.passageIndex=(state.passageIndex+1)%meta.passages.length;
  saveSkill(comp.learnerId,comp.skillId);
  const compTotal=comp.passage.questions.length;
  const compWrong=compTotal-comp.correctCount;
  const{leveledUp,newBadges,tokenAwarded,alreadyEarnedToday}=finalizeCommon(comp.learnerId,'readingDone',comp.xpEarned,compWrong,comp.skillId);
  session={correctCount:comp.correctCount,total:compTotal,xpEarned:comp.xpEarned};

/* ================= CAMP LOG (guide / parent dashboard) ================= */
/* Daily Progress: today's route-completion + accuracy, plus recent history
   (request: "家長帳戶的sessio追縱要改成可以追蹤每天達成率跟答對率" -- per-day
   route-completion rate and accuracy rate). */
function dailyStatsRows(learner){
  const t=learner.todayLog;
  const todayRow=t?{date:t.date,routeDone:[t.mathDone,t.readingDone,t.workshopDone,t.journalDone].filter(Boolean).length,answeredCount:t.answeredCount||0,correctCount:t.correctCount||0,isToday:true}:null;
  const past=(learner.history||[]).slice().reverse(); // most recent first
  return (todayRow?[todayRow]:[]).concat(past).slice(0,14);
}
function renderDailyProgress(learner){
  const rows=dailyStatsRows(learner);
  if(!rows.length) return `<div class="section-sub">No sessions logged yet.</div>`;
  const rowsHtml=rows.map(r=>{
    const acc=r.answeredCount>0?Math.round(r.correctCount/r.answeredCount*100):null;
    return `<div class="card" style="padding:10px 16px;display:flex;align-items:center;gap:14px">
      <div style="flex:1"><b class="mono">${esc(r.date)}</b>${r.isToday?' <span class="tag">Today</span>':''}</div>
      <div style="width:110px">Route ${r.routeDone}/4</div>
      <div style="width:140px">${acc===null?'No questions yet':`Accuracy ${acc}%`}</div>
    </div>`;
  }).join('');
  return `<div style="display:flex;flex-direction:column;gap:6px">${rowsHtml}</div>`;
}
/* Token Sources: where a child's tokens came from (request: "家長帳戶能統計小孩
   token從哪個session獲得的分布"). */
function renderTokenSources(learnerId){
  const learner=APP.learners[learnerId];
  const hist=learner.tokenHistory||[];
  if(!hist.length) return `<div class="section-sub">No tokens earned yet.</div>`;
  const labels=skillLabelMap(learnerId);
  const counts={};
  hist.forEach(h=>{ counts[h.source]=(counts[h.source]||0)+1; });
  const labelFor=(src)=>src==='workshop'?'Trail Time Check-in':(src==='journal'?'Closing Circle Reflection':(labels[src]?labels[src].label:src));
  const max=Math.max(...Object.values(counts));
  const av=accentVars(LEARNERS_META[learnerId].color);
  const rows=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).map(src=>{
    const pct=max>0?Math.round(counts[src]/max*100):0;
    return `<div class="card" style="padding:10px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;font-size:.85rem">${esc(labelFor(src))}</div>
      <div style="width:110px" class="ascent"><div class="ascent-track"><div class="ascent-fill" style="width:${pct}%;background:${av.c}"></div></div></div>
      <div class="mono" style="width:30px;text-align:right">${counts[src]}</div>
    </div>`;
  }).join('');
  return `<div style="display:flex;flex-direction:column;gap:6px">${rows}</div>`;
}
function renderCampLog(){
  const ids=visibleLearnerIds();
  if(ids.length===0){
    return `<div class="section-title">Camp Log</div><div class="section-sub">No students are linked to your account yet. Ask an admin to link a student to see their Camp Log.</div>`;
  }
  if(!ids.includes(APP.currentLearnerId)) APP.currentLearnerId=ids[0];
  const id=APP.currentLearnerId; const meta=LEARNERS_META[id]; const learner=APP.learners[id]; const av=accentVars(meta.color);
  const switcherHtml=ids.length>1?`<div class="row" style="margin-bottom:18px">${ids.map(sid=>{
    const m=LEARNERS_META[sid]; const l=APP.learners[sid]; const a2=accentVars(m.color); const active=sid===id;
    return `<button class="learner-btn" data-active="${active}" style="--accent-color:${a2.c};--accent-color-strong:${a2.cs};--accent-color-soft:${a2.soft}" onclick="setLearner('${sid}')">
      <span class="dot">${svgMascot(m.mascot,a2.c,l.streakDays>=3?'excited':'happy')}</span>
      <span class="lbl"><b>${esc(l.name)}</b><span>${esc(m.ageLabel)}</span></span>
    </button>`;
  }).join('')}</div>`:'';
  const overviewRows=ids.map(sid=>{
    const m=LEARNERS_META[sid]; const l=APP.learners[sid]; const a2=accentVars(m.color);
    return `<div class="card" style="padding:14px;display:flex;align-items:center;gap:14px">
      <span class="dot" style="width:34px;height:34px;border-radius:50%;background:${a2.c};display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700">${l.name.charAt(0)}</span>
      <div style="flex:1"><b>${esc(l.name)}</b> · Lvl ${l.level} · ${l.tokens} tokens · ${l.streakDays}-day streak</div>
    </div>`;
  }).join('');
  const elevRows=meta.skills.map(s=>{
    const state=APP.skillStates[id][s.id]; const asc=ascentBar(state);
    const flag=(!state.mastered && state.totalAnswered>=6 && asc.pct<60)?`<span class="pill pill-warn">Needs attention</span>`:'';
    return `<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1"><b style="font-size:.88rem">${s.label}</b><div class="skill-meta">Elevation ${state.difficulty}/5 · ${state.totalCorrect}/${state.totalAnswered} correct all-time</div></div>
      <div style="width:110px" class="ascent"><div class="ascent-track"><div class="ascent-fill" style="width:${asc.pct}%;background:${av.c}"></div></div></div>
      ${state.mastered?'<span class="pill pill-good">Mastered</span>':''} ${flag}
    </div>`;
  }).join('');
  const badgeGallery=BADGE_DEFS.map(b=>{
    const earned=learner.badges.includes(b.id);
    return `<div class="badge-tile ${earned?'':'locked'}" title="${esc(b.desc)}"><div class="badge-shape" style="background:${earned?av.soft:'var(--surface-2)'}">${icon(b.icon,earned?av.c:'var(--ink-faint)',28)}</div>${b.label}</div>`;
  }).join('');
  const rewardsList=(APP.rewards.items||[]).map(r=>`<div class="card reward-row">
      <span class="rlbl">${esc(r.label)}${r.active?'':' <span class="tag">inactive</span>'}</span>
      <span class="reward-cost mono">${r.cost} ⛁</span>
      <button class="btn btn-secondary" onclick="toggleReward('${r.id}')">${r.active?'Disable':'Enable'}</button>
      <button class="btn btn-secondary" onclick="deleteReward('${r.id}')">Delete</button>
    </div>`).join('');
  const redemptions=(learner.redemptions||[]).slice(0,8).map(r=>`<div class="journal-entry"><div class="journal-date mono">${r.date}</div>${esc(r.label)} · ${r.cost} tokens</div>`).join('')||'<div class="section-sub">No redemptions yet.</div>';
  const syncLabel=Store.db?(APP.lastCloudSyncAt?('Last synced '+new Date(APP.lastCloudSyncAt).toLocaleTimeString()):'Syncing…'):'Local mode (no cloud sync)';
  return `
  <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
    <span>Camp Log</span>
    <span style="display:flex;align-items:center;gap:8px;font-size:.7rem;font-weight:400">
      <span class="section-sub" style="margin:0">${esc(syncLabel)}</span>
      <button class="btn btn-secondary" onclick="refreshCampLogNow()">🔄 Refresh</button>
    </span>
  </div>
  <div class="section-sub">The Guide's view — mastery map, badges, and the reward store for ${esc(learner.name)}. Auto-refreshes every 15s while you're here, so a just-finished session shows up without reloading.</div>
  ${switcherHtml}
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:22px">${overviewRows}</div>

  <div class="section-title" style="font-size:1.1rem">Daily Progress</div>
  <div class="section-sub">Route completion (out of Today's 4 stops) and answer accuracy, by day.</div>
  <div style="margin-bottom:22px">${renderDailyProgress(learner)}</div>

  <div class="section-title" style="font-size:1.1rem">Elevation Map</div>
  <div class="grid" style="grid-template-columns:1fr;margin-bottom:22px">${elevRows}</div>

  <div class="section-title" style="font-size:1.1rem">Trail Badges</div>
  <div class="badge-row" style="margin-bottom:22px">${badgeGallery}</div>

  <div class="section-title" style="font-size:1.1rem">Token Sources</div>
  <div class="section-sub">Where ${esc(learner.name)}'s Trail Tokens have come from.</div>
  <div style="margin-bottom:22px">${renderTokenSources(id)}</div>

  <div class="section-title" style="font-size:1.1rem">Reward Store</div>
  <div class="grid" style="grid-template-columns:1fr;margin-bottom:10px">${rewardsList}</div>
  <div class="card" style="padding:16px;margin-bottom:22px">
    <label class="flabel">Add a reward</label>
    <div class="row">
      <div class="field" style="flex:2"><input type="text" id="newRewardLabel" placeholder="Reward name"></div>
      <div class="field" style="flex:1"><input type="text" id="newRewardCost" placeholder="Cost (tokens)"></div>
    </div>
    <button class="btn btn-primary" onclick="addReward()">Add Reward</button>
  </div>
  <div class="section-title" style="font-size:1.1rem">Redemption History</div>
  <div style="margin-bottom:22px">${redemptions}</div>

  <div class="section-title" style="font-size:1.1rem">Explorer Name</div>
  <div class="card" style="padding:16px;margin-bottom:22px">
    <label class="flabel">Display name for this explorer badge</label>
    <div class="row">
      <div class="field" style="flex:1"><input type="text" id="learnerNameInput" value="${esc(learner.name)}"></div>
      <button class="btn btn-primary" onclick="saveLearnerName()">Save Name</button>
    </div>
  </div>

  <div class="section-title" style="font-size:1.1rem">Guide Notes</div>
  <div class="card" style="padding:16px">
    <textarea id="guideNotesInput" rows="3" placeholder="Quick observations for ${esc(learner.name)}...">${esc(learner.guideNotes||'')}</textarea>
    <div style="height:10px"></div>
    <button class="btn btn-secondary" onclick="saveGuideNotes()">Save Notes</button>
  </div>
  `;
}
function toggleReward(rid){ const r=(APP.rewards.items||[]).find(x=>x.id===rid); if(r){r.active=!r.active; saveRewards(); render();} }
function deleteReward(rid){ APP.rewards.items=(APP.rewards.items||[]).filter(x=>x.id!==rid); saveRewards(); render(); }
function addReward(){
  const label=document.getElementById('newRewardLabel').value.trim();
  const cost=parseInt(document.getElementById('newRewardCost').value,10);
  if(!label||isNaN(cost)||cost<=0)return;
  APP.rewards.items=APP.rewards.items||[];
  APP.rewards.items.push({id:'r'+Date.now(),label,cost,active:true});
  saveRewards(); render();
}
function saveGuideNotes(){ APP.learners[APP.currentLearnerId].guideNotes=document.getElementById('guideNotesInput').value; saveLearner(APP.currentLearnerId); toast('Notes saved.'); }
function saveLearnerName(){
  const val=document.getElementById('learnerNameInput').value.trim();
  if(!val)return;
  APP.learners[APP.currentLearnerId].name=val;
  saveLearner(APP.currentLearnerId); toast('Name updated!'); render();
}

/* ================= AUTH SCREENS ================= */
function renderAuthScreen(){
  const s=APP.auth.screen||'login';
  const err=APP.auth.error?`<div class="feedback-box feedback-bad" style="margin-bottom:14px">${esc(APP.auth.error)}</div>`:'';
  const notice=APP.auth.notice?`<div class="feedback-box feedback-good" style="margin-bottom:14px">${esc(APP.auth.notice)}</div>`:'';
  if(s==='register')return renderRegisterScreen(err,notice);
  return `
  <div class="center" style="max-width:380px;margin:40px auto">
    <div style="margin-bottom:14px">${icon('mountain','var(--accent)',54)}</div>
    <div class="section-title">Two Peaks — Family Login</div>
    <div class="section-sub">A private login for your household. This is a lightweight family gate, not secure authentication — it just keeps everyone's own trail separate.</div>
    ${err}${notice}
    <div class="card" style="padding:22px;text-align:left">
      <div class="field"><label class="flabel">Username</label><input type="text" id="loginUsername" placeholder="e.g. osmand"></div>
      <div class="field"><label class="flabel">Password</label><input type="text" id="loginPassword" placeholder="••••"></div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">Log In</button>
    </div>
    <div style="margin-top:14px;font-size:.85rem">New here? <a href="javascript:void(0)" onclick="APP.auth.screen='register';APP.auth.error='';APP.auth.notice='';render();">Create an account</a></div>
  </div>`;
}
function setRegRole(v){ APP.auth.regRole=v; const box=document.getElementById('regRoleFields'); if(box)box.innerHTML=renderRegisterRoleFields(); }
function renderRegisterRoleFields(){
  const role=APP.auth.regRole||'student';
  if(role==='student'){
    const parents=Object.values(APP.auth.users).filter(u=>u.role==='parent'&&u.approved);
    return `<div class="field"><label class="flabel">Grade</label><input type="text" id="regGrade" placeholder="e.g. 3"></div>
      <div class="field"><label class="flabel">Link to parent account(s) <span style="color:var(--ink-faint)">(optional — admin can adjust)</span></label>
      ${parents.map(p=>`<label style="display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-size:.85rem"><input type="checkbox" class="reg-link" value="${esc(p.username)}"> ${esc(p.username)}</label>`).join('')||'<div class="section-sub">No parent accounts yet.</div>'}</div>`;
  }
  const students=Object.values(APP.auth.users).filter(u=>u.role==='student'&&u.approved);
  return `<div class="field"><label class="flabel">Link to student account(s) <span style="color:var(--ink-faint)">(optional — admin can adjust)</span></label>
    ${students.map(s=>`<label style="display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-size:.85rem"><input type="checkbox" class="reg-link" value="${esc(s.username)}"> ${esc(s.username)}</label>`).join('')||'<div class="section-sub">No student accounts yet.</div>'}</div>`;
}
function renderRegisterScreen(err,notice){
  return `
  <div class="center" style="max-width:420px;margin:30px auto">
    <div class="section-title">Create an Account</div>
    <div class="section-sub">New accounts need admin approval before they can log in.</div>
    ${err}${notice}
    <div class="card" style="padding:22px;text-align:left">
      <div class="field"><label class="flabel">Username</label><input type="text" id="regUsername" placeholder="letters, numbers, underscore"></div>
      <div class="field"><label class="flabel">Password</label><input type="text" id="regPassword"></div>
      <div class="field"><label class="flabel">Confirm Password</label><input type="text" id="regPassword2"></div>
      <div class="field"><label class="flabel">Account Type</label>
        <select id="regRole" onchange="setRegRole(this.value)" style="width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink)">
          <option value="student" ${APP.auth.regRole!=='parent'?'selected':''}>Student</option>
          <option value="parent" ${APP.auth.regRole==='parent'?'selected':''}>Parent</option>
        </select>
      </div>
      <div id="regRoleFields">${renderRegisterRoleFields()}</div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">Submit for Approval</button>
    </div>
    <div style="margin-top:14px;font-size:.85rem">Already have an account? <a href="javascript:void(0)" onclick="APP.auth.screen='login';APP.auth.error='';APP.auth.notice='';render();">Log in</a></div>
  </div>`;
}
function doLogin(){
  const uEl=document.getElementById('loginUsername'), pEl=document.getElementById('loginPassword');
  loginWithCredentials((uEl&&uEl.value)||'', (pEl&&pEl.value)||'');
}
function loginWithCredentials(uname,pw){
  uname=(uname||'').trim().toLowerCase();
  APP.auth.notice='';
  const u=APP.auth.users[uname];
  if(!u){ APP.auth.error='No account found with that username.'; render(); return; }
  if(u.password!==pw){ APP.auth.error='Incorrect password.'; render(); return; }
  if(!u.approved){ APP.auth.error='This account is still waiting for admin approval.'; render(); return; }
  loginSuccess(uname);
}
function loginSuccess(username){
  const u=APP.auth.users[username];
  APP.auth.currentUser=u; APP.auth.error=''; APP.auth.notice='';
  Store.lsSet(SESSION_STORE_KEY,{username}); // session is per-device on purpose: not synced to the shared cloud store
  if(u.role==='student'){ ensureLearnerRuntimeState(u); APP.currentLearnerId=u.learnerId; APP.activeTab='today'; }
  else{ APP.currentLearnerId=visibleLearnerIds()[0]||null; APP.activeTab='camp'; }
  render();
}
function logout(){
  APP.auth.currentUser=null; APP.auth.screen='login'; APP.auth.error=''; APP.auth.notice='';
  Store.lsSet(SESSION_STORE_KEY,null);
  render();
}
function doRegister(){
  const uEl=document.getElementById('regUsername'), pEl=document.getElementById('regPassword'), p2El=document.getElementById('regPassword2');
  const links=[...document.querySelectorAll('.reg-link:checked')].map(b=>b.value);
  const gEl=document.getElementById('regGrade');
  registerAccount({
    username:(uEl&&uEl.value)||'', password:(pEl&&pEl.value)||'', password2:(p2El&&p2El.value)||'',
    role:APP.auth.regRole||'student', grade:gEl&&gEl.value, links
  });
}
function registerAccount(opts){
  const username=opts.username,password=opts.password,password2=opts.password2,role=opts.role||'student',grade=opts.grade,links=opts.links||[];
  const uname=(username||'').trim().toLowerCase();
  APP.auth.error='';
  if(!uname||!/^[a-z0-9_]{3,20}$/.test(uname)){ APP.auth.error='Choose a username of 3-20 letters, numbers or underscores.'; render(); return false; }
  if(APP.auth.users[uname]){ APP.auth.error='That username is already taken.'; render(); return false; }
  if(!password||password.length<4){ APP.auth.error='Password must be at least 4 characters.'; render(); return false; }
  if(password!==password2){ APP.auth.error='Passwords do not match.'; render(); return false; }
  const rec={username:uname,password,role,approved:false,isAdmin:false,createdAt:Date.now()};
  if(role==='student'){
    const g=parseInt(grade,10);
    rec.grade=isNaN(g)?2:Math.max(1,Math.min(8,g));
    rec.learnerId=uname;
    rec.linkedParents=links;
  } else {
    rec.linkedStudents=links;
  }
  APP.auth.users[uname]=rec;
  Store.save(AUTH_STORE_KEY,APP.auth.users);
  APP.auth.screen='login';
  APP.auth.notice='Account created! It now needs admin approval before you can log in.';
  render();
  return true;
}
/* ================= ADMIN ================= */
function renderAdmin(){
  const users=APP.auth.users;
  const pending=Object.values(users).filter(u=>!u.approved);
  const approved=Object.values(users).filter(u=>u.approved);
  const pendingRows=pending.map(u=>{
    const parentOpts=Object.values(users).filter(x=>x.role==='parent'&&x.approved);
    const studentOpts=Object.values(users).filter(x=>x.role==='student'&&x.approved);
    const linkBoxes=u.role==='student'
      ? parentOpts.map(p=>`<label style="display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-size:.8rem"><input type="checkbox" class="approve-link" data-user="${esc(u.username)}" value="${esc(p.username)}" ${(u.linkedParents||[]).includes(p.username)?'checked':''}> ${esc(p.username)}</label>`).join('')
      : studentOpts.map(s=>`<label style="display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-size:.8rem"><input type="checkbox" class="approve-link" data-user="${esc(u.username)}" value="${esc(s.username)}" ${(u.linkedStudents||[]).includes(s.username)?'checked':''}> ${esc(s.username)}</label>`).join('');
    return `<div class="card" style="padding:14px 16px;margin-bottom:10px">
      <div style="margin-bottom:6px"><b>${esc(u.username)}</b> <span class="tag">${u.role==='student'?'Student':'Parent'}</span>${u.role==='student'?` · Grade ${u.grade||'?'}`:''}</div>
      <div style="margin-bottom:8px;font-size:.8rem;color:var(--ink-soft)">${u.role==='student'?'Link to parent(s):':'Link to student(s):'}</div>
      <div style="margin-bottom:10px">${linkBoxes||'<span class="section-sub">No approved accounts yet to link to.</span>'}</div>
      <div class="row">
        <button class="btn btn-primary" onclick="approveUser('${esc(u.username)}')">Approve</button>
        <button class="btn btn-secondary" onclick="rejectUser('${esc(u.username)}')">Reject</button>
      </div>
    </div>`;
  }).join('')||'<div class="section-sub">No pending registrations.</div>';
  const rosterRows=approved.map(u=>{
    const links=u.role==='student'?(u.linkedParents||[]).join(', ')||'—':(u.linkedStudents||[]).join(', ')||'—';
    return `<div class="card" style="padding:10px 14px;margin-bottom:8px;font-size:.85rem"><b>${esc(u.username)}</b> · ${u.role==='student'?'Student · Grade '+(u.grade||'?'):'Parent'}${u.isAdmin?' · Admin':''} · Linked: ${esc(links)}</div>`;
  }).join('');
  return `<div class="section-title">Admin</div>
    <div class="section-sub">Approve new registrations and review the family roster. This is a lightweight household gate, not secure authentication.</div>
    <div class="section-title" style="font-size:1.1rem">Pending Approval</div>
    <div style="margin-bottom:22px">${pendingRows}</div>
    <div class="section-title" style="font-size:1.1rem">All Accounts</div>
    <div>${rosterRows}</div>`;
}
function approveUser(username){
  const boxes=[...document.querySelectorAll(`.approve-link[data-user="${username}"]`)];
  const checked=boxes.filter(b=>b.checked).map(b=>b.value);
  approveUserWithLinks(username,checked);
}
function approveUserWithLinks(username,checked){
  const u=APP.auth.users[username]; if(!u)return;
  checked=checked||[];
  if(u.role==='student'){
    u.linkedParents=checked;
    checked.forEach(p=>{ const pu=APP.auth.users[p]; if(pu){ pu.linkedStudents=pu.linkedStudents||[]; if(!pu.linkedStudents.includes(username))pu.linkedStudents.push(username); } });
  } else {
    u.linkedStudents=checked;
    checked.forEach(s=>{ const su=APP.auth.users[s]; if(su){ su.linkedParents=su.linkedParents||[]; if(!su.linkedParents.includes(username))su.linkedParents.push(username); } });
  }
  u.approved=true;
  if(u.role==='student')ensureLearnerRuntimeState(u);
  Store.save(AUTH_STORE_KEY,APP.auth.users);
  toast('Account approved.');
  render();
}
function rejectUser(username){
  delete APP.auth.users[username];
  Store.save(AUTH_STORE_KEY,APP.auth.users);
  toast('Registration removed.');
  render();
}

/* ================= BOOT ================= */
async function boot(){
  await Store.init();
  APP.auth.users=Store.lsGet(AUTH_STORE_KEY);
  if(!APP.auth.users){ APP.auth.users=seedDefaultUsers(); Store.lsSet(AUTH_STORE_KEY,APP.auth.users); }
  if(Store.db){
    // The family's account directory is shared cloud state (same for every signed-in
    // viewer), unlike the session above which stays local to this device/browser.
    const remoteUsers=await Store.dbGet(AUTH_STORE_KEY);
    if(remoteUsers&&Object.keys(remoteUsers).length){ APP.auth.users=remoteUsers; Store.lsSet(AUTH_STORE_KEY,remoteUsers); }
    else{ Store.dbSet(AUTH_STORE_KEY,APP.auth.users); }
  }
  Object.values(APP.auth.users).forEach(u=>{ if(u.role==='student'&&u.approved)ensureDynamicLearnerMeta(u); });
  await loadAllData();
  const sess=Store.lsGet(SESSION_STORE_KEY);
  if(sess&&sess.username){
    const u=APP.auth.users[sess.username];
    if(u&&u.approved)loginSuccess(sess.username);
  }
}
boot();
</script>
