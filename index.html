      <button class="btn btn-primary btn-block" onclick="doRegister()">Submit for Approval</button>
    </div>
    <div style="margin-top:14px;font-size:.85rem">Already have an account? <a href="javascript:void(0)" onclick="APP.auth.screen='login';APP.auth.error='';APP.auth.notice='';render();">Log in</a></div>
  </div>`;
}
function doLogin(){
  const uEl=document.getElementById('loginUsername'), pEl=document.getElementById('loginPassword');
  loginWithCredentials((uEl&&uEl.value)||'', (pEl&&pEl.value)||'');
}
function loginWithCredentials(uname,pw){
  uname=(uname||'').trim().toLowerCase();
  APP.auth.notice='';
  const u=APP.auth.users[uname];
  if(!u){ APP.auth.error='No account found with that username.'; render(); return; }
  if(u.password!==pw){ APP.auth.error='Incorrect password.'; render(); return; }
  if(!u.approved){ APP.auth.error='This account is still waiting for admin approval.'; render(); return; }
  loginSuccess(uname);
}
function loginSuccess(username){
  const u=APP.auth.users[username];
  APP.auth.currentUser=u; APP.auth.error=''; APP.auth.notice='';
  Store.lsSet(SESSION_STORE_KEY,{username}); // session is per-device on purpose: not synced to the shared cloud store
  if(u.role==='student'){ ensureLearnerRuntimeState(u); APP.currentLearnerId=u.learnerId; APP.activeTab='today'; }
  else{ APP.currentLearnerId=visibleLearnerIds()[0]||null; APP.activeTab='camp'; }
  render();
}
function logout(){
  APP.auth.currentUser=null; APP.auth.screen='login'; APP.auth.error=''; APP.auth.notice='';
  Store.lsSet(SESSION_STORE_KEY,null);
  render();
}
function doRegister(){
  const uEl=document.getElementById('regUsername'), pEl=document.getElementById('regPassword'), p2El=document.getElementById('regPassword2');
  const links=[...document.querySelectorAll('.reg-link:checked')].map(b=>b.value);
  const gEl=document.getElementById('regGrade');
  registerAccount({
    username:(uEl&&uEl.value)||'', password:(pEl&&pEl.value)||'', password2:(p2El&&p2El.value)||'',
    role:APP.auth.regRole||'student', grade:gEl&&gEl.value, links
  });
}
function registerAccount(opts){
  const username=opts.username,password=opts.password,password2=opts.password2,role=opts.role||'student',grade=opts.grade,links=opts.links||[];
  const uname=(username||'').trim().toLowerCase();
  APP.auth.error='';
  if(!uname||!/^[a-z0-9_]{3,20}$/.test(uname)){ APP.auth.error='Choose a username of 3-20 letters, numbers or underscores.'; render(); return false; }
  if(APP.auth.users[uname]){ APP.auth.error='That username is already taken.'; render(); return false; }
  if(!password||password.length<4){ APP.auth.error='Password must be at least 4 characters.'; render(); return false; }
  if(password!==password2){ APP.auth.error='Passwords do not match.'; render(); return false; }
  const rec={username:uname,password,role,approved:false,isAdmin:false,createdAt:Date.now()};
  if(role==='student'){
    const g=parseInt(grade,10);
    rec.grade=isNaN(g)?2:Math.max(1,Math.min(8,g));
    rec.learnerId=uname;
    rec.linkedParents=links;
  } else {
    rec.linkedStudents=links;
  }
  APP.auth.users[uname]=rec;
  Store.save(AUTH_STORE_KEY,APP.auth.users);
  APP.auth.screen='login';
  APP.auth.notice='Account created! It now needs admin approval before you can log in.';
  render();
  return true;
}
/* ================= ADMIN ================= */
function renderAdmin(){
  const users=APP.auth.users;
  const pending=Object.values(users).filter(u=>!u.approved);
  const approved=Object.values(users).filter(u=>u.approved);
  const pendingRows=pending.map(u=>{
    const parentOpts=Object.values(users).filter(x=>x.role==='parent'&&x.approved);
    const studentOpts=Object.values(users).filter(x=>x.role==='student'&&x.approved);
    const linkBoxes=u.role==='student'
      ? parentOpts.map(p=>`<label style="display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-size:.8rem"><input type="checkbox" class="approve-link" data-user="${esc(u.username)}" value="${esc(p.username)}" ${(u.linkedParents||[]).includes(p.username)?'checked':''}> ${esc(p.username)}</label>`).join('')
      : studentOpts.map(s=>`<label style="display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-size:.8rem"><input type="checkbox" class="approve-link" data-user="${esc(u.username)}" value="${esc(s.username)}" ${(u.linkedStudents||[]).includes(s.username)?'checked':''}> ${esc(s.username)}</label>`).join('');
    return `<div class="card" style="padding:14px 16px;margin-bottom:10px">
      <div style="margin-bottom:6px"><b>${esc(u.username)}</b> <span class="tag">${u.role==='student'?'Student':'Parent'}</span>${u.role==='student'?` · Grade ${u.grade||'?'}`:''}</div>
      <div style="margin-bottom:8px;font-size:.8rem;color:var(--ink-soft)">${u.role==='student'?'Link to parent(s):':'Link to student(s):'}</div>
      <div style="margin-bottom:10px">${linkBoxes||'<span class="section-sub">No approved accounts yet to link to.</span>'}</div>
      <div class="row">
        <button class="btn btn-primary" onclick="approveUser('${esc(u.username)}')">Approve</button>
        <button class="btn btn-secondary" onclick="rejectUser('${esc(u.username)}')">Reject</button>
      </div>
    </div>`;
  }).join('')||'<div class="section-sub">No pending registrations.</div>';
  const rosterRows=approved.map(u=>{
    const links=u.role==='student'?(u.linkedParents||[]).join(', ')||'—':(u.linkedStudents||[]).join(', ')||'—';
    return `<div class="card" style="padding:10px 14px;margin-bottom:8px;font-size:.85rem"><b>${esc(u.username)}</b> · ${u.role==='student'?'Student · Grade '+(u.grade||'?'):'Parent'}${u.isAdmin?' · Admin':''} · Linked: ${esc(links)}</div>`;
  }).join('');
  return `<div class="section-title">Admin</div>
    <div class="section-sub">Approve new registrations and review the family roster. This is a lightweight household gate, not secure authentication.</div>
    <div class="section-title" style="font-size:1.1rem">Pending Approval</div>
    <div style="margin-bottom:22px">${pendingRows}</div>
    <div class="section-title" style="font-size:1.1rem">All Accounts</div>
    <div>${rosterRows}</div>`;
}
function approveUser(username){
  const boxes=[...document.querySelectorAll(`.approve-link[data-user="${username}"]`)];
  const checked=boxes.filter(b=>b.checked).map(b=>b.value);
  approveUserWithLinks(username,checked);
}
function approveUserWithLinks(username,checked){
  const u=APP.auth.users[username]; if(!u)return;
  checked=checked||[];
  if(u.role==='student'){
    u.linkedParents=checked;
    checked.forEach(p=>{ const pu=APP.auth.users[p]; if(pu){ pu.linkedStudents=pu.linkedStudents||[]; if(!pu.linkedStudents.includes(username))pu.linkedStudents.push(username); } });
  } else {
    u.linkedStudents=checked;
    checked.forEach(s=>{ const su=APP.auth.users[s]; if(su){ su.linkedParents=su.linkedParents||[]; if(!su.linkedParents.includes(username))su.linkedParents.push(username); } });
  }
  u.approved=true;
  if(u.role==='student')ensureLearnerRuntimeState(u);
  Store.save(AUTH_STORE_KEY,APP.auth.users);
  toast('Account approved.');
  render();
}
function rejectUser(username){
  delete APP.auth.users[username];
  Store.save(AUTH_STORE_KEY,APP.auth.users);
  toast('Registration removed.');
  render();
}

/* ================= BOOT ================= */
async function boot(){
  await Store.init();
  APP.auth.users=Store.lsGet(AUTH_STORE_KEY);
  if(!APP.auth.users){ APP.auth.users=seedDefaultUsers(); Store.lsSet(AUTH_STORE_KEY,APP.auth.users); }
  if(Store.db){
    // The family's account directory is shared cloud state (same for every signed-in
    // viewer), unlike the session above which stays local to this device/browser.
    const remoteUsers=await Store.dbGet(AUTH_STORE_KEY);
    if(remoteUsers&&Object.keys(remoteUsers).length){ APP.auth.users=remoteUsers; Store.lsSet(AUTH_STORE_KEY,remoteUsers); }
    else{ Store.dbSet(AUTH_STORE_KEY,APP.auth.users); }
  }
  Object.values(APP.auth.users).forEach(u=>{ if(u.role==='student'&&u.approved)ensureDynamicLearnerMeta(u); });
  await loadAllData();
  const sess=Store.lsGet(SESSION_STORE_KEY);
  if(sess&&sess.username){
    const u=APP.auth.users[sess.username];
    if(u&&u.approved)loginSuccess(sess.username);
  }
}
boot();
</script>
</body>
</html>
