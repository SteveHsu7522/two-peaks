<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Peaks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#FBF7EF; --surface:#FFFFFF; --surface-2:#F3ECDC; --surface-3:#EAE1CC;
  --ink:#232A3D; --ink-soft:#5B6178; --ink-faint:#8C90A3; --border:#E1D6BE;
  --accent:#E8912E; --accent-strong:#C97417; --accent-soft:#FBEBD3;
  --teal:#1F8A82; --teal-strong:#146760; --teal-soft:#DCF0EC;
  --plum:#8B5FBF; --plum-strong:#6F3FA0; --plum-soft:#EFE4F7;
  --sky:#2F86C9; --sky-strong:#1F63A0; --sky-soft:#DDEEFA;
  --good:#3D8F5B; --good-soft:#E1F3E6; --warn:#C9791A; --warn-soft:#FBE9D2;
  --bad:#C6435A; --bad-soft:#FAE1E5;
  --shadow-sm:0 1px 2px rgba(35,30,15,.08); --shadow-md:0 6px 20px rgba(35,30,15,.10);
  --radius-sm:10px; --radius-md:16px; --radius-lg:24px;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Libre Franklin',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141826; --surface:#1D2338; --surface-2:#242B45; --surface-3:#323A58;
  --ink:#EDEFF7; --ink-soft:#B7BCD3; --ink-faint:#7D839C; --border:#333D5C;
  --accent:#F0A63E; --accent-strong:#FFC670; --accent-soft:#3A2C14;
  --teal:#3FC2B7; --teal-strong:#7EDDD4; --teal-soft:#123230;
  --good:#5FC486; --good-soft:#173322; --warn:#E2A24C; --warn-soft:#3A2A10;
  --bad:#F2748A; --bad-soft:#3A1B22;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#141826; --surface:#1D2338; --surface-2:#242B45; --surface-3:#323A58;
  --ink:#EDEFF7; --ink-soft:#B7BCD3; --ink-faint:#7D839C; --border:#333D5C;
  --accent:#F0A63E; --accent-strong:#FFC670; --accent-soft:#3A2C14;
  --teal:#3FC2B7; --teal-strong:#7EDDD4; --teal-soft:#123230;
  --good:#5FC486; --good-soft:#173322; --warn:#E2A24C; --warn-soft:#3A2A10;
  --bad:#F2748A; --bad-soft:#3A1B22;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);}
h1,h2,h3,.display{font-family:var(--font-display);text-wrap:balance;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
#app{max-width:1080px;margin:0 auto;padding:0 16px 48px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 4px 10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;flex:none;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:.2px;}
.brand-sub{font-size:.72rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:-2px;}
.learner-switch{display:flex;gap:8px;}
.learner-btn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);transition:border-color .15s,background .15s;}
.learner-btn .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:.85rem;overflow:hidden;flex:none;}
.learner-btn .dot svg{width:100%;height:100%;}
.learner-btn[data-active="true"]{border-color:var(--accent-color,var(--accent));background:var(--accent-color-soft,var(--accent-soft));}
.learner-btn .lbl{text-align:left;line-height:1.15;}
.learner-btn .lbl b{display:block;font-size:.85rem;}
.learner-btn .lbl span{display:block;font-size:.68rem;color:var(--ink-faint);}
.stat-strip{display:flex;gap:14px;flex-wrap:wrap;padding:2px 4px 14px;}
.stat-chip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:7px 12px;box-shadow:var(--shadow-sm);}
.stat-chip .num{font-family:var(--font-mono);font-weight:600;font-size:.95rem;}
.stat-chip .cap{font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
.xpbar-wrap{flex:1;min-width:160px;display:flex;flex-direction:column;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow-sm);}
.xpbar-top{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;}
.xpbar-track{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.xpbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-color,var(--accent)),var(--accent-color-strong,var(--accent-strong)));}
.tabbar{display:flex;gap:6px;border-bottom:1.5px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab-btn{display:flex;align-items:center;gap:7px;padding:10px 14px;border:none;background:none;color:var(--ink-soft);font-weight:600;font-size:.88rem;border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab-btn[data-active="true"]{color:var(--ink);border-bottom-color:var(--accent-color,var(--accent));}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
.section-title{font-family:var(--font-display);font-weight:600;font-size:1.3rem;margin:0 0 4px;}
.section-sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 16px;}
.grid{display:grid;gap:14px;}
.grid-skills{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
.skill-card{padding:16px;display:flex;flex-direction:column;gap:10px;}
.skill-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.skill-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.skill-name{font-weight:600;font-size:.95rem;}
.elev-badge{font-size:.66rem;font-family:var(--font-mono);padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;}
.ascent{display:flex;align-items:center;gap:6px;}
.ascent-track{flex:1;height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.ascent-fill{height:100%;background:var(--teal);border-radius:999px;}
.ascent-pct{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint);}
.skill-meta{font-size:.72rem;color:var(--ink-faint);}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;padding:3px 8px;border-radius:999px;}
.pill-good{background:var(--good-soft);color:var(--good);}
.pill-warn{background:var(--warn-soft);color:var(--warn);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:none;font-weight:600;font-size:.86rem;}
.btn-primary{background:var(--accent-color,var(--accent));color:#221602;}
.btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:default;}
.route-list{display:flex;flex-direction:column;gap:10px;}
.route-item{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.route-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;}
.route-check[data-done="true"]{background:var(--good);border-color:var(--good);color:#fff;}
.route-body{flex:1;}
.route-title{font-weight:600;font-size:.92rem;}
.route-sub{font-size:.76rem;color:var(--ink-faint);}
.badge-row{display:flex;flex-wrap:wrap;gap:10px;}
.badge-tile{width:84px;text-align:center;font-size:.68rem;color:var(--ink-soft);}
.badge-shape{width:56px;height:56px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;}
.badge-tile.locked{opacity:.35;}
.reward-row{display:flex;align-items:center;justify-content:between;gap:10px;padding:12px 14px;}
.reward-row .rlbl{flex:1;font-weight:600;font-size:.88rem;}
.reward-cost{font-family:var(--font-mono);font-size:.8rem;color:var(--accent-strong);}
.modal-overlay{position:fixed;inset:0;background:rgba(15,12,4,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:26px;}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--ink-faint);margin-bottom:14px;font-family:var(--font-mono);}
.qprompt{font-family:var(--font-display);font-size:1.25rem;font-weight:600;margin:6px 0 18px;white-space:pre-line;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.choice-btn{padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-2);font-weight:600;font-size:1rem;text-align:center;}
.choice-btn[data-state="correct"]{background:var(--good-soft);border-color:var(--good);color:var(--good);}
.choice-btn[data-state="wrong"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto;}
.key-btn{padding:14px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-family:var(--font-mono);font-size:1.05rem;font-weight:600;}
.answer-display{text-align:center;font-family:var(--font-mono);font-size:1.6rem;font-weight:600;padding:10px;border:1.5px dashed var(--border);border-radius:10px;margin-bottom:12px;min-height:46px;}
.field-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;}
.field-box{width:74px;text-align:center;font-family:var(--font-mono);font-size:1.5rem;font-weight:600;padding:10px 4px;border:1.5px dashed var(--border);border-radius:10px;min-height:46px;cursor:pointer;}
.field-box[data-active="true"]{border-style:solid;border-color:var(--accent-color,var(--accent));background:var(--accent-color-soft,var(--accent-soft));}
.field-sep{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--ink-faint);}
.field-labels{display:flex;justify-content:center;gap:30px;font-size:.68rem;color:var(--ink-faint);margin:4px 0 12px;}
.session-list{display:flex;flex-direction:column;gap:4px;padding-left:10px;border-left:2px solid var(--border);}
.session-row{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--ink-soft);}
.range-toggle{display:flex;gap:6px;margin-bottom:14px;}
.range-btn{font-family:var(--font-mono);font-size:.72rem;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);cursor:pointer;}
.range-btn[data-active="true"]{background:var(--accent);color:#221602;border-color:var(--accent);}
.chart-tooltip{position:fixed;z-index:999;background:var(--ink);color:var(--surface);font-family:var(--font-mono);font-size:.72rem;padding:5px 9px;border-radius:7px;pointer-events:none;box-shadow:var(--shadow-sm);display:none;white-space:nowrap;}
.feedback-box{margin-top:16px;padding:14px;border-radius:12px;font-size:.9rem;}
.feedback-good{background:var(--good-soft);color:var(--good);}
.feedback-bad{background:var(--bad-soft);color:var(--bad);}
.center{text-align:center;}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-faint);}
textarea,input[type=text],input[type=date]{font-family:var(--font-body);border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:var(--surface);color:var(--ink);font-size:.88rem;width:100%;}
label.flabel{font-size:.76rem;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.checkin-strip{display:flex;gap:4px;flex-wrap:wrap;}
.checkin-dot{width:22px;height:22px;border-radius:6px;background:var(--surface-3);}
.checkin-dot[data-on="true"]{background:var(--good);}
.idea-card{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font-size:.85rem;}
.idea-card b{display:block;font-family:var(--font-display);font-size:.98rem;margin-bottom:3px;}
.journal-entry{padding:10px 12px;border-left:3px solid var(--teal);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:.84rem;margin-bottom:8px;}
.journal-date{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-faint);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.82rem;z-index:60;box-shadow:var(--shadow-md);}
.passage-text{font-size:.95rem;line-height:1.65;background:var(--surface-2);padding:16px;border-radius:12px;margin-bottom:16px;max-height:280px;overflow-y:auto;}
.area-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
.area-card{padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:1.5px solid var(--border);}
.area-card[data-active="true"]{border-color:var(--teal);background:var(--teal-soft);}
.step-card{padding:18px;margin-bottom:18px;}
.step-card[data-locked="true"]{opacity:.55;}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--surface-3);color:var(--ink-soft);font-family:var(--font-mono);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;flex:none;}
.step-num[data-done="true"]{background:var(--good);color:#fff;}
.step-title{font-family:var(--font-display);font-weight:600;font-size:1.08rem;flex:1;}
.step-body{font-size:.86rem;color:var(--ink-soft);line-height:1.55;margin-bottom:10px;}
.howto-box{background:var(--teal-soft);border-radius:12px;padding:11px 14px;font-size:.82rem;color:var(--ink);line-height:1.55;margin:10px 0 4px;}
.howto-box b{color:var(--teal-strong);}
.lock-hint{font-size:.82rem;color:var(--ink-faint);font-style:italic;}
.checkin-dot[data-today="true"]{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
@media (max-width:600px){.choices{grid-template-columns:1fr;}}

/* ================= MASCOT HERO / MOTIVATION ADD-ONS ================= */
.hero-card{display:flex;align-items:center;gap:18px;padding:20px 22px;background:linear-gradient(135deg,var(--accent-color-soft,var(--accent-soft)),var(--surface));border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:22px;overflow:hidden;position:relative;}
.hero-mascot{width:78px;height:78px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12));}
.hero-mascot svg{animation:bob 3.2s ease-in-out infinite;}
.hero-greet{font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin:0 0 4px;}
.hero-sub{font-size:.86rem;color:var(--ink-soft);margin:0;}
.hero-streak{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:.8rem;color:var(--accent-strong);margin-top:6px;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){.hero-mascot svg{animation:none;}}

.elev-path-wrap{margin:2px 0 4px;}
.flame-row{display:flex;align-items:center;gap:2px;}
.flame-row svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));}

.feedback-box{animation:pop-in .32s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop-in{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.feedback-box{animation:none;}}

.choice-btn{transition:transform .1s ease;}
.choice-btn[data-state="correct"]{animation:pop-in .32s cubic-bezier(.2,1.4,.4,1);}
.summit-banner{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent-soft),var(--teal-soft));margin-bottom:14px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;}
@media (prefers-reduced-motion: reduce){.choice-btn[data-state="correct"]{animation:none;}}

/* ================= CREATURE COMPANION (original creature-collector theme) ================= */
.companion-card{display:flex;align-items:center;gap:16px;padding:14px 18px;margin-bottom:22px;}
.companion-art{width:72px;height:72px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.14));}
.companion-art svg{animation:companion-bob 2.6s ease-in-out infinite;}
.companion-name{font-weight:700;font-size:.95rem;margin-bottom:2px;}
.companion-note{font-size:.78rem;color:var(--ink-soft);}
.companion-aura{transform-origin:50px 58px;animation:aura-spin 7s linear infinite;}
@keyframes companion-bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes aura-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.companion-art svg,.companion-aura{animation:none;}}
.element-chip{display:inline-flex;align-self:flex-start;font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.ascent-fill,.xpbar-fill{position:relative;overflow:hidden;}
.ascent-fill::after,.xpbar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:bar-shimmer 2.2s ease-in-out infinite;}
@keyframes bar-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media (prefers-reduced-motion: reduce){.ascent-fill::after,.xpbar-fill::after{animation:none;}}

/* ================= SITE-WIDE MOTION POLISH =================
   Request: "網站過於靜態, 請增添一些動態的動畫讓整個網站更加生動吸引人" (the site feels
   too static -- add more dynamic animation throughout). Buttons press, choices and
   cards lift on hover, modals pop in instead of snapping open, tabs glide, and a
   wrong answer gets a little shake -- on top of the celebration/companion animations
   that already existed. Every new animation is skipped under prefers-reduced-motion. */
.btn{transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;}
.btn:not(:disabled):active{transform:scale(.95);}
.btn-primary:not(:disabled):hover{box-shadow:0 3px 10px rgba(0,0,0,.14);transform:translateY(-1px);}
.tab-btn{transition:color .15s ease, border-color .2s ease;}
.choice-btn{transition:transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease;}
.choice-btn:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.1);}
.choice-btn[data-state="wrong"]{animation:choice-shake .4s ease;}
@keyframes choice-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.key-btn,.field-box{transition:transform .1s ease;}
.key-btn:active{transform:scale(.92);}
.skill-card,.companion-card,.area-card{transition:transform .18s ease, box-shadow .18s ease;}
.skill-card:hover,.companion-card:hover,.area-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.modal-overlay.modal-entering{animation:overlay-fade .18s ease;}
@keyframes overlay-fade{from{opacity:0}to{opacity:1}}
.modal-overlay.modal-entering .modal-card{animation:modal-pop .26s cubic-bezier(.2,1.3,.4,1);}
@keyframes modal-pop{0%{transform:scale(.93) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.sound-toggle{padding:8px 10px;}
.badge-tile{transition:transform .15s ease;}
.badge-row .badge-tile{animation:pop-in .35s cubic-bezier(.2,1.4,.4,1) backwards;}
.badge-row .badge-tile:nth-child(2){animation-delay:.08s;}
.badge-row .badge-tile:nth-child(3){animation-delay:.16s;}
.badge-row .badge-tile:nth-child(n+4){animation-delay:.22s;}
.summit-banner{animation:pop-in .32s cubic-bezier(.2,1.4,.4,1);}
@media (prefers-reduced-motion: reduce){
  .btn,.choice-btn,.key-btn,.field-box,.skill-card,.companion-card,.area-card{transition:none;}
  .choice-btn[data-state="wrong"],.badge-row .badge-tile,.summit-banner{animation:none;}

/* ================= DIFFICULTY SCALING (Elevation 1-10) =================

   elevations) so the *numbers* inside that tier get a bit bigger/tighter — "每升
   一級難度稍微調高一些". Odd elevations (1,3,5,7,9) reproduce the exact old
   level-1..5 ranges, so nothing gets harder OR easier for anyone already on the old
   5-rung scale; only the new in-between rungs add anything. */
const MAX_DIFFICULTY=10;
function diffTier(level){ return Math.min(5,Math.ceil(level/2)); }
function diffBoost(level){ return (level%2===0)?1:0; }

/* ================= MATH GENERATORS: GRADE 2 (Comet) ================= */
function gAdd2(level){const lvl=diffTier(level),bo=diffBoost(level);let a,b;

function gSub2(level){const lvl=diffTier(level),bo=diffBoost(level);let a,b;
  if(lvl===1){a=randInt(5,18+bo*6);b=randInt(1,a);}

function gPlaceValue2(level){const lvl=diffTier(level),bo=diffBoost(level);
  if(lvl===1){const tens=randInt(1,9),ones=randInt(0,9);const n=tens*10+ones;const askTens=Math.random()<0.5;const correct=askTens?tens:ones;

  if(lvl===2){const tens=randInt(1,9),ones=randInt(0,9);const n=tens*10+ones;const digit=Math.random()<0.5?tens:ones;const isTensDigit=digit===tens;const value=isTensDigit?tens*10:ones;

    return{prompt:`Compare: ${a} ___ ${b}`,mode:'mc',choices:['<','>','='],correctAnswer:symbol,explanation:`${a} ${symbol} ${b}.`};}
  const h=randInt(1,9),t=randInt(0,9),o=randInt(0,9);const n=h*100+t*10+o;

function gSkipMult2(level){const lvl=diffTier(level),bo=diffBoost(level);
  if(lvl===1){const step=pick([2,5,10]);const start=step*randInt(1,5+bo*3);const seq=[start,start+step,start+step*2];const next=start+step*3;

  const a=randInt(2,10+bo*2),b=randInt(2,10+bo*2);

function gMoney2(level){const lvl=diffTier(level),bo=diffBoost(level);const coinVals={penny:1,nickel:5,dime:10,quarter:25};const coinLetter={penny:'P',nickel:'N',dime:'D',quarter:'Q'};
  if(lvl===1){const coin=pick(Object.keys(coinVals));

function gTime2(level){const lvl=diffTier(level),bo=diffBoost(level);let h=randInt(1,12),m;
  if(lvl===1)m=pick([0,30]);else if(lvl===2)m=pick(bo?[0,15,30,45,10,20]:[0,15,30,45]);else m=pick([0,5,10,15,20,25,30,35,40,45,50,55]);

function gWordProblems2(level){const lvl=diffTier(level),bo=diffBoost(level);const names=['Mia','Leo','Ana','Sam','Priya','Noah'];const n1=pick(names);let n2=pick(names);while(n2===n1)n2=pick(names);
  if(lvl===1){const a=randInt(4,12+bo*4),b=randInt(2,8+bo*3);const isAdd=Math.random()<0.5;

      :{prompt:`${n1} has ${a+b} stickers and gives away ${b}. How many are left?`,mode:'numeric',correctAnswer:a,visual:{type:'takeaway',total:a+b,removed:b},explanation:`${a+b} - ${b} = ${a}.`};}

function gMult4(level){const lvl=diffTier(level),bo=diffBoost(level);let a,b;

function gDiv4(level){const lvl=diffTier(level),bo=diffBoost(level);let divisor,quotient,dividend,rem=0;

/* 3D-looking unit-cube stack for the Volume questions (same polished-gradient look as
   the other question visuals): an isometric l x w x h box of cubes, painted back-to-front. */
function svgPrism(l,w,h,color){
  const p=accentPair(color);const s=18,a=s*0.866,b=s*0.5;
  const cubes=[];for(let k=0;k<h;k++)for(let i=0;i<l;i++)for(let j=0;j<w;j++)cubes.push({i,j,k});
  cubes.sort((c1,c2)=>(c1.i+c1.j)-(c2.i+c2.j)||c1.k-c2.k);
  const pts=[];cubes.forEach(c=>{const x=(c.i-c.j)*a,y=(c.i+c.j)*b-c.k*s;pts.push([x-a,y],[x+a,y+2*b+s]);});
  const minX=Math.min(...pts.map(q=>q[0]))-4,maxX=Math.max(...pts.map(q=>q[0]))+4,minY=Math.min(...pts.map(q=>q[1]))-4,maxY=Math.max(...pts.map(q=>q[1]))+4;
  const poly=(arr,fill,op)=>`<polygon points="${arr.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" style="fill:${fill};stroke:${p.cs}" stroke-width="1" stroke-linejoin="round" ${op?`opacity="${op}"`:''}/>`;
  const faces=cubes.map(c=>{const x=(c.i-c.j)*a,y=(c.i+c.j)*b-c.k*s;
    return poly([[x,y],[x+a,y+b],[x,y+2*b],[x-a,y+b]],p.soft)+poly([[x-a,y+b],[x,y+2*b],[x,y+2*b+s],[x-a,y+b+s]],p.c,'.75')+poly([[x,y+2*b],[x+a,y+b],[x+a,y+b+s],[x,y+2*b+s]],p.cs,'.85');}).join('');
  const W=maxX-minX,H=maxY-minY;const scale=Math.min(1.6,220/W,150/H);
  return `<svg viewBox="${minX.toFixed(1)} ${minY.toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}" width="${(W*scale).toFixed(0)}" height="${(H*scale).toFixed(0)}">${faces}</svg>`;
}

/* Shuffled-bag picker (same pattern as the Reading Comprehension passage picker):

   nothing repeats until the whole bank has been used once -- and when the bag runs out
   and reshuffles, the freshly-shuffled bag is not allowed to start on the very item
   that was just drawn, so two consecutive draws (e.g. across "Start Session" clicks)
   never show the same question back-to-back. */

  let queue=[];
  let lastIdx=null;
  return function(){
    if(queue.length===0){
      let order;
      do{ order=shuffle(bank.map((_,i)=>i)); }while(bank.length>1 && lastIdx!==null && order[order.length-1]===lastIdx);

    lastIdx=idx;
    return buildQuestion(bank[idx],bank);

{q:"What was the lighthouse keepers' unbreakable rule?",choices:["The light could never go out","Ships had to pay a toll","No visitors were allowed","The tower had to be repainted yearly"],correct:"The light could never go out"},

{q:"Why did storms make the keepers' job especially important?",choices:["Storms turned off the electricity","Ships needed the light most exactly when it was hardest to keep burning","Storms brought more visitors","Storms made the ocean calmer"],correct:"Ships needed the light most exactly when it was hardest to keep burning"}

{title:"How the Printing Press Changed the World",
text:"Before the 1400s, every book in Europe had to be copied out by hand, letter by letter, which could take a monk almost a year to finish a single book. Because books took so long to make, only wealthy people or churches usually owned them, and most ordinary people never learned to read. Everything changed when a German craftsman built a printing press that used movable metal letters, which could be arranged, inked, and pressed onto paper again and again. Suddenly, dozens of copies of the same book could be made in the time it once took to make one. Within decades, printed books spread across Europe, and prices dropped low enough that merchants, teachers, and even students could afford them. As more people gained access to books, more people learned to read, and new ideas in science, religion, and politics could spread faster than ever before. Historians often point to the printing press as one of the most important inventions in human history, because it changed not just how books were made, but who got to read them.",
questions:[
{q:"What is this passage mostly about?",choices:["How the invention of the printing press made books cheaper and more widespread","How monks lived in the 1400s","Why paper was invented","How churches built libraries"],correct:"How the invention of the printing press made books cheaper and more widespread"},
{q:"What did copying a single book by hand often take?",choices:["Almost a year","A single afternoon","One week","Ten years"],correct:"Almost a year"},
{q:"What does ‘movable’ mean in the passage?",choices:["able to be moved or rearranged","stuck permanently in place","extremely heavy","made of paper"],correct:"able to be moved or rearranged"},
{q:"Why does the author call the printing press ‘one of the most important inventions in human history’?",choices:["Because it changed who could access books and ideas","Because it was the first machine ever built","Because it made paper cheaper to grow","Because monks demanded it"],correct:"Because it changed who could access books and ideas"}
]},
{title:"Chasing Monarchs",
text:"Each fall, millions of monarch butterflies leave their summer homes across the United States and Canada and begin an extraordinary journey south to central Mexico, flying up to 3,000 miles. What makes this trip remarkable is that no single butterfly completes the whole round trip alone. The monarchs that arrive in Mexico are actually the great-great-grandchildren of the ones that flew north the previous spring, since it takes four or five generations to finish the full cycle. Scientists still aren't entirely sure how each new generation knows exactly where to go, since none of them have made the journey before. Some researchers believe the butterflies use the position of the sun combined with an internal sense of time to navigate, similar to a built-in compass. Every winter, the mountain forests of Mexico turn orange and black as millions of monarchs cluster together on the trees to stay warm, creating one of the most stunning wildlife gatherings on Earth.",
questions:[
{q:"What is this passage mostly about?",choices:["How monarch butterflies migrate thousands of miles across generations","How butterflies build cocoons","Why Mexico has warm winters","How scientists tag insects"],correct:"How monarch butterflies migrate thousands of miles across generations"},
{q:"How far can the monarchs' journey stretch?",choices:["Up to 3,000 miles","About 50 miles","Around 200 miles","Nearly 10,000 miles"],correct:"Up to 3,000 miles"},
{q:"What does ‘generations’ mean in the passage?",choices:["groups of offspring born at different stages, like grandparents, parents, and children","types of butterflies","different colors of wings","seasons of the year"],correct:"groups of offspring born at different stages, like grandparents, parents, and children"},
{q:"Why is the monarch migration considered remarkable, according to the passage?",choices:["No single butterfly completes the whole trip alone; it takes several generations","Butterflies are the fastest flying insect","The trip only takes one day","Monarchs migrate in complete silence"],correct:"No single butterfly completes the whole trip alone; it takes several generations"}
]},
{title:"The Sleep Detectives",
text:"Scientists once thought the brain simply “shut off” during sleep, but modern research shows the opposite is true — a sleeping brain is remarkably busy. While the body rests, the brain sorts through everything learned that day, strengthening important memories and clearing out unnecessary clutter, much like tidying a cluttered desk at the end of a workday. During certain stages of sleep, the brain also flushes out waste products that build up during waking hours, a kind of nightly cleaning system. Studies on students have shown that those who sleep enough the night before a test tend to recall information better than those who stayed up studying instead. Without enough sleep, it becomes harder to focus, control emotions, and even fight off common illnesses. Doctors generally recommend that children and teenagers get between nine and eleven hours of sleep each night, since growing brains rely on that rest to develop properly. Skipping sleep to cram in extra study time, researchers warn, often backfires by making it harder to remember what was studied in the first place.",
questions:[
{q:"What is this passage mostly about?",choices:["Why sleep is essential for memory, focus, and health","How to build a bedroom for better sleep","Why students dislike tests","How doctors treat illnesses"],correct:"Why sleep is essential for memory, focus, and health"},
{q:"How many hours of sleep do doctors recommend for children and teenagers?",choices:["Between nine and eleven hours","Four to five hours","Fifteen hours","Exactly six hours"],correct:"Between nine and eleven hours"},
{q:"What does ‘clutter’ mean in the passage?",choices:["a messy collection of unnecessary things","a bright light","a loud noise","a type of food"],correct:"a messy collection of unnecessary things"},
{q:"Why might staying up late to study actually backfire, according to the passage?",choices:["Without enough sleep, the brain struggles to store and recall memories","Studying at night uses too much electricity","Teachers prefer students who sleep a lot","Sleep has nothing to do with memory"],correct:"Without enough sleep, the brain struggles to store and recall memories"}
]},
{title:"The Bridge That Bends",
text:"It might seem like the strongest bridge should be the stiffest one, but engineers actually design many bridges to bend and sway slightly on purpose. Wind, heavy traffic, and even earthquakes put constant stress on a bridge's structure, and a completely rigid bridge would have nowhere to send that stress except through cracks. Instead, engineers use flexible materials and clever designs, like expansion joints, which are small gaps that allow the bridge to expand in the heat and contract in the cold without buckling. Suspension bridges, held up by giant cables, are especially good at swaying gently in strong winds, which actually protects them from snapping. One famous bridge that collapsed decades ago taught engineers an important lesson: it wasn't built to handle a specific kind of wind-driven motion, and the vibrations grew until the bridge twisted itself apart. Since then, bridge designs are carefully tested in wind tunnels before construction begins, so today's bridges bend exactly as much as they're supposed to, and not a bit more.",
questions:[
{q:"What is this passage mostly about?",choices:["Why engineers design bridges to flex instead of staying perfectly rigid","How suspension cables are manufactured","Why earthquakes happen","How traffic lights are timed"],correct:"Why engineers design bridges to flex instead of staying perfectly rigid"},
{q:"What are expansion joints designed to do?",choices:["Let the bridge expand and contract without buckling","Make the bridge heavier","Stop all wind from reaching the bridge","Add extra lanes for traffic"],correct:"Let the bridge expand and contract without buckling"},
{q:"What does ‘rigid’ mean in the passage?",choices:["stiff and unable to bend","extremely colorful","very old","lightweight"],correct:"stiff and unable to bend"},
{q:"Why do engineers test bridge designs in wind tunnels before building them?",choices:["To make sure the bridge bends safely instead of vibrating apart","To paint the bridge before it's built","To count how many cars will use it","To decide what color to make it"],correct:"To make sure the bridge bends safely instead of vibrating apart"}
]},
{title:"The Community Garden Truce",
text:"For years, the Ridgewood and Elm Street families had argued over who was responsible for the overgrown, weed-choked lot between their two streets. Neither side wanted to spend the money to clean it up, and neither side wanted to back down first. Everything changed when a new neighbor, Mr. Osei, suggested turning the lot into a shared community garden instead of continuing the argument. At first, only a handful of skeptical neighbors showed up to help clear the weeds. But as raised garden beds went in and the first tomato seedlings were planted, more families started stopping by to help water, weed, and chat with neighbors they'd never really spoken to before. By midsummer, the once-abandoned lot was bursting with vegetables, and families from both streets were sharing the harvest at a weekly potluck. The years-long argument was never officially resolved with an apology or a vote — it simply became irrelevant once everyone had a shared reason to work together instead of against each other.",
questions:[
{q:"What is this passage mostly about?",choices:["How a shared garden project ends a long neighborhood argument","How to grow tomatoes","A contest between two garden clubs","Why vacant lots attract weeds"],correct:"How a shared garden project ends a long neighborhood argument"},
{q:"Who suggested turning the lot into a community garden?",choices:["Mr. Osei","A city council member","One of the original arguing families","A newspaper reporter"],correct:"Mr. Osei"},
{q:"What does ‘skeptical’ mean in the passage?",choices:["doubtful that something will work","extremely excited","completely certain","very generous"],correct:"doubtful that something will work"},
{q:"Why does the author say the argument ‘became irrelevant’ instead of being resolved with an apology?",choices:["Working together toward a shared goal made the old disagreement stop mattering","The families forgot they had ever argued","A judge ordered them to stop arguing","The garden failed and everyone moved away"],correct:"Working together toward a shared goal made the old disagreement stop mattering"}
]},
{title:"The Cave Painters",
text:"Deep inside a cave that had been sealed off by a rockslide for thousands of years, a team of researchers discovered walls covered in painted animals — horses, deer, and creatures that no longer exist today. The paint itself was made from ground minerals mixed with animal fat, applied using fingers, chewed sticks, and even hollow bones used to blow pigment onto the wall like a spray. What amazed the researchers most wasn't just the age of the paintings, but how skillfully they were made; the artists had used the natural bumps and curves of the rock to make the animals appear to have depth and motion, almost like an ancient form of 3-D art. Some paintings were placed in spots so deep and hard to reach that the artists must have worked by flickering torchlight for hours. Researchers still debate why the paintings were made at all — some believe they were part of religious ceremonies, while others think they simply recorded successful hunts. Whatever the reason, the cave offers a rare, direct window into how people communicated and expressed themselves tens of thousands of years before writing existed.",
questions:[
{q:"What is this passage mostly about?",choices:["The discovery of ancient, skillfully made cave paintings and what they reveal","How rockslides are formed","A modern art museum exhibit","How researchers dig for dinosaur bones"],correct:"The discovery of ancient, skillfully made cave paintings and what they reveal"},
{q:"What was the paint made from?",choices:["Ground minerals mixed with animal fat","Modern acrylic paint","Melted wax and berries","Dyed cloth"],correct:"Ground minerals mixed with animal fat"},
{q:"What does ‘pigment’ mean in the passage?",choices:["a substance that gives color to paint","a type of rock","a hollow bone tool","a kind of cave animal"],correct:"a substance that gives color to paint"},
{q:"Why do researchers still debate the purpose of the paintings?",choices:["There is no written record from that time to explain why they were made","The paintings were destroyed before being studied","The artists left detailed notes that contradict each other","Modern cameras couldn't capture the paintings clearly"],correct:"There is no written record from that time to explain why they were made"}
]},
{title:"Debate Night Jitters",
text:"Priya had prepared for weeks for the school debate, filling index cards with facts and practicing her opening argument in the mirror every night. But the moment she stepped up to the podium and saw the audience staring back at her, every fact she had memorized seemed to vanish from her mind at once. She glanced at her index cards, but her hands were shaking too much to read them clearly. In the silence, she noticed her debate partner, Marcus, give her a small, steady nod from the front row. Priya took a slow breath, set the cards down, and simply said what she actually believed in her own words instead of trying to recite memorized lines. Her voice wavered at first, but as she kept talking, it grew steadier. She didn't deliver the polished speech she had rehearsed, but she said something true, and the judges nodded along as she spoke. Afterward, her coach told her that the moment she stopped performing and started actually talking to the audience was the strongest part of her whole debate.",
questions:[
{q:"What is this passage mostly about?",choices:["A nervous student who overcomes stage fright by speaking honestly instead of reciting memorized lines","A debate about a school rule","A coach who writes a speech for a student","A student who forgets to prepare and fails"],correct:"A nervous student who overcomes stage fright by speaking honestly instead of reciting memorized lines"},
{q:"What happened when Priya tried to read her index cards?",choices:["Her hands were shaking too much to read them clearly","She read them perfectly","She lost the cards entirely","She gave them to Marcus"],correct:"Her hands were shaking too much to read them clearly"},
{q:"What does ‘wavered’ mean in the passage?",choices:["became unsteady or shaky","grew extremely loud","stopped completely","became perfectly calm"],correct:"became unsteady or shaky"},
{q:"Why did the coach say Priya's unscripted moment was the strongest part of her debate?",choices:["Because speaking honestly and directly connected with the audience more than a memorized speech would have","Because judges only reward long speeches","Because Marcus spoke instead of her","Because the memorized facts were incorrect"],correct:"Because speaking honestly and directly connected with the audience more than a memorized speech would have"}
]},
{title:"The Deep-Sea Explorers",
text:"Thousands of meters below the ocean's surface, sunlight completely disappears, and water pressure grows heavy enough to crush an unprotected submarine like a soda can. Yet this crushing, pitch-black world is far from empty. Scientists exploring these depths in specially reinforced submersibles have discovered fish with enormous eyes built to catch the faintest traces of light, along with creatures that produce their own glow through a chemical reaction called bioluminescence. Some deep-sea anglerfish dangle a glowing lure above their mouths to attract curious prey close enough to catch. Because food is scarce at such extreme depths, many deep-sea animals have adapted slow metabolisms, allowing them to survive for long stretches between meals. Exploring this environment is so difficult and expensive that scientists estimate humans have physically observed less of the deep ocean floor than they have of the surface of the moon. Every expedition tends to uncover species never recorded before, which is why many researchers consider the deep sea one of the last true frontiers left to explore on our own planet.",
questions:[
{q:"What is this passage mostly about?",choices:["The strange, difficult-to-explore world of deep-sea creatures and how they survive","How submarines are built","Why the moon has craters","How ocean currents form"],correct:"The strange, difficult-to-explore world of deep-sea creatures and how they survive"},
{q:"What is bioluminescence?",choices:["A chemical reaction that lets some creatures produce their own glow","A type of deep-sea rock","A tool scientists use to measure pressure","A kind of underwater volcano"],correct:"A chemical reaction that lets some creatures produce their own glow"},
{q:"What does ‘scarce’ mean in the passage?",choices:["rare or hard to find","overly abundant","brightly colored","extremely heavy"],correct:"rare or hard to find"},
{q:"Why does the author compare deep-sea exploration to the moon?",choices:["To show just how little of the deep ocean humans have actually seen and explored","To prove the moon is more interesting than the ocean","To explain how astronauts train","To argue that the deep sea is easier to explore than space"],correct:"To show just how little of the deep ocean humans have actually seen and explored"}
]},
{title:"The Recycling Robot",
text:"For their engineering class project, Talia's team was assigned an ambitious goal: build a machine that could sort plastic, metal, and paper without any human help. Their first prototype was a disaster — the sorting arm swung wildly and flung recyclables across the room instead of into the correct bins. Rather than giving up, the team broke the problem into smaller pieces, testing the sensor, then the arm, then the bins, one system at a time instead of all together. Talia's teammate Dev suggested using a magnet to pull out metal cans before the machine even tried to identify them visually, which turned out to be the breakthrough they needed. After nearly a month of small adjustments and countless test runs, their machine could finally sort a mixed pile of recyclables with about ninety percent accuracy. At the science fair, when a judge asked what the hardest part of the project was, Talia said it wasn't the coding or the wiring — it was learning to test one small piece at a time instead of expecting the whole complicated machine to work perfectly on the first try.",
questions:[
{q:"What is this passage mostly about?",choices:["A team that learns to solve a complex engineering problem by testing one piece at a time","A robot that wins a dance contest","A class that studies recycling laws","A judge who builds a sorting machine"],correct:"A team that learns to solve a complex engineering problem by testing one piece at a time"},
{q:"What breakthrough idea did Dev suggest?",choices:["Using a magnet to pull out metal cans before sorting visually","Painting the bins different colors","Adding a second sorting arm","Asking a judge for help"],correct:"Using a magnet to pull out metal cans before sorting visually"},
{q:"What does ‘prototype’ mean in the passage?",choices:["an early, test version of something being built","a finished, perfect product","a type of recycling bin","a school science fair"],correct:"an early, test version of something being built"},
{q:"What lesson did Talia take from the project, according to the passage?",choices:["Testing small pieces of a problem separately is more effective than expecting everything to work at once","Recycling machines are impossible to build","Judges always ask about coding","The first prototype should always work perfectly"],correct:"Testing small pieces of a problem separately is more effective than expecting everything to work at once"}
]},
{title:"Echoes in the Dark",
text:"Flying through a pitch-black cave at high speed, a bat has no need for light to avoid crashing into walls or catching a moving insect out of the air. Instead, bats rely on a remarkable system called echolocation: they emit rapid, high-pitched sounds, many too high for human ears to hear, and then listen closely to how those sounds bounce back after hitting nearby objects. By measuring the tiny delay between the sound leaving and its echo returning, a bat's brain can calculate not only how far away an object is, but roughly its size, shape, and even whether it's moving. Some bats can process these echoes quickly enough to track a single flying moth through dozens of sudden turns, adjusting their flight path in a fraction of a second. Engineers have studied echolocation closely because similar principles power sonar systems used by submarines and ultrasound machines used in hospitals to see inside the human body. What began as a way to understand a small flying mammal has ended up helping humans build tools to “see” through darkness and even through skin.",
questions:[
{q:"What is this passage mostly about?",choices:["How bats use echolocation to navigate and hunt in complete darkness","Why bats sleep upside down","How submarines are built","Why moths fly at night"],correct:"How bats use echolocation to navigate and hunt in complete darkness"},
{q:"What does a bat measure to figure out how far away an object is?",choices:["The delay between a sound leaving and its echo returning","The brightness of moonlight","The temperature of the cave","The size of its own wings"],correct:"The delay between a sound leaving and its echo returning"},
{q:"What does ‘emit’ mean in the passage?",choices:["to send out or release","to absorb completely","to freeze in place","to hide from view"],correct:"to send out or release"},
{q:"Why does the author mention sonar and ultrasound machines at the end of the passage?",choices:["To show how the science behind echolocation has helped humans build useful tools","To prove that bats invented sonar first","To explain how doctors treat broken bones","To argue that submarines are dangerous"],correct:"To show how the science behind echolocation has helped humans build useful tools"}
]}

{title:"The Speech That Fell Apart",text:"Mateo Silva had practiced his speech about ocean plastic eleven times. He had written every word on a stack of neat index cards, numbered in blue marker. When Ms. Adeyemi called his name at the school assembly, he walked to the microphone feeling ready.\n\nThen he tripped on the microphone cord.\n\nThe cards flew out of his hands and scattered across the stage like startled birds. A few students giggled. Mateo’s face burned. He knelt down, grabbed the nearest card, and read it aloud. It was card number seven, which began, “And that is why we must act today.” Nobody knew what “that” meant, because he hadn’t explained anything yet.\n\nMateo stared out at three hundred faces. For a long moment, he said nothing. Then he remembered something his older sister Lina had told him: “The cards are just reminders. The ideas live in your head.”\n\nHe set the cards down. “Okay,” he said, and his voice shook only a little. “Let me start over.” Then he told the audience about the sea turtle he had seen on a beach trip, tangled in a plastic bag, and how a lifeguard had carefully cut it free. He explained how long plastic lasts and what each class could do to use less of it.\n\nWhen he finished, the gym was quiet. Then the applause began, louder than he expected.\n\nAfterward, Ms. Adeyemi found him in the hallway. “Your speech didn’t go as planned,” she said with a smile, “but it was the most genuine one today.”\n\nMateo grinned. He still planned to use note cards next time. He would just hold on tighter, and trust himself more.",questions:[

{title:"Seventeen Kites",text:"Amara Nwosu wanted to build a kite that could fly on the calmest day of the year. Her grandfather, a retired bus mechanic, offered his garage and one piece of advice: “Write down everything, especially what goes wrong.”\n\nHer first kite was a diamond of newspaper and wooden skewers. It spun in circles and crashed into the lawn. In her notebook Amara wrote: Too heavy. Tail too short. Her second kite used tissue paper, which was lighter, but it ripped the moment the breeze touched it. Her third kite held together, but it tilted sideways like a sleepy pigeon.\n\nBy the tenth kite, Amara had filled half the notebook. Some pages were covered in sketches; others held wind measurements she took with a pinwheel and a stopwatch. She noticed a pattern: the kites that flew best had a longer tail and a frame that bent slightly instead of staying stiff.\n\n“Why don’t you just buy one?” her cousin Theo asked, watching kite number fourteen snap in half.\n\n“Because then I wouldn’t know why it works,” Amara said.\n\nKite seventeen was made of a thin plastic bag, bamboo strips, and a ribbon tail twice as long as the kite itself. On a still Sunday in August, when the leaves barely moved, Amara ran across the park and let out the string. The kite trembled, dipped, and then rose, climbing higher and higher until it was a small red speck against the clouds.\n\nGrandpa clapped. Theo stared with his mouth open. Amara opened her notebook to a fresh page and wrote at the top: Kite eighteen. How high can it go?",questions:[

{title:"The Waggle Dance: How Honeybees Share Directions",text:"A honeybee colony may send thousands of worker bees out each day to search for flowers. But when one bee finds a rich patch of nectar, how does she tell her sisters where to go? She dances.\n\nBeginning in the 1920s, an Austrian scientist named Karl von Frisch spent years watching bees inside glass-walled hives. He noticed that a forager returning from a good food source would move in a figure-eight pattern on the honeycomb. In the middle of each figure eight, she ran in a straight line while shaking her body from side to side. Von Frisch called this the “waggle dance.”\n\nThrough careful experiments in the 1940s, he discovered that the dance is a kind of map. The direction of the straight “waggle run” shows the direction of the food compared to the sun. If the bee waggles straight up the honeycomb, the food is in the same direction as the sun. If she waggles straight down, the food is in the opposite direction. The length of the waggle run tells distance: the longer the bee waggles, the farther away the flowers are.\n\nOther bees crowd close to the dancer, feeling her movements in the dark hive with their antennae. They also smell the flower scent on her body. Then they fly out to find the flowers themselves.\n\nNot every scientist believed von Frisch at first. It seemed impossible that an insect could share such detailed information. But later researchers confirmed his findings with new tools, including small radar tags attached to bees. In 1973, von Frisch shared the Nobel Prize for his discoveries about animal behavior.",questions:[

{q:"What is the author’s main purpose for writing this passage?",choices:["To explain how honeybees communicate and how a scientist discovered it","To persuade readers to keep beehives at home","To tell a funny made-up story about a dancing bee","To argue that bees are smarter than people"],correct:"To explain how honeybees communicate and how a scientist discovered it"}

{title:"Clinton’s Ditch: The Canal That Connected a Country",text:"In the early 1800s, moving goods across the United States was slow and costly. Farmers west of the Appalachian Mountains had rich land, but hauling a wagon of wheat over rough mountain roads could take weeks. Sometimes it cost more to ship a crop than the crop was worth.\n\nDeWitt Clinton, who became governor of New York in 1817, pushed for a bold solution: dig a canal from the Hudson River at Albany all the way to Lake Erie at Buffalo. The canal would stretch about 363 miles. Many people thought the idea was foolish. They mocked it as “Clinton’s Ditch.”\n\nConstruction began in 1817. Workers, including local farmers and many Irish immigrants, dug mostly by hand with shovels, picks, and horses. Because the land rose and fell along the route, engineers designed 83 locks. A lock is a chamber with gates at each end. When a boat enters, water is let in or out to raise or lower it to the next level, like a watery elevator.\n\nIn 1825, the Erie Canal opened. Governor Clinton rode a boat from Buffalo to New York City and poured a keg of Lake Erie water into the Atlantic Ocean to celebrate the connection.\n\nThe results were dramatic. The cost of shipping a ton of goods between Buffalo and New York City dropped from about $100 to about $10. Towns such as Rochester and Syracuse grew quickly along the canal. New York City became the busiest port in the nation. The “ditch” that people once laughed at had changed the country’s economy.",questions:[

{q:"Why did towns like Rochester and Syracuse most likely grow so quickly?",choices:["The canal brought boats, trade, and jobs to towns along its route.","The government moved the nation’s capital there.","They were built high in the mountains.","People left New York City to get away from the port."],correct:"The canal brought boats, trade, and jobs to towns along its route."},

{title:"Why Is Money Worth Anything?",text:"Take a dollar bill out of your pocket. It is just a small piece of paper and ink. You cannot eat it, wear it, or build with it. So why will a store give you an apple for it?\n\nLong ago, people did not use money at all. They bartered, which means they traded goods directly. A fisher might trade fish for a farmer’s grain. But bartering had a big problem. What if the farmer did not want fish? The fisher would have to find someone who wanted fish and also had something the farmer wanted. Trading could take all day.\n\nTo solve this problem, many societies began using objects that almost everyone valued, such as salt, shells, cattle, or pieces of metal. These objects became early forms of money. More than 2,500 years ago, the kingdom of Lydia, in what is now Turkey, made some of the world’s first coins. Each coin was stamped with a mark that promised its weight and quality, so people no longer needed to weigh metal for every trade.\n\nAbout a thousand years ago, China began printing paper money. Paper was much lighter than bags of heavy coins, which made it easier for merchants to travel and trade.\n\nToday, most money has almost no value on its own. A dollar bill is worth something because people trust that others will accept it, and because the government stands behind it. If people lost that trust, the paper would be worth about as much as a gum wrapper. In a way, money is a promise that everyone agrees to keep.",questions:[
{q:"What is the central idea of the passage?",choices:["Money developed over time to make trading easier, and today it works because people trust it.","Bartering is still the best way to trade goods.","The first coins in history were made in China.","Paper money is heavier and harder to carry than coins."],correct:"Money developed over time to make trading easier, and today it works because people trust it."},

{q:"What would most likely happen if people stopped trusting a country’s paper money?",choices:["Stores would stop accepting it, and it would lose its value.","The paper bills would become heavier.","Everyone would start using Lydian coins again.","Each bill would become worth more than before."],correct:"Stores would stop accepting it, and it would lose its value."},

{title:"How Does a Refrigerator Stay Cold?",text:"You might think a refrigerator works by blowing cold air into a box. Actually, a refrigerator does something different: it removes heat from the inside and moves it somewhere else.\n\nThe secret is a special fluid called a refrigerant, which travels through a closed loop of tubes. The refrigerant has an unusual property: it can boil and turn from a liquid into a gas at a very low temperature. When any liquid evaporates, it absorbs heat from its surroundings. You can feel this yourself. When you step out of a swimming pool, the water evaporating from your skin can make you shiver, even on a warm day.\n\nInside the refrigerator, the liquid refrigerant flows through coils and evaporates, soaking up heat from your milk, leftovers, and vegetables. Now it is a gas carrying that heat. Next, it travels to a pump called the compressor, usually near the bottom of the refrigerator. The compressor squeezes the gas tightly, which makes it much hotter than the kitchen air.\n\nThe hot gas then moves through coils on the back or bottom of the refrigerator. There, it gives off its heat into the kitchen air. That is why the back of a refrigerator often feels warm. As the refrigerant cools, it turns back into a liquid. Then it flows inside again, and the cycle repeats.\n\nBefore electric refrigerators became common in the 1930s and 1940s, many families kept food cold in an icebox, which needed fresh blocks of ice delivered regularly. Today, the same idea of moving heat is used in freezers, air conditioners, and even heat pumps that warm houses in winter.",questions:[
{q:"What is the central idea of the passage?",choices:["A refrigerator keeps food cold by moving heat from the inside to the outside.","A refrigerator blows cold air made by the compressor.","Iceboxes work better than modern refrigerators.","Swimming pools are colder than refrigerators."],correct:"A refrigerator keeps food cold by moving heat from the inside to the outside."},
{q:"Which part of the refrigerator squeezes the refrigerant gas?",choices:["The compressor","The icebox","The door seal","The vegetable drawer"],correct:"The compressor"},
{q:"In the passage, what does \"absorbs\" most likely mean?",choices:["Takes in","Gives off","Freezes solid","Pushes away"],correct:"Takes in"},
{q:"What would most likely happen if the coils on the back of a refrigerator were covered so heat could not escape?",choices:["The refrigerator would have trouble keeping food cold.","The food inside would freeze faster.","The refrigerant would turn into ice.","The kitchen would become much colder."],correct:"The refrigerator would have trouble keeping food cold."},
{q:"What is the author’s main purpose for writing this passage?",choices:["To explain how a refrigerator removes heat from food","To persuade readers to buy a new refrigerator","To tell the life story of the inventor of the icebox","To warn readers about the dangers of swimming pools"],correct:"To explain how a refrigerator removes heat from food"}
]},
{title:"Why Do Leaves Change Color in Fall?",text:"Every autumn, forests in many parts of the world turn gold, orange, and red. It looks as if someone painted the trees overnight. But many of those colors are not new at all. They were hiding in the leaves all summer.\n\nDuring spring and summer, leaves are busy making food for the tree. They use a green chemical called chlorophyll to capture energy from sunlight. This process is called photosynthesis. Leaves contain so much chlorophyll that its green color covers up everything else.\n\nAs fall arrives, the days grow shorter and the nights grow cooler. Trees sense these changes and begin preparing for winter, when there is not enough sunlight or liquid water for making food. The tree slowly stops producing chlorophyll, and the green color fades. Now other chemicals that were there all along can finally be seen. Carotenoids, the same pigments that make carrots orange, show up as yellow and orange.\n\nRed and purple colors work differently. They come from chemicals called anthocyanins, which many trees make fresh in the fall. Sunny days and cool nights help trees produce more of them. That is why an autumn with lots of bright, sunny days and cool nights often has the most dazzling red maples.\n\nEventually, the tree grows a special layer of cells where each leaf stem meets the branch. This layer seals off the leaf, which then dries out and falls. By dropping its leaves, the tree saves water and energy through the winter. When spring returns, new green leaves appear, and the cycle begins again.",questions:[
{q:"What is the central idea of the passage?",choices:["Leaves change color in fall because trees stop making chlorophyll and other pigments show.","Trees paint their leaves in fall to attract animals.","Carrots and leaves both make food using sunlight.","Leaves fall because animals chew through their stems."],correct:"Leaves change color in fall because trees stop making chlorophyll and other pigments show."},
{q:"What gives leaves their green color?",choices:["Chlorophyll","Carotenoids","Anthocyanins","Water"],correct:"Chlorophyll"},
{q:"In the passage, what does \"seals off\" most likely mean?",choices:["Closes so nothing can pass through","Decorates with bright colors","Opens wide to let in water","Helps something grow larger"],correct:"Closes so nothing can pass through"},
{q:"A town has an autumn with mostly cloudy, rainy days. What can the reader conclude about its trees?",choices:["They will probably show fewer bright reds.","They will keep making chlorophyll all winter.","Their leaves will turn blue instead of red.","They will never drop their leaves."],correct:"They will probably show fewer bright reds."},

/* A learner's full skill list = their own grade + the NEXT grade up ("stretch" skills,
   locked until earned — "no ceiling") + the Life Skills for their age band. */
function buildSkillList(gradeKey){
  const t=GRADE_TIERS[gradeKey];
  const base=t.skills.map(s=>Object.assign({},s,{grade:gradeKey,stretch:false}));
  const next=t.next?GRADE_TIERS[t.next].skills.map(s=>Object.assign({},s,{grade:t.next,stretch:true})):[];
  const life=t.life.map(s=>Object.assign({},s,{grade:gradeKey,stretch:false}));
  return base.concat(next,life);
}
function gradeKeyForGrade(g){ g=parseInt(g,10)||2; return g<=2?'g2':(g===3?'g3':(g===4?'g4':'g5')); }
function projectBand(gradeKey){ return (gradeKey==='g4'||gradeKey==='g5')?'g4':'g2'; }

/* Any student account beyond the two pre-seeded ones (osmand/oliver) gets a
   fresh learner slot here at runtime, keyed by their own username, once approved. */
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return h;}
const LEARNER_MASCOTS=['comet','rocket'];
function tierForGrade(g){ const key=gradeKeyForGrade(g); return{skills:buildSkillList(key),passages:GRADE_TIERS[key].passages,gradeKey:key}; }
/* ---- "No ceiling" unlock rules ----
   A stretch (next-grade) skill opens when its prerequisite is MASTERED — Alpha's rule
   that you prove mastery before moving on — or when a Guide unlocks it early from
   Camp Log. Once a child has started a stretch skill it never re-locks. */
function isSkillUnlocked(learnerId,skill){
  if(!skill||!skill.stretch) return true;
  const l=APP.learners[learnerId];
  if(l&&l.unlockedSkills&&l.unlockedSkills[skill.id]) return true;
  const ss=APP.skillStates[learnerId]||{};
  if(skill.prereq&&ss[skill.prereq]&&ss[skill.prereq].mastered) return true;
  const own=ss[skill.id];
  return !!(own&&own.totalAnswered>0);
}
function unlockReason(learnerId,skill){
  if(!skill.stretch) return 'base';
  const ss=APP.skillStates[learnerId]||{};
  if(skill.prereq&&ss[skill.prereq]&&ss[skill.prereq].mastered) return 'mastery';
  const l=APP.learners[learnerId];
  if(l&&l.unlockedSkills&&l.unlockedSkills[skill.id]) return 'guide';
  const own=ss[skill.id];
  if(own&&own.totalAnswered>0) return 'started';
  return 'locked';
}
function visibleSkills(learnerId){ return LEARNERS_META[learnerId].skills.filter(s=>isSkillUnlocked(learnerId,s)); }
function skillPassages(learnerId,skill){ return (skill&&skill.passages)||LEARNERS_META[learnerId].passages; }
function skillDisplayLabel(s){ return s.stretch?`${s.label} (${GRADE_TIERS[s.grade].label})`:s.label; } // disambiguates e.g. two "Vocabulary" skills
function baseComprehensionSkill(meta){ return meta.skills.find(s=>s.isComprehension&&!s.stretch); }
function ensureDynamicLearnerMeta(user){

}
function ensureLearnerRuntimeState(user){

/* ================= ADAPTIVE ENGINE ================= */
/* Mastery tiers: reaching difficulty 5 with solid accuracy used to be a dead end —
   "mastered" just flipped to true and nothing about the skill card ever changed
   again, however much more the child practiced it (reported: "level 到master之後
   沒有任何變化"). Tiers give practice AFTER first mastery somewhere to go: staying
   at difficulty 5 and keeping accuracy up over a growing number of questions climbs
   through named tiers, each with its own badge, pill and elevation-path flourish.
   Tiers are a ratchet (computeMasteryTier never returns lower than the stored tier)
   so a temporary rough patch that drops difficulty below 5 doesn't erase progress
   already earned. */
const MASTERY_TIER_THRESHOLDS=[10,30,60,100]; // totalAnswered needed for tier 1..4
const MASTERY_TIER_LABELS=['','Master','Master II','Master III','Legend'];
function computeMasteryTier(state){
  const prior=state.masteryTier||0;
  if(state.difficulty<MAX_DIFFICULTY) return prior;
  const last10=state.history.slice(-10);
  const acc=last10.length?last10.reduce((a,v)=>a+v,0)/last10.length:0;
  if(state.totalAnswered<MASTERY_TIER_THRESHOLDS[0]||acc<0.85) return prior;
  let tier=0;
  for(let i=0;i<MASTERY_TIER_THRESHOLDS.length;i++){ if(state.totalAnswered>=MASTERY_TIER_THRESHOLDS[i]) tier=i+1; }
  return Math.max(prior,tier);
}
function makeSkillState(){return{difficulty:1,streakCorrect:0,streakWrong:0,history:[],totalAnswered:0,totalCorrect:0,mastered:false,masteryTier:0,lastPracticed:null,passageIndex:0,passagesCompleted:[],passagePoolOrder:null,passagePoolPos:0};}
function applyAnswer(state,correct){
  state.totalAnswered++; if(correct)state.totalCorrect++;
  state.history.push(correct?1:0); if(state.history.length>20)state.history.shift();
  if(correct){state.streakCorrect++;state.streakWrong=0; if(state.streakCorrect>=3&&state.difficulty<MAX_DIFFICULTY){state.difficulty++;state.streakCorrect=0;}}
  else{state.streakWrong++;state.streakCorrect=0; if(state.streakWrong>=2&&state.difficulty>1){state.difficulty--;state.streakWrong=0;}}
  state.masteryTier=computeMasteryTier(state);
  state.mastered=state.masteryTier>=1;
  state.lastPracticed=todayStr();
  return state;
}

/* ================= VISUAL POLISH HELPERS =================

function svgClock(h,m){
  const uid=svgUid();

  let ticks='';
  for(let i=0;i<12;i++){

function svgDotsPile(n,color,x0,y0,w0,h0){

  const rows=Math.ceil(n/cols);
  const padX=Math.min(14,w0*0.08), padY=Math.min(14,h0*0.12);
  const cellW=(w0-padX*2)/cols, cellH=(h0-padY*2)/Math.max(rows,1);

    const cx=x0+padX+cellW*col+cellW/2, cy=y0+padY+cellH*row+cellH/2;

/* ================= CREATURE COMPANION (original creature-collector theme) =================

function svgElevationPath(difficulty,mastered,color,masteryTier){
  masteryTier=masteryTier||0;

  const baseSeg=pts.map((p,i)=>(i===0?'M':'L')+p[0]+' '+p[1]).join(' ');

    <path d="${activeSeg}" fill="none" style="stroke:${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

/* ================= SOUND EFFECTS (synthesized, no external audio assets) =================
   Request: "加入一些過關音效" (add some pass/completion sound effects). Every effect
   below is a handful of Web Audio oscillator "blips" with a quick attack and an
   exponential decay -- no audio files to fetch, so the app stays one offline-capable
   HTML file. Muted with a small speaker toggle in the topbar; the on/off preference
   is a per-device convenience, so it lives in localStorage rather than the synced
   learner record. */
let _actx=null;
function _audioCtx(){
  if(_actx) return _actx;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ _actx=new AC(); }catch(e){ _actx=null; }
  return _actx;
}
function soundEnabled(){
  try{ const v=localStorage.getItem('twopeaks:sound'); return v===null?true:v==='on'; }catch(e){ return true; }
}
function setSoundEnabled(on){
  try{ localStorage.setItem('twopeaks:sound',on?'on':'off'); }catch(e){}
}
function toggleSound(){ setSoundEnabled(!soundEnabled()); if(soundEnabled()) SFX.correct(); render(); }
/* notes: [{freq,start,dur,type,gain}] (start/dur in seconds, relative to "now"). */
function playNotes(notes){
  if(!soundEnabled()) return;
  const ctx=_audioCtx(); if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume().catch(()=>{});
  const now=ctx.currentTime;
  notes.forEach(n=>{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=n.type||'sine'; osc.frequency.value=n.freq;
    const t0=now+(n.start||0), dur=n.dur||0.16, peak=n.gain!=null?n.gain:0.16;
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.exponentialRampToValueAtTime(peak,t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  });
}
const SFX={
  correct(){ playNotes([{freq:880,start:0,dur:.14},{freq:1318.51,start:.07,dur:.18}]); },
  wrong(){ playNotes([{freq:196,start:0,dur:.24,type:'triangle',gain:.13}]); },
  sessionComplete(){ playNotes([{freq:523.25,start:0,dur:.16},{freq:659.25,start:.12,dur:.16},{freq:783.99,start:.24,dur:.3}]); },
  celebrate(){ playNotes([{freq:523.25,start:0,dur:.14},{freq:659.25,start:.1,dur:.14},{freq:783.99,start:.2,dur:.14},{freq:1046.5,start:.3,dur:.42}]); },
};
/* Celebration confetti burst for level-ups, mastery and badges. Skips animation if the viewer prefers reduced motion. */
function burstConfettiBig(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas=document.createElement('canvas');
  canvas.style.position='fixed'; canvas.style.inset='0'; canvas.style.pointerEvents='none'; canvas.style.zIndex='999';
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d'); if(!ctx){canvas.remove();return;}
  const colors=['#E8912E','#1F8A82','#3D8F5B','#C6435A','#F2C94C','#7EDDD4'];
  const pieces=Array.from({length:90},()=>({
    x:canvas.width/2+randInt(-120,120), y:canvas.height*0.3+randInt(-30,30),
    vx:(Math.random()-0.5)*9, vy:Math.random()*-7-3,
    size:randInt(5,9), color:pick(colors), rot:Math.random()*360, vrot:(Math.random()-0.5)*12
  }));
  let frame=0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.vy+=0.22; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    if(frame<75) requestAnimationFrame(tick); else canvas.remove();
  }
  tick();
}

/* ================= PERSISTENCE =================
   Cloud sync uses Firebase Realtime Database (see firebaseConfig + the
   firebase-*-compat.js <script> tags loaded in <head>), so this app can be
   hosted anywhere (e.g. GitHub Pages) and shared with a public link while
   still syncing the family roster + progress across devices. If the
   Firebase SDK fails to load or init (offline, blocked script, etc.),
   everything falls back to this browser's own localStorage. */
const Store={
  db:null,
  async init(){
    try{
      if(window.firebase && window.firebase.initializeApp && typeof FIREBASE_CONFIG!=='undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey){
        if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        this.db=firebase.database();
      }
    }
    catch(e){ console.warn('firebase init failed',e); this.db=null; }
  },
  _lsKey(path){return 'twopeaks:'+path;},
  lsGet(path){ try{const raw=localStorage.getItem(this._lsKey(path)); return raw?JSON.parse(raw):null;}catch(e){return null;} },
  lsSet(path,data){ try{localStorage.setItem(this._lsKey(path),JSON.stringify(data));}catch(e){} },
  async dbGet(path){
    if(!this.db)return null;
    try{ const snap=await this.db.ref(path).once('value'); return snap.exists()?snap.val():null; }
    catch(e){ console.warn('db get failed',path,e); return null; }
  },
  dbSet(path,data){
    if(!this.db)return;
    try{ this.db.ref(path).set(data).catch(e=>console.warn('db set failed',path,e)); }
    catch(e){ console.warn('db set threw',path,e); }
  },
  save(path,data){ this.writeSeq++; this.lastWrite[path]=this.writeSeq; this.lsSet(path,data); this.dbSet(path,data); },
  /* Like save(), but merges the given fields into the node instead of replacing it — so
     child nodes that are stored separately (a learner's skills/ and workshop/) survive. */
  saveFields(path,data){ this.writeSeq++; this.lastWrite[path]=this.writeSeq; this.lsSet(path,data); this.dbUpdate(path,data); },
  dbUpdate(path,data){
    if(!this.db)return;
    try{ this.db.ref(path).update(data).catch(e=>console.warn('db update failed',path,e)); }
    catch(e){ console.warn('db update threw',path,e); }
  },
  /* Race guard for refreshCloudData(): a cloud read that was sent BEFORE this device saved
     newer data to the same path must not overwrite that newer data when it arrives.
     (Found in live testing: tap a tab — which starts a background re-sync — then start a
     session right away, and the re-sync would land mid-session and roll the answers back
     to the pre-session copy; the next save then pushed that stale copy to the cloud.) */
  writeSeq:0, lastWrite:{},
  savedSince(path,seq){ return (this.lastWrite[path]||0)>seq; }
};

async function loadAllData(){
